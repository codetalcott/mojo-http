# The only [build-system] in this repository, and deliberately not in the root
# pyproject.toml. Adding one there would make uv treat the repo as an
# installable package: `uv sync` would try to build it, that build needs
# bin/m0serve, and building bin/m0serve needs the .venv that `uv sync` is
# creating. The root stays a virtual project; this is a separate one.
#
# Wheels only, no sdist. An sdist cannot build without the Mojo toolchain, a
# compiled binary and the repository root that hatch_version.py reads -- so
# publishing one would turn a clean "no matching distribution" on an
# unsupported platform into a confusing backend traceback.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "m0serve"
dynamic = ["version"]
description = "A WSGI/ASGI server for Python applications, written in Mojo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wm Talcott", email = "32972881+codetalcott@users.noreply.github.com" }]
keywords = ["wsgi", "asgi", "server", "mojo", "django", "sse", "websocket"]

# Not plain MIT. The wheel carries the Mojo runtime, which is Apache-2.0 with
# LLVM Exceptions, and statically embeds the MIT-licensed lightbug_http fork.
# See licenses/NOTICE.m0serve.txt for what is inside and why.
license = "MIT AND Apache-2.0 WITH LLVM-exception"
license-files = ["licenses/*"]

# Deliberately empty. m0serve resolves libpython from the interpreter it is
# installed beside; it imports nothing and needs nothing fetched. The
# release smoke asserts this by installing with --no-index --network none.
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[project.urls]
Homepage = "https://github.com/codetalcott/mojo-http"
Source = "https://github.com/codetalcott/mojo-http"
Changelog = "https://github.com/codetalcott/mojo-http/blob/main/CHANGELOG.md"

[project.scripts]
m0serve = "m0serve.__main__:main"

[tool.hatch.version]
source = "code"
path = "hatch_version.py"
expression = "read_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/m0serve"]
# Hatchling excludes VCS-ignored files by default, and _bin/_lib/licenses ARE
# gitignored because they are build output staged in by `poe stage-wheel`.
# Without this the wheel ships the shim and nothing for it to exec, which
# installs perfectly and fails on first use -- the easiest way to produce a
# broken wheel that looks fine.
artifacts = [
  "src/m0serve/_bin/**",
  "src/m0serve/_lib/**",
  "src/m0serve/licenses/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# See the note at the top: an sdist here cannot build.
exclude = ["*"]
