[project]
name = "mojo-http"
version = "0.1.0"
description = "HTTP server and web framework for Mojo — routing, content negotiation, SSE, and a maintained lightbug_http fork"
authors = [{ name = "Wm Talcott", email = "32972881+codetalcott@users.noreply.github.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

# `mojo` brings the whole toolchain: mojo, mojo-lsp-server, mojo-lldb, mblack.
# MAX is deliberately not a dependency — nothing in packages/ or apps/ imports it.
dependencies = [
    "mojo==1.0.0",
]

[dependency-groups]
dev = [
    "django>=5.2.17",
    "poethepoet>=0.30",
]

# No [build-system]: this is a virtual project. uv manages the environment but
# does not install the repo itself.

# ---------------------------------------------------------------------------
# Tasks — `uv run poe <task>`
# ---------------------------------------------------------------------------

# Tasks run from the repo root (poe resolves cwd to the pyproject.toml
# directory), so the relative -I paths below are stable regardless of where
# `uv run poe` is invoked from.
#
# Run tasks against .venv directly. poe would otherwise auto-detect uv and wrap
# every task in `uv run`, which re-syncs the venv to uv.lock — that silently
# reverts a `nightly-try` toolchain override and makes the canary a no-op.
[tool.poe.executor]
type = "virtualenv"

# --- Build -----------------------------------------------------------------
# Each package precompiles to a .mojoc that downstream packages import via -I.
# .mojoc files are locked to the exact compiler version that produced them, so
# a toolchain change requires a full rebuild.

[tool.poe.tasks.build-core]
help = "Build m0-core package"
shell = "cd packages/m0-core && mojo precompile src -o m0_core.mojoc"

[tool.poe.tasks.build-http]
help = "Build m0-http package (includes the lightbug_http fork)"
shell = "cd packages/m0-http && mojo precompile src -I ../m0-core/ -o m0_http.mojoc"

# consts.mojo and sse.mojo import nothing outside themselves, so the wire
# format stays usable standalone. stream.mojo and signals.mojo are the server
# glue and do depend on m0-http (which transitively needs m0-core), hence both
# -I flags. A .mojoc does not bundle its dependencies, so anything importing
# m0_datastar must pass all three -I paths.
[tool.poe.tasks.build-datastar]
help = "Build m0-datastar package"
shell = "cd packages/m0-datastar && mojo precompile src -I ../m0-http/ -I ../m0-core/ -o m0_datastar.mojoc"

# apps/ is the only place the packages get composed, and a broken example is
# the most visible kind of breakage this repo can ship. Compiles every app to a
# temp dir and throws the binaries away.
[tool.poe.tasks.build-apps]
help = "Compile every example app (catches broken examples in CI)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
for app in apps/*/server.mojo; do
  name=$(basename "$(dirname "$app")")
  echo "building $name"
  mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ \
    -I packages/m0-wsgi/ -I apps/ "$app" -o "$out/$name" || exit 1
done
echo "all apps built"
"""

# NOTE ON -I ORDER: every package's sources live in a directory named `src`, so
# `from src.x import ...` in a test resolves against whichever -I root is
# searched first. The package under test must therefore come first, or its
# tests silently bind to another package's `src`. The tasks above happen to work
# because their module names do not collide; this one would not.
[tool.poe.tasks.test-wsgi]
help = "Test m0-wsgi (mapping logic only; needs no interpreter)"
shell = "for f in packages/m0-wsgi/test/test_*.mojo; do mojo run -I packages/m0-wsgi -I packages/m0-core -I packages/m0-http \"$f\" || exit 1; done"

# m0-sqlite depends on nothing in this repo — it is a sibling of m0-core and
# m0-http, not a layer on them — so it needs no -I at build time, and consumers
# need only -I packages/m0-sqlite. It links against the system libsqlite3.
[tool.poe.tasks.build-sqlite]
help = "Build m0-sqlite package"
shell = "cd packages/m0-sqlite && mojo precompile src -o m0_sqlite.mojoc"

# m0-wsgi is the only package that embeds CPython. It layers on m0-http exactly
# as m0-datastar does; keeping it a separate package is what stops libpython
# from landing on the link line of every other build in the repo.
[tool.poe.tasks.build-wsgi]
help = "Build m0-wsgi package (embeds CPython)"
shell = "cd packages/m0-wsgi && mojo precompile src -I ../m0-http/ -I ../m0-core/ -o m0_wsgi.mojoc"

[tool.poe.tasks.build-all]
help = "Build all packages in dependency order"
sequence = ["build-core", "build-http", "build-datastar", "build-wsgi", "build-sqlite"]
default_item_type = "ref"

[tool.poe.tasks.clean]
help = "Remove build artifacts"
shell = "find packages \\( -name '*.mojoc' -o -name '*.mojopkg' \\) -delete"

# --- Test ------------------------------------------------------------------

[tool.poe.tasks.test-core]
help = "Test m0-core"
shell = "for f in packages/m0-core/test/test_*.mojo; do mojo run -I packages/m0-core \"$f\" || exit 1; done"

[tool.poe.tasks.test-http]
help = "Test m0-http"
shell = "for f in packages/m0-http/test/test_*.mojo; do mojo run -I packages/m0-core -I packages/m0-http \"$f\" || exit 1; done"

[tool.poe.tasks.test-datastar]
help = "Test m0-datastar"
shell = "for f in packages/m0-datastar/test/test_*.mojo; do mojo run -I packages/m0-core -I packages/m0-http -I packages/m0-datastar \"$f\" || exit 1; done"

# Built and run, not `mojo run`. The JIT resolves symbols only from libraries
# already loaded into its process: on macOS libsqlite3 is in the dyld shared
# cache so `mojo run` happens to work, but on Linux it fails with
# "JIT session error: Symbols not found: [sqlite3_open_v2, ...]". Linking
# explicitly works identically on both, so both do it.
# Linux also needs the library present at link time: libsqlite3-dev.
[tool.poe.tasks.test-sqlite]
help = "Test m0-sqlite (links libsqlite3; Linux needs libsqlite3-dev)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
for f in packages/m0-sqlite/test/test_*.mojo; do
  name=$(basename "$f" .mojo)
  mojo build -I packages/m0-sqlite -Xlinker -lsqlite3 "$f" -o "$out/$name" || exit 1
  "$out/$name" || exit 1
done
"""

[tool.poe.tasks.test-all]
help = "Run all package tests (builds .mojoc files first)"
sequence = ["build-all", "test-core", "test-http", "test-datastar", "test-wsgi", "test-sqlite", "build-apps"]
default_item_type = "ref"

# --- Serve -----------------------------------------------------------------
# apps/hello imports only lightbug_http, but lightbug_http/event_loop.mojo
# imports m0_http.log, which was built against m0-core — so both -I paths are
# required even though server.mojo names neither.

[tool.poe.tasks.serve-hello]
help = "Run hello server on :8080"
cmd = "mojo run -I packages/m0-core/ -I packages/m0-http/ apps/hello/server.mojo"

[tool.poe.tasks.serve-counter]
help = "Run the Datastar counter demo on :8080"
cmd = "mojo run -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ -I apps/ apps/datastar_counter/server.mojo"

[tool.poe.tasks.serve-django]
help = "Run the Django WSGI example on :8080 (needs the django dev dependency)"
cmd = "mojo run -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-wsgi/ -I apps/ apps/django_wsgi/server.mojo"

[tool.poe.tasks.smoke-hello]
help = "Start serve-hello, assert /health, stop"
shell = """
mojo run -I packages/m0-core/ -I packages/m0-http/ apps/hello/server.mojo > hello.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null' EXIT
curl --retry 20 --retry-delay 3 --retry-all-errors --silent --fail http://localhost:8080/health \
  || { echo '=== hello.log ==='; cat hello.log; exit 1; }
echo
echo "smoke-hello OK"
"""

[tool.poe.tasks.smoke-counter]
help = "Start the counter demo, assert an SSE broadcast reaches a client, stop"
shell = """
mojo run -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ -I apps/ \
  apps/datastar_counter/server.mojo > counter.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null' EXIT
curl --retry 20 --retry-delay 3 --retry-all-errors --silent --fail http://localhost:8080/health \
  || { echo '=== counter.log ==='; cat counter.log; exit 1; }
curl -sN --max-time 6 -H 'Accept: text/event-stream' http://localhost:8080/events > sse.txt &
sse=$!
sleep 2
curl -s -X POST http://localhost:8080/increment -o /dev/null
sleep 2
kill $sse 2>/dev/null
grep -q 'event: datastar-patch-signals' sse.txt \
  || { echo 'no Datastar frame reached the client'; cat sse.txt; exit 1; }
grep -q 'data: signals {"count":1}' sse.txt \
  || { echo 'broadcast did not carry the new count'; cat sse.txt; exit 1; }
grep -q 'data: event:' sse.txt && { echo 'frame was double-framed'; exit 1; }
rm -f sse.txt
echo "smoke-counter OK"
"""

# Each assertion below pins down one part of the WSGI bridge. They are cheap to
# run and expensive to lose: every one of them failed at some point while the
# bridge was being written. The server is compiled once and started twice:
# single-worker for the bridge assertions, then M0_WORKERS=2 for the prefork
# concurrency assertions.
[tool.poe.tasks.smoke-django]
help = "Start the Django example, assert a real request/response cycle (single-worker, then M0_WORKERS=2), stop"
shell = """
out=$(mktemp -d)
srv="$out/django_server"
mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-wsgi/ -I apps/ \
  apps/django_wsgi/server.mojo -o "$srv" || exit 1

cleanup() {
  kill $pid $worker_pids 2>/dev/null
  rm -rf "$out"
}
trap cleanup EXIT

"$srv" > django.log 2>&1 &
pid=$!

fail() {
  echo "$1"; echo '=== django.log ==='; cat django.log
  if [ -f django2.log ]; then echo '=== django2.log ==='; cat django2.log; fi
  exit 1
}

# The view's own body proves the request reached Django and came back.
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail http://localhost:8080/ \
  | grep -q 'hello from django on mojo-http' || fail 'GET / did not return the view body'

# Headers is a Dict[String, String], so a naive mapping keeps only the last
# Set-Cookie. Django sets sessionid and csrftoken as two separate headers.
n=$(curl -s -i http://localhost:8080/cookies | grep -ci '^set-cookie:')
[ "$n" = "2" ] || fail "expected 2 Set-Cookie headers, got $n"

# wsgi.input: the request body has to survive the crossing.
echo 'round-trip-me' | curl -s --data-binary @- http://localhost:8080/echo \
  | grep -q 'round-trip-me' || fail 'POST body did not round-trip'

# QUERY_STRING reaches Django's request.GET rather than being swallowed.
curl -s 'http://localhost:8080/query?name=ada+lovelace' \
  | grep -q 'ada lovelace' || fail 'QUERY_STRING did not reach the view'

# All 256 byte values, unchanged. A latin-1 round trip through a Mojo String
# would corrupt everything above 0x7F, since Mojo strings are UTF-8.
python3 -c 'import sys; sys.stdout.buffer.write(bytes(range(256)))' > expected.bin
curl -s http://localhost:8080/binary > got.bin
cmp -s expected.bin got.bin || fail "binary body was corrupted in transit ($(wc -c < got.bin) bytes)"
rm -f expected.bin got.bin

# The response mapper must carry Django's status, not hard-code 200.
code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)
[ "$code" = "404" ] || fail "expected 404 from Django urls.py, got $code"

# A view that raises becomes the server's 500 rather than killing the process.
code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/boom)
[ "$code" = "500" ] || fail "expected 500 from a raising view, got $code"

# ...and the server is still answering afterwards.
curl -s --fail http://localhost:8080/ > /dev/null || fail 'server died after a view raised'

# One process by default, and the environ says so.
curl -s http://localhost:8080/wsgi | grep -q 'multiprocess=False' \
  || fail 'wsgi.multiprocess was not False with one worker'

# The bridge must not leak per request. Mojo 1.0's PythonObject interop leaks
# one reference per call argument and per setitem value, which is why requests
# cross as a byte blob (see m0-wsgi/src/bridge.mojo). The pre-blob bridge
# leaked ~2.3KB/request — ~23MB over this loop; 12MB allows allocator noise.
rss0=$(ps -o rss= -p $pid | tr -d ' ')
python3 - <<'PYEOF'
import http.client
done = attempts = 0
conn = http.client.HTTPConnection("localhost", 8080)
while done < 10000 and attempts < 20000:
    attempts += 1
    try:
        conn.request("GET", "/")
        conn.getresponse().read()
        done += 1
    except Exception:
        conn.close()
        conn = http.client.HTTPConnection("localhost", 8080)
conn.close()
raise SystemExit(0 if done >= 10000 else 1)
PYEOF
[ $? = 0 ] || fail 'leak-check load loop could not complete 10k requests'
rss1=$(ps -o rss= -p $pid | tr -d ' ')
growth=$((rss1 - rss0))
[ "$growth" -lt 12288 ] || fail "bridge leaked ${growth}KB of RSS over 10k requests"

kill $pid 2>/dev/null
wait $pid 2>/dev/null

# --- M0_WORKERS=2: the prefork path -----------------------------------------

M0_WORKERS=2 "$srv" > django2.log 2>&1 &
pid=$!

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail http://localhost:8080/ \
  | grep -q 'hello from django on mojo-http' || fail 'GET / failed with M0_WORKERS=2'

# Workers are forks of the supervisor, not children of this shell, so $pid
# alone cannot reach them at cleanup. Their pids exist only in the log
# ("[worker N] pid=... starting") — capture them now, before the log is gone.
worker_pids=$(grep -oE 'pid=[0-9]+' django2.log | cut -d= -f2 | sort -u)

# Each worker built its own WSGIApp after fork, with multiprocess=True.
curl -s http://localhost:8080/wsgi | grep -q 'multiprocess=True' \
  || fail 'wsgi.multiprocess was not True with two workers'

# Correctness holds when a different process may answer each request.
curl -s 'http://localhost:8080/query?name=ada+lovelace' \
  | grep -q 'ada lovelace' || fail 'QUERY_STRING broke under M0_WORKERS=2'

# Two overlapping 1.5s requests must finish in ~1x the view latency, not 2x.
# Workers accept from one shared pre-fork listener, and a worker that is busy
# in a view never accepts, so the pair should land on two distinct workers
# every time — but the retry loop stays rather than trusting a single race.
# A server that never spreads the pair across two workers fails after 8
# attempts; that is what a macOS-style per-worker SO_REUSEPORT bind does
# (all connections to one socket), which is why the listener is shared.
parallel_ok=0
attempt=0
while [ $attempt -lt 8 ]; do
  attempt=$((attempt + 1))
  start=$(date +%s)
  curl -s http://localhost:8080/slow > slow1.txt &
  c1=$!
  curl -s http://localhost:8080/slow > slow2.txt &
  c2=$!
  wait $c1 $c2
  elapsed=$(( $(date +%s) - start ))
  grep -q 'slow done' slow1.txt || fail 'first /slow response was wrong'
  grep -q 'slow done' slow2.txt || fail 'second /slow response was wrong'
  pid1=$(cut -d= -f2 slow1.txt)
  pid2=$(cut -d= -f2 slow2.txt)
  if [ "$pid1" != "$pid2" ]; then
    [ "$elapsed" -lt 3 ] || fail "distinct workers, yet overlapping requests took ${elapsed}s"
    parallel_ok=1
    break
  fi
done
[ "$parallel_ok" = 1 ] || fail 'the request pair never reached two distinct workers in 8 attempts'
rm -f slow1.txt slow2.txt

rm -f django.log django2.log
echo "smoke-django OK"
"""

# --- Benchmarks ------------------------------------------------------------

[tool.poe.tasks.bench-core]
help = "Benchmark m0-core hot paths"
cmd = "mojo packages/m0-core/run_benchmarks.mojo"

# Built and run rather than `mojo run`, for the same libsqlite3 linking reason
# as test-sqlite above. Not part of test-all — neither is bench-core.
[tool.poe.tasks.bench-sqlite]
help = "Benchmark m0-sqlite read-out (links libsqlite3)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-sqlite -Xlinker -lsqlite3 \
  packages/m0-sqlite/bench_sqlite.mojo -o "$out/bench_sqlite" || exit 1
"$out/bench_sqlite"
"""

# --- Toolchain -------------------------------------------------------------

[tool.poe.tasks.mojo-pin]
help = "Print the Mojo version pinned in uv.lock"
shell = "awk '/^name = \"mojo\"$/{f=1;next} f&&/^version = /{gsub(/[\",]/,\"\",$3);print $3;exit}' uv.lock"

# --- Nightly canary --------------------------------------------------------
# The pinned toolchain stays on stable in uv.lock. These swap the venv's mojo
# for a nightly to check for upcoming breakage, without touching the lockfile.
#
# IMPORTANT: plain `uv run` re-syncs the venv to uv.lock first, which silently
# reverts the nightly. While on a nightly, invoke every task as
#   uv run --no-sync poe <task>
# `nightly-restore` (or any plain `uv run`) puts you back on stable.

[tool.poe.tasks.nightly-try]
help = "Swap the venv onto the latest Mojo nightly (then use: uv run --no-sync poe ...)"
shell = """
uv pip install --index https://whl.modular.com/nightly/simple/ --prerelease allow --upgrade mojo
mojo --version
echo 'Now on a nightly. Run tasks as: uv run --no-sync poe <task>'
"""

[tool.poe.tasks.nightly-restore]
help = "Restore the pinned stable toolchain from uv.lock"
shell = "uv sync --reinstall-package mojo && mojo --version"
