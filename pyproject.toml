# pre-release while that cost was guessed at -- moved here.
[tool.poe.tasks.smoke-blobs-image]
help = "Build the blobs demo's pure-Mojo image from the tree and probe it from outside: PID 1, no interpreter, the page's claims, the app, a held stream through the drain"
shell = """
python3 scripts/mojo_image_probe.py --app blobs --build --task smoke-blobs-image || exit 1
python3 scripts/emit.py --covers M26 --task smoke-blobs-image
python3 scripts/emit.py --covers M27 --task smoke-blobs-image
"""

# Each rule the image gate stands on, broken on purpose (SPEC M26, M27): ten
# sabotaged images -- a shell at PID 1, a stop signal the server ignores, an
