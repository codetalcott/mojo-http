# again. It needs the .mojoc files, which test-all builds first.
[tool.poe.tasks.check-copyback]
help = "No struct written through its address (the asyncio executor's state) is passed by value in m0serve's IR"
cmd = "python3 scripts/copyback_guard.py"

[tool.poe.tasks.check-app-vocabulary]
