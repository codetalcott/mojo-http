# The live demo (apps/demo, https://demo.m0serve.dev) from the tree: the
# quickstart's shape as a public page, two workers under --realtime. The wheel
# is not installed here, so the wheel's m0pub.py is staged as an `m0serve`
# package on PYTHONPATH, as smoke-flask-realtime does.
[tool.poe.tasks.serve-demo]
help = "Serve the live demo app from the tree on :8190, two workers under --realtime"
deps = ["build-serve"]
shell = """
set -u
out=$(mktemp -d)
mkdir -p "$out/m0serve"
: > "$out/m0serve/__init__.py"
cp packaging/m0serve/src/m0serve/m0pub.py "$out/m0serve/m0pub.py"
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
core_lib="$PWD/packages/m0-core/libm0core.$ext"
[ -f "$core_lib" ] || uv run --no-sync poe build-ffi || exit 1
PYTHONPATH="$out" M0_CORE_LIB="$core_lib" M0_SSE_HEARTBEAT_MS=25000 bin/m0serve demoapp:application \
  --app-dir apps/demo --realtime --workers 2 --port 8190 --max-body 8k --health-path /health --access-log
"""

# The live demo's deploy image (deploy/demo/Dockerfile), built from the tree's
# own wheel and probed from outside the container: what demo.m0serve.dev runs,
# proven here first. scripts/demo_probe.py asserts the demo's own promises --
# a first visitor's cookie and the version line, the hold views' 403 without
# it, one publish reaching a second stream on the visitor's channel and NOT a
# stranger's, a WebSocket frame coming back to socket and streams, the 413
# and the 429 -- plus m0serve as PID 1 and `docker stop` as the drain with
# held connections open. In CI it runs in the pid1 job (the one with docker
# and a Linux wheel); the same probe with --url verifies the live deploy.
# The Mojo demo's deploy image (SPEC M26, M27): deploy/mojo/Dockerfile --
# ONE Dockerfile for every Mojo app, `APP` naming the directory -- built for
# apps/blobs from THIS tree, the pinned toolchain compiling it inside the
# builder stage, and probed from outside through a published port by
# scripts/mojo_image_probe.py: the binary is PID 1, no interpreter is in the
# image, the image's facts file is true and the page's footer and /about say
# exactly what it says, the whole of smoke-blobs' main run passes through
