# Served the way it deploys: m0serve with `--static /=<tree>` in front of the
# fallback in apps/site. The build alone cannot prove the served shape -- that
# llms.txt is at the root as text and names this site's pages by ABSOLUTE
# URL, that every sitemap URL answers as HTML with a markdown twin the page
# advertises, that the sitemap goes out as XML rather than octet-stream (it
# did), and that the two things the mount does not do -- the slash redirect
# and the HTML 404 -- come from the application behind it.
[tool.poe.tasks.smoke-site]
help = "Build the docs site and serve it with m0serve: llms.txt at the root, every sitemap URL answering"
deps = ["build-serve"]
shell = """
set -u
srv=bin/m0serve
P=8180
B=http://localhost:$P
out=$(mktemp -d)
pid=
fail() { echo "FAIL: $1"; echo '=== site.log ==='; cat site.log 2>/dev/null; [ -n "$pid" ] && kill $pid 2>/dev/null; rm -rf "$out"; exit 1; }

python3 scripts/docsite.py --selftest || fail 'the site checks cannot fail'
python3 scripts/docsite.py --out "$out" --base-url $B || fail 'the site did not build'

M0_SITE_DIST="$out" "$srv" siteapp.wsgi:application --app-dir apps/site \
  --port $P --static /="$out" > site.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/robots.txt > /dev/null \
  || fail 'server never became healthy'

# Status and content type of one URL, as "200 text/plain; charset=utf-8".
probe() { curl -s -o /dev/null -w '%{http_code} %{content_type}' "$1"; }

# llms.txt at the root: text, naming this site's own pages by absolute URL,
# and none of the repository-relative links the source file carries.
[ "$(probe $B/llms.txt)" = "200 text/plain; charset=utf-8" ] || fail "llms.txt: $(probe $B/llms.txt)"
curl -s $B/llms.txt > llms.out
grep -q "]($B/docs/spec.md)" llms.out || fail 'llms.txt does not index the spec page by absolute URL'
grep -q "]($B/quickstart.md)" llms.out || fail 'llms.txt still carries the repository-relative quickstart link'
! grep -q '](docs/' llms.out || fail 'llms.txt carries a repository-relative link'
rm -f llms.out

# llms-full.txt carries exactly the essential pages: the ones llms.txt lists
# under "## Documentation" (the "## More" tier is left out on purpose).
pages=$(grep -c '<loc>' "$out/sitemap.xml")
essential=$(curl -s $B/llms.txt | sed -n '/^## Documentation/,/^## Machine-readable/p' | grep -c '^- ')
full=$(curl -s $B/llms-full.txt | grep -c "^<!-- $B/")
[ "$essential" -ge 4 ] || fail "llms.txt lists only $essential essential pages"
[ "$full" = "$essential" ] || fail "llms-full.txt carries $full pages; llms.txt's Documentation section lists $essential"

# The sitemap is XML, and every URL in it answers as HTML with a markdown
# twin the page advertises, which answers as text.
[ "$(probe $B/sitemap.xml)" = "200 application/xml" ] || fail "sitemap.xml: $(probe $B/sitemap.xml)"
for loc in $(sed -n 's:.*<loc>\\(.*\\)</loc>.*:\\1:p' "$out/sitemap.xml"); do
  [ "$(probe "$loc")" = "200 text/html; charset=utf-8" ] || fail "$loc: $(probe "$loc")"
  twin=$(curl -s "$loc" | sed -n 's:.*<link rel="alternate" type="text/markdown" href="\\([^"]*\\)".*:\\1:p' | head -1)
  [ -n "$twin" ] || fail "$loc advertises no markdown twin"
  [ "$(probe "$twin")" = "200 text/plain; charset=utf-8" ] || fail "$twin: $(probe "$twin")"
done
echo "site: $pages pages answered, each with its markdown twin"

# The front page's canonical link names the base the build was given, and
# spec.json at the root is the tree's generated one byte for byte.
curl -s $B/ | grep -q "<link rel=\\"canonical\\" href=\\"$B/\\">" || fail 'front page carries no canonical link to itself'
curl -s $B/spec.json | cmp -s - docs/spec.json || fail 'spec.json at the root differs from docs/spec.json'

# The two things the mount does not do come from the application behind it.
[ "$(probe $B/docs/spec)" = "301 text/plain; charset=utf-8" ] || fail "directory without slash: $(probe $B/docs/spec)"
loc=$(curl -s -o /dev/null -w '%{redirect_url}' $B/docs/spec)
[ "$loc" = "$B/docs/spec/" ] || fail "redirect went to '$loc'"
[ "$(probe $B/no/such/page)" = "404 text/html; charset=utf-8" ] || fail "404: $(probe $B/no/such/page)"
curl -s $B/no/such/page | grep -q 'content="mojo-http scripts/docsite.py"' || fail 'the 404 is not the site page'
code=$(curl --path-as-is -s -o /dev/null -w '%{http_code}' "$B/docs/spec/../../..")
[ "$code" != "301" ] || fail 'a traversal was redirected as though it named a page'

python3 scripts/emit.py --covers F13 --task smoke-site
kill $pid; wait $pid 2>/dev/null
rm -rf "$out"
echo "smoke-site: OK"
"""

[tool.poe.tasks.serve-wsgi-bare]
help = "Serve the bare PEP 3333 example on :8086 with m0serve"
deps = ["build-serve"]
cmd = "bin/m0serve bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8086"

[tool.poe.tasks.smoke-wsgi]
help = "PEP 3333 conformance: write(), start_response, wsgi.input, CGI environ, validator"
deps = ["build-serve"]
shell = """
out=$(mktemp -d)
# bin/m0serve is built by the deps entry above; SPEC is what the row serves.
srv=bin/m0serve
SPEC="bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8086"

cleanup() {
  kill $pid 2>/dev/null
  rm -rf "$out"
}
trap cleanup EXIT

fail() {
  echo "$1"
  if [ -f wsgi.log ]; then echo '=== wsgi.log ==='; cat wsgi.log; fi
  exit 1
}

B=http://localhost:8086
M0_WORKERS=2 "$srv" $SPEC > wsgi.log 2>&1 &
pid=$!

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ \
  | grep -q 'bare wsgi app' || fail 'GET / did not answer'

# --- the write() callable -----------------------------------------------------
# PEP 3333 requires start_response to return a write callable whose data
# reaches the client. The shim returned `lambda data: None` until this app
# existed to ask; Django never calls write(), so nothing Django-shaped could
# ever have caught it -- including the wsgiref.validate pass, which type-checks
# the call and not its effect.
got=$(curl -s $B/write)
[ "$got" = "written-body" ] || fail "write() output was dropped: got '$got'"

# write() output precedes the iterable's, in order.
got=$(curl -s $B/write/mixed)
[ "$got" = "firstsecondthird" ] || fail "write()/iterable ordering wrong: got '$got'"

# --- the response iterable ----------------------------------------------------
got=$(curl -s $B/chunks)
[ "$got" = "one-two-three" ] || fail "multi-chunk iterable was not joined: got '$got'"

# close() must be called on an iterable that has one -- Django hangs
# request_finished off exactly this, so skipping it breaks framework teardown
# without breaking any single response.
#
# The tally lives in the worker's own interpreter, so all three requests go
# down ONE keep-alive connection: the worker that accepted it owns it for its
# lifetime. Three separate curls race two workers and read a counter that was
# never incremented in the process that answered.
python3 - <<'PYEOF'
import http.client, sys
c = http.client.HTTPConnection("localhost", 8086, timeout=10)
def get(path):
    c.request("GET", path)
    return c.getresponse().read()
before = int(get("/close/count"))
get("/close")
after = int(get("/close/count"))
c.close()
if after <= before:
    print("close() not called: count %d -> %d" % (before, after)); sys.exit(1)
PYEOF
[ $? = 0 ] || fail 'close() was not called on the response iterable'

# --- start_response -----------------------------------------------------------
# A second call without exc_info is an application error the server must reject.
code=$(curl -s -o /dev/null -w '%{http_code}' $B/start-twice)
[ "$code" = "500" ] || fail "start_response called twice was accepted: got $code"

# With exc_info, and nothing sent yet, the server must REPLACE status and
# headers rather than re-raise. This server buffers, so nothing is ever sent
# before the application returns and replacing is always the correct branch.
code=$(curl -s -o /dev/null -w '%{http_code}' $B/exc-info)
[ "$code" = "503" ] || fail "exc_info did not replace the status: got $code"
got=$(curl -s $B/exc-info)
[ "$got" = "replaced" ] || fail "exc_info did not replace the body: got '$got'"

# Arbitrary status passthrough, not just the ones a framework happens to use.
code=$(curl -s -o /dev/null -w '%{http_code}' "$B/status?code=418")
[ "$code" = "418" ] || fail "status passthrough failed: got $code"

# --- the CGI environ ----------------------------------------------------------
# QUERY_STRING must arrive still percent-encoded. PEP 3333 wants the raw bytes
# and every framework re-decodes them itself; a server that helpfully decodes
# here corrupts any value containing %26 or a plus sign.
curl -s "$B/environ?q=%D1%82%D0%B5%D1%81%D1%82" \
  | grep -qF "QUERY_STRING='q=%D1%82%D0%B5%D1%81%D1%82'" \
  || fail 'QUERY_STRING did not arrive percent-encoded'

# PATH_INFO is decoded, and starts with a slash.
curl -s "$B/environ" | grep -qF "PATH_INFO='/environ'" || fail 'PATH_INFO wrong'
# The peer must reach the WSGI environ too -- same capture, CGI spelling.
curl -s "$B/environ" | grep -qF "REMOTE_ADDR='127.0.0.1'" \
  || fail 'REMOTE_ADDR missing from the WSGI environ'

# Content-Type and Content-Length are the only two headers PEP 3333 wants in
# bare CGI form; everything else keeps the HTTP_ prefix, and the HTTP_-prefixed
# spellings of those two must not appear at all.
env=$(curl -s -H 'X-Custom: v' -H 'Content-Type: text/x-test' --data-binary 'ab' $B/environ)
echo "$env" | grep -qF "CONTENT_TYPE='text/x-test'" || fail 'CONTENT_TYPE missing or prefixed'
echo "$env" | grep -qF "CONTENT_LENGTH='2'" || fail 'CONTENT_LENGTH missing or prefixed'
echo "$env" | grep -qF "HTTP_X_CUSTOM='v'" || fail 'ordinary header lost its HTTP_ prefix'
echo "$env" | grep -q '^HTTP_CONTENT_' && fail 'HTTP_CONTENT_* must not appear in the environ'

# --- response header injection -------------------------------------------------
# `write_latin1_to` emits `name: value CRLF` with no inspection, so a value an
# application built out of user input could end the header block and add headers,
# or a body, of its own. The server DROPS such a header rather than raising: by
# then the application has run and its body is real.
#
# `X-Clean` is what makes this a test rather than a tautology -- without it,
# dropping every header would pass. Asserted here in the UNVALIDATED pass
# because wsgiref.validate rejects a control byte in a header value itself, so
# the route is deliberately non-conforming, like /no-content-type.
hdrs=$(curl -s -D - -o /dev/null --max-time 10 $B/inject)
echo "$hdrs" | grep -qi '^X-Clean' || fail 'the clean header was dropped too; the guard is refusing everything'
for bad in X-Injected X-Nul X-Evil; do
  echo "$hdrs" | grep -qi "^$bad" && fail "response splitting: $bad reached the wire"
done
echo "$hdrs" | grep -qi '^HTTP/1.1 200' || fail 'the injecting route did not answer 200'

# --- wsgi.input ---------------------------------------------------------------
got=$(printf 'hello' | curl -s --data-binary @- $B/input/read)
[ "$got" = "len=5 sum=532" ] || fail "wsgi.input read() wrong: got '$got'"

got=$(curl -s --data-binary @- $B/input/readline <<'EOF'
a
b
c
EOF
)
[ "$got" = "a|b|c" ] || fail "wsgi.input readline() wrong: got '$got'"

got=$(printf 'hello' | curl -s --data-binary @- $B/input/iter)
[ "$got" = "iter=5" ] || fail "wsgi.input iteration wrong: got '$got'"

# Reading past the end yields b'', rather than blocking or raising.
got=$(printf 'hi' | curl -s --data-binary @- $B/input/overread)
[ "$got" = "extra=b''" ] || fail "reading past EOF wrong: got '$got'"

# --- the wire -----------------------------------------------------------------
# HTTP/1.1, and one request's body must not leak into the next on a reused
# connection. Two POSTs of different lengths down one socket catch a parser
# that keeps stale body state.
python3 - <<'PYEOF'
import http.client, sys
c = http.client.HTTPConnection("localhost", 8086, timeout=10)
c.request("POST", "/input/read", b"aaaa")
r1 = c.getresponse()
b1 = r1.read()
if r1.version != 11:
    print("expected HTTP/1.1, got version %r" % r1.version); sys.exit(1)
if r1.will_close:
    print("connection closed despite Content-Length"); sys.exit(1)
c.request("POST", "/input/read", b"bb")
b2 = c.getresponse().read()
c.close()
if not b1.startswith(b"len=4"):
    print("first keep-alive request: %r" % b1); sys.exit(1)
if not b2.startswith(b"len=2"):
    print("second keep-alive request saw stale body state: %r" % b2); sys.exit(1)
PYEOF
[ $? = 0 ] || fail 'keep-alive request isolation failed'

# --- re-entrancy --------------------------------------------------------------
# A request issued from inside a view, back to this same server. A worker runs
# views synchronously on the event loop, so with one worker the only process
# that could accept the sub-request is the one blocked in the view that made
# it -- measured at a 10s timeout and a 504. Two workers answer in ~14ms.
got=$(curl -s "$B/reentrant?url=http%3A%2F%2Flocalhost%3A8086")
[ "$got" = "reentrant: subview" ] || fail "re-entrant request failed: got '$got'"

# The same request with the url NOT percent-encoded, which is the shape that
# used to answer 400: URI.parse searched the whole target for `://` and read
# `/reentrant?url=http` as a scheme. It now accepts a `://` only when what
# precedes it is a scheme per RFC 3986 3.1, and a query string cannot be one.
got=$(curl -s --path-as-is "$B/reentrant?url=http://localhost:8086")
[ "$got" = "reentrant: subview" ] \
  || fail "an unencoded url in the query is still misparsed: got '$got'"

kill $pid 2>/dev/null
wait $pid 2>/dev/null

# --- the same app under wsgiref.validate --------------------------------------
# The stdlib's PEP 3333 checker, over routes chosen to exercise the spec rather
# than the conventional slice a framework happens to use.
M0_WSGI_VALIDATE=1 M0_WORKERS=2 "$srv" $SPEC > wsgi.log 2>&1 &
pid=$!

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ \
  | grep -q 'bare wsgi app' || fail 'GET / failed under M0_WSGI_VALIDATE'

for path in write write/mixed chunks close input/read; do
  curl -s --fail "$B/$path" > /dev/null || fail "/$path failed validation"
done
got=$(curl -s $B/write)
[ "$got" = "written-body" ] || fail "write() broke under the validator: got '$got'"

curl -s "$B/environ?q=%D1%82" | grep -qF "QUERY_STRING='q=%D1%82'" \
  || fail 'QUERY_STRING failed validation'

grep -qiE 'assertionerror|not being closed' wsgi.log \
  && fail 'the validator reported a violation out of band (see wsgi.log)'

# Last, because it is the one request meant to fail: /no-content-type is an
# ordinary 200 unvalidated and an AssertionError under the wrapper, which is
# the only way to tell the validator is installed rather than skipped by a
# misspelled variable name.
code=$(curl -s -o /dev/null -w '%{http_code}' $B/no-content-type)
[ "$code" = "500" ] || fail "validator not engaged: /no-content-type answered $code, expected 500"

curl -s --fail $B/ > /dev/null || fail 'server died after a validation failure'

kill $pid 2>/dev/null
wait $pid 2>/dev/null

rm -f wsgi.log
echo "smoke-wsgi OK"
python3 scripts/emit.py --covers G2 --task smoke-wsgi
python3 scripts/emit.py --covers K1 --task smoke-wsgi
python3 scripts/emit.py --covers K2 --task smoke-wsgi
python3 scripts/emit.py --covers K3 --task smoke-wsgi
python3 scripts/emit.py --covers K4 --task smoke-wsgi
python3 scripts/emit.py --covers K5 --task smoke-wsgi
python3 scripts/emit.py --covers K6 --task smoke-wsgi
python3 scripts/emit.py --covers K7 --task smoke-wsgi
"""

# Streamed WSGI bodies. A generator the application did not size streams
# from a `--blocking-threads` pool thread through the loop's chunk channel
# -- chunk by chunk, as it is produced, chunked on HTTP/1.1 with the
# connection reusable after -- where it used to be joined whole. Lists and
# sized bodies still buffer. Every edge of that contract is pinned here,
# against the bare app first and Django's StreamingHttpResponse last, plus
# the two things that used to be wrong: a never-ending generator pinned its
# thread until shutdown, and the thread never noticed its client leaving.
[tool.poe.tasks.smoke-wsgi-stream]
help = "Streamed WSGI bodies: a generator streams from a pool thread, chunked, keep-alive kept; lists still buffer"
deps = ["build-serve"]
shell = """
srv=bin/m0serve
SPEC="bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8081"
B=http://127.0.0.1:8081
cleanup() {
  kill $pid 2>/dev/null
  rm -f stream.log
}
trap cleanup EXIT
fail() {
  echo "$1"
  if [ -f stream.log ]; then echo '=== stream.log ==='; cat stream.log; fi
  exit 1
}
ready() {
  curl --retry 30 --retry-delay 1 --retry-all-errors --silent --fail "$1" > /dev/null || fail "never became healthy: $1"
}

"$srv" $SPEC --blocking-threads 4 > stream.log 2>&1 &
pid=$!
ready $B/

# --- what buffers -------------------------------------------------------------
# A list body, a generator the application sized with Content-Length, and a
# generator that yields nothing non-empty all take the buffered path: a
# measured Content-Length, no Transfer-Encoding.
for path in /chunks /stream-cl /stream-empty /; do
  hdr=$(curl -s -D - -o /dev/null "$B$path" | tr -d '\\r')
  echo "$hdr" | grep -qi '^content-length:' || fail "$path lost its content-length"
  echo "$hdr" | grep -qi '^transfer-encoding' && fail "$path was chunked; it must buffer"
done
[ "$(curl -s $B/chunks)" = "one-two-three" ] || fail '/chunks body changed'
[ "$(curl -s $B/stream-cl)" = "sized-stream" ] || fail '/stream-cl body changed'

# --- what streams, and that it really does -------------------------------------
# Three pieces 300 ms apart: the first must arrive well before the last is
# produced. The ceiling is loose (1 s against a 600 ms body) because CI
# machines are shared; the failure it catches is the whole body arriving at
# once after 600 ms, which is what joining looks like.
python3 - <<'PYEOF' || fail 'the generator did not stream: pieces arrived together'
import socket, time, sys
s = socket.create_connection(("127.0.0.1", 8081), timeout=10)
t0 = time.time()
s.sendall(b"GET /stream?n=3&delay=0.3 HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
data, stamps = b"", []
while b"\\r\\n0\\r\\n\\r\\n" not in data:
    data += s.recv(65536); stamps.append(time.time() - t0)
head, _, body = data.partition(b"\\r\\n\\r\\n")
if b"transfer-encoding: chunked" not in head.lower():
    print("not chunked:", head); sys.exit(1)
if b"content-length" in head.lower():
    print("a chunked response carried content-length"); sys.exit(1)
if b"piece 0" not in body or b"piece 2" not in body:
    print("body incomplete:", body); sys.exit(1)
first = min(stamps); total = max(stamps)
print("first piece at %.2fs, last at %.2fs" % (first, total))
if first > 1.0 or total < 0.55 or len(stamps) < 2:
    print("timing says the body was joined, not streamed"); sys.exit(1)
# The same connection must still work after the stream.
s.sendall(b"GET / HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
if b"200 OK" not in s.recv(4096):
    print("the connection did not survive the stream"); sys.exit(1)
PYEOF

# The raw-socket probe the ASGI row uses: a 1 MB body hand-decoded and
# compared byte for byte, a second request on the same connection, and the
# HTTP/1.0 refusal to frame.
M0_PORT=8081 M0_STREAM_PATH='/stream?n=64&size=16384&delay=0' M0_STREAM_LEN=1048576 M0_SECOND_PATH=/ \
  python3 scripts/chunked_keepalive.py || fail 'the chunked keep-alive probe failed against a streamed WSGI body'

# write() from inside the generator, between its yields: production order.
[ "$(curl -s $B/stream-write-inside)" = "w0-y0-w1-y1-w2-" ] \
  || fail "write() inside the generator lost its order: got '$(curl -s $B/stream-write-inside)'"

# A generator that raises after its head: the pieces it produced arrive,
# then the connection closes WITHOUT the chunked terminator -- a truncated
# body, which is the truth, never a short body under a clean ending.
python3 - <<'PYEOF' || fail '/stream-raises did not truncate honestly'
import socket, sys
s = socket.create_connection(("127.0.0.1", 8081), timeout=15)
s.sendall(b"GET /stream-raises HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
data = b""
while True:
    c = s.recv(65536)
    if not c: break
    data += c
head, _, body = data.partition(b"\\r\\n\\r\\n")
if b"first\\nsecond\\n" not in body:
    print("the pieces produced before the raise were lost:", body); sys.exit(1)
if body.endswith(b"0\\r\\n\\r\\n"):
    print("a raising generator got a clean terminator:", body); sys.exit(1)
print("stream-raises: pieces delivered, then closed without a terminator")
PYEOF
grep -q 'streamed response raised after its head' stream.log \
  || fail 'the raise inside the generator was not reported'

# Sixteen 1 MB streams at once on four threads: every byte, in order, and
# the server answers afterwards. This is the channel's shared capacity
# under pressure -- a dropped chunk here is a short body.
python3 - <<'PYEOF' || fail '16 concurrent 1 MB streams were not byte-exact'
import socket, threading, sys
EXP = b"".join((b"%d" % (k % 10)) * 16384 for k in range(64))
out = [None] * 16
def one(i):
    # Read to the chunked terminator, not to EOF: a framed stream leaves
    # the connection open afterwards, which is the point of the framing.
    s = socket.create_connection(("127.0.0.1", 8081), timeout=60)
    s.sendall(b"GET /stream?n=64&size=16384&delay=0 HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
    data = b""
    while not data.endswith(b"\\r\\n0\\r\\n\\r\\n"):
        c = s.recv(1 << 16)
        if not c: break
        data += c
    s.close()
    head, _, raw = data.partition(b"\\r\\n\\r\\n")
    body, rest = b"", raw
    while True:
        size_line, _, rest = rest.partition(b"\\r\\n")
        n = int(size_line.split(b";")[0], 16)
        if n == 0: break
        body += rest[:n]; rest = rest[n + 2:]
    out[i] = (len(body), body == EXP)
ts = [threading.Thread(target=one, args=(i,)) for i in range(16)]
[t.start() for t in ts]; [t.join() for t in ts]
bad = [r for r in out if r != (1048576, True)]
print("16 x 1 MB:", "all byte-exact" if not bad else bad)
sys.exit(1 if bad else 0)
PYEOF
curl -s --fail --max-time 5 $B/ > /dev/null || fail 'server did not answer after the 16-stream burst'

# --- the client leaves ----------------------------------------------------------
# Five never-ending streams opened and abandoned in turn on a FOUR-thread
# pool. The thread producing each must come back when its client goes, or
# the fifth has no thread to run on and the fast request after it queues.
for i in 1 2 3 4 5; do
  curl -s -N --max-time 0.4 $B/stream-forever > /dev/null 2>&1
done
took=$(curl -s -o /dev/null -w '%{time_total}' --max-time 10 $B/)
ms=$(python3 -c "import sys; print(int(float(sys.argv[1]) * 1000))" "$took")
[ "$ms" -lt 2000 ] || fail "after five abandoned streams a fast request took ${ms}ms: the threads did not return to the pool"
echo "five abandoned never-ending streams; fast request answered in ${ms}ms"

# --- shutdown -------------------------------------------------------------------
# SIGTERM with a live stream: the farewell reaches the producer as a
# disconnect, it comes back, and the process exits promptly -- no 5 s
# drain, no straggler.
curl -s -N --max-time 30 $B/stream-forever > /dev/null 2>&1 &
client=$!
sleep 0.5
t0=$(python3 -c 'import time; print(time.time())')
kill -TERM $pid
wait $pid 2>/dev/null; rc=$?
took=$(python3 -c "import time, sys; print(round(time.time() - float(sys.argv[1]), 2))" "$t0")
kill $client 2>/dev/null; wait $client 2>/dev/null
[ "$rc" = "0" ] || fail "SIGTERM with a live stream: exit $rc, want 0"
python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) < 3.0 else 1)" "$took" \
  || fail "SIGTERM with a live stream took ${took}s: the producer did not come back"
grep -q 'still inside the application' stream.log && fail 'a live stream was abandoned as a straggler at shutdown'
echo "SIGTERM with a live stream exited in ${took}s"

# A generator ASLEEP between events cannot notice the disconnect until it
# wakes; that thread is still the bounded straggler, and the exit says so.
"$srv" $SPEC --blocking-threads 2 > stream.log 2>&1 &
pid=$!
ready $B/
curl -s -N --max-time 60 "$B/stream-forever?delay=30" > /dev/null 2>&1 &
client=$!
sleep 0.5
t0=$(date +%s)
kill -TERM $pid
wait $pid 2>/dev/null; rc=$?
took=$(( $(date +%s) - t0 ))
kill $client 2>/dev/null; wait $client 2>/dev/null
[ "$rc" = "0" ] || fail "SIGTERM with a sleeping generator: exit $rc, want 0"
[ "$took" -lt 20 ] || fail "SIGTERM with a sleeping generator took ${took}s"
grep -q 'still inside the application' stream.log || fail 'the sleeping generator was not reported as a straggler'
echo "SIGTERM with a generator asleep for 30 s exited in ${took}s, naming the straggler"

# --- wsgiref.validate, on a pool ---------------------------------------------------
# The validator's IteratorWrapper is an iterator, so under it every route
# streams -- and it asserts close() is called on the ORIGINAL iterable and
# never iterated after. smoke-wsgi's own validator phase runs M0_WORKERS=2,
# which is explicit topology and so has no pool; this is the pool's turn.
M0_WSGI_VALIDATE=1 "$srv" $SPEC --blocking-threads 4 > stream.log 2>&1 &
pid=$!
ready $B/
[ "$(curl -s $B/chunks)" = "one-two-three" ] || fail 'validator: /chunks body wrong on a pool'
[ "$(curl -s $B/write/mixed)" = "firstsecondthird" ] || fail 'validator: write()/iterable order wrong on a pool'
python3 - <<'PYEOF' || fail 'validator: close() was not called on a streamed iterable'
import http.client, sys
c = http.client.HTTPConnection("127.0.0.1", 8081, timeout=10)
def get(p):
    c.request("GET", p); return c.getresponse().read()
before = int(get("/close/count")); get("/close"); after = int(get("/close/count"))
sys.exit(0 if after > before else 1)
PYEOF
code=$(curl -s -o /dev/null -w '%{http_code}' $B/no-content-type)
[ "$code" = "500" ] || fail "validator not engaged on a pool: /no-content-type answered $code"
grep -qiE 'assertionerror|not being closed' stream.log \
  && fail 'the validator reported a violation from a streamed iterable (see stream.log)'
kill $pid 2>/dev/null
wait $pid 2>/dev/null

# --- Django ---------------------------------------------------------------------
# StreamingHttpResponse, the shape every Django SSE tutorial uses, on the
# zero-config pool: events arrive as they are yielded, chunked, and the
# connection is reusable after; an ordinary page still carries its
# Content-Length and no Transfer-Encoding.
"$srv" djangoproj.wsgi:application --app-dir apps/django_wsgi --port 8081 > stream.log 2>&1 &
pid=$!
ready $B/
hdr=$(curl -s -D - -o /dev/null $B/ | tr -d '\\r')
echo "$hdr" | grep -qi '^content-length:' || fail 'Django / lost its content-length'
echo "$hdr" | grep -qi '^transfer-encoding' && fail 'Django / was chunked; HttpResponse must buffer'
python3 - <<'PYEOF' || fail 'Django StreamingHttpResponse did not stream'
import socket, time, sys
s = socket.create_connection(("127.0.0.1", 8081), timeout=10)
t0 = time.time()
s.sendall(b"GET /events?n=3&delay=0.3 HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
data, stamps = b"", []
while b"\\r\\n0\\r\\n\\r\\n" not in data:
    data += s.recv(65536); stamps.append(time.time() - t0)
head, _, body = data.partition(b"\\r\\n\\r\\n")
if b"transfer-encoding: chunked" not in head.lower() or b"text/event-stream" not in head.lower():
    print("head:", head); sys.exit(1)
if body.count(b"data: event") != 3:
    print("body:", body); sys.exit(1)
if min(stamps) > 1.0 or max(stamps) < 0.55 or len(stamps) < 2:
    print("timing says the events were joined:", stamps); sys.exit(1)
s.sendall(b"GET / HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n")
if b"200 OK" not in s.recv(4096):
    print("keep-alive lost after the stream"); sys.exit(1)
print("django events: first at %.2fs, last at %.2fs, connection reused" % (min(stamps), max(stamps)))
PYEOF
kill $pid 2>/dev/null
wait $pid 2>/dev/null

rm -f stream.log
echo "smoke-wsgi-stream OK"
python3 scripts/emit.py --covers A9 --task smoke-wsgi-stream
python3 scripts/emit.py --covers D3 --task smoke-wsgi-stream
python3 scripts/emit.py --covers K9 --task smoke-wsgi-stream
"""

# The Phase-2 benchmark gate (docs/WSGI_VS_ASGI.md section 8): the asyncio
# executor against uvicorn (single process, no uvloop), same app, same
# stdlib client — so the numbers only mean anything as a ratio. Not in CI:
# shared runners make latency gates flaky; run it where the numbers go
# into WSGI_PERFORMANCE.md.
[tool.poe.tasks.bench-asgi]
help = "Bench the ASGI executor against uvicorn on apps/asgi_bare (gate: mixed-tail p99; the rps ratio is informational)"
deps = ["build-serve"]
cmd = "python3 scripts/bench_asgi.py"

# The wrk run behind the `asgi-wrk-hello-*.json` artifact docs/BENCHMARKS.md
# renders: the executor against `uvicorn --loop asyncio` (the standing
# comparator) AND against uvicorn with uvloop (what a default install runs),
# cores measured, median of three rounds. Needs wrk; not in CI.
[tool.poe.tasks.bench-asgi-wrk]
help = "wrk: the ASGI executor vs uvicorn (asyncio and uvloop), recorded as a bench artifact"
deps = ["build-serve"]
cmd = "bash scripts/bench_asgi_wrk.sh"

# The slot-ownership stress: the shape that found the 0.14.0 race, run to a
# count. `chunked_keepalive.py`'s HTTP/1.0 probe closes after its head and
# the keep-alive stream that follows lands on the SAME slot, which is
# exactly the recycle the executor's per-slot state has to survive; CPU hogs
# are what make the previous task's cancellation and done-callback land late
# enough to collide with the successor. Measured on the broken build: 8 of
# 11 smoke-asgi runs failed under twelve hogs, 4 of 5 for this probe; 0 of 6
# after the fix.
#
# Deliberately NOT in CI, and deliberately not the only guard. Shared
# runners are already loaded, so the timing this depends on is not
# reproducible there — that is precisely why CI passed with the bug live for
# a whole day. `poe test-shim` is the deterministic half and IS in CI; this
# is the pre-release half (docs/RELEASING.md). Tune with M0_STRESS_ITERS and
# M0_STRESS_HOGS.
# The Mojo handler pool's three guards, mirroring the WSGI pool's split:
# the smoke is behavioural and in CI (which thread served, saturation
# refusals, clean SIGTERM); the sabotage proves the unit tests can fail and
# is CI-viable because it is deterministic (one rule is Linux-only to
# OBSERVE -- see the script -- so Linux CI is where all four count); the
# probe is the p99 measurement and stays pre-release like stress-asgi,
# because a timing table from a shared runner is noise.
[tool.poe.tasks.smoke-pool]
help = "The Mojo handler pool serves from its threads, refuses streams, exits clean"
deps = ["build-core", "build-http"]
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-http -I packages/m0-core apps/pool_spike/server.mojo -o "$out/pool_spike" || exit 1
python3 scripts/pool_spike_check.py --binary "$out/pool_spike" || exit 1
python3 scripts/emit.py --covers E4 --task smoke-pool
"""

[tool.poe.tasks.sabotage-pool]
help = "Revert each mojo_pool rule and insist test_mojo_pool fails for every one"
deps = ["build-core", "build-http"]
shell = "python3 scripts/pool_sabotage.py"

# The decoder's trailer states were its untested region: the round-trip tests
# set `consume_trailer = True` but their wire carried no trailer section, so
# every state below `IN_TRAILERS_LINE_HEAD` was reached by no test (SPEC A10).
[tool.poe.tasks.sabotage-trailers]
help = "Revert each chunked-trailer rule and insist test_parsing fails for it"
deps = ["build-core", "build-http"]
shell = "python3 scripts/trailer_sabotage.py"

# SPEC G13. The request decoder is a pure function over bytes, so the harness
# needs no socket and no server: mutate a seed corpus, assert the invariants,
# and stay reproducible from `--seed` so a CI failure can be replayed exactly.
# 20k iterations is a couple of seconds, which is why this runs every PR
# rather than weekly; `fuzz-request-long` is the deeper sweep for a release.
[tool.poe.tasks.fuzz-request]
help = "Fuzz the request/chunked decoders against their invariants"
shell = """
mojo run -I packages/m0-http -I packages/m0-core scripts/fuzz_request.mojo --iterations 20000 || exit 1
python3 scripts/emit.py --covers G13 --task fuzz-request
"""

[tool.poe.tasks.fuzz-request-long]
help = "PRE-RELEASE: the deep fuzz sweep, eight seeds x 250k iterations"
shell = """
for s in 1 2 3 4 5 6 7 8; do
  echo "--- seed $s ---"
  mojo run -I packages/m0-http -I packages/m0-core scripts/fuzz_request.mojo \
    --seed "$s" --iterations 250000 || exit 1
done
"""

# A fuzzer that has never found anything is indistinguishable from a fuzzer
# that cannot: this breaks each invariant in turn and insists it is reported.
[tool.poe.tasks.sabotage-fuzz]
help = "Break each decoder invariant and insist the fuzzer reports it"
shell = "python3 scripts/fuzz_sabotage.py"

[tool.poe.tasks.probe-pool-fairness]
help = "PRE-RELEASE: pool threads take the GIL in job order under a CPU-bound view; the turn disabled must convoy (not in CI)"
deps = ["build-serve"]
shell = """
srv=bin/m0serve
SPEC="bareapp.wsgi:application --app-dir apps/wsgi_bare"
port=${M0_FAIRNESS_PORT:-8197}
cleanup() { kill $pid 2>/dev/null; rm -f fairness.log; }
trap cleanup EXIT
fail() { echo "$1"; if [ -f fairness.log ]; then echo '=== fairness.log ==='; cat fairness.log; fi; exit 1; }
# The loop holds no thread state (docs/notes/detached-loop.md), so the pool's
# hand-off barrier is what keeps four threads from convoying on the GIL. Both
# arms, because a probe that cannot see the failure proves nothing.
"$srv" $SPEC --port $port --blocking-threads 4 > fairness.log 2>&1 & pid=$!
python3 scripts/pool_fairness_probe.py $port || fail 'with the turn: the fast-route tail convoyed'
kill $pid; wait $pid 2>/dev/null
M0_POOL_TURN=0 "$srv" $SPEC --port $port --blocking-threads 4 > fairness.log 2>&1 & pid=$!
python3 scripts/pool_fairness_probe.py $port --expect-convoy \
  || fail 'without the turn the tail did NOT convoy: the probe cannot see the failure it guards'
"""

[tool.poe.tasks.probe-pool]
help = "PRE-RELEASE: p99 of /fast beside blocking handlers, loop vs pool (not in CI)"
deps = ["build-core", "build-http"]
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-http -I packages/m0-core apps/pool_spike/server.mojo -o "$out/pool_spike" || exit 1
python3 scripts/pool_spike_probe.py --binary "$out/pool_spike" --json "bench/results/pool-probe-$(date -u +%Y%m%dT%H%M%SZ).json"
"""

# SPEC I13. Sections driven separately (a single pass wedged at 6.21.6 on
# the recycled slot after section 1's cap-killed connections), 9/12/13
# excluded, and the comparison runs BOTH directions against the pinned
# baseline: a new failure is red, and an I17 cap case unexpectedly PASSING
# is red too — the cap moved and the sheet is wrong. The comparator's
# --selftest is proven before anything is believed. Needs docker; ~5 min.
#
# On a Mac the task provisions docker itself: if no daemon answers and
# colima is installed, it starts a 4 GiB VM (enough for the wstest
# container — the echo server runs on the HOST; the toolchain-build
# workflows that want 8 GiB carry their own `colima start` line) and stops
# THAT VM when the run ends, pass or fail. A daemon that was already up —
# colima someone started for other work, or native Linux docker — is used
# as found and never stopped: only what this run started is this run's to
# reap. The stop matters on a 16 GB machine, where a forgotten VM
# reservation was half the RAM (measured, 2026-09-01).
[tool.poe.tasks.autobahn]
help = "PRE-RELEASE: Autobahn|Testsuite vs the pinned baseline — every failure I17's cap (not in CI)"
deps = ["build-serve"]
shell = """
started=""
if ! docker info >/dev/null 2>&1; then
  command -v colima >/dev/null 2>&1 \
    || { echo "autobahn: no docker daemon, and colima is not installed" >&2; exit 1; }
  echo "autobahn: no docker daemon — starting colima (4 GiB)"
  colima start --memory 4 || exit 1
  started=1
fi
rc=0
python3 scripts/autobahn_runner.py --selftest || rc=1
[ "$rc" = "0" ] && { python3 scripts/autobahn_runner.py || rc=1; }
if [ -n "$started" ]; then
  echo "autobahn: stopping the colima VM this run started"
  colima stop
fi
exit $rc
"""

[tool.poe.tasks.stress-asgi]
help = "Pre-release: N streamed + WebSocket rounds under CPU load, in both loop modes (not in CI)"
deps = ["build-serve"]
shell = """
iters=${M0_STRESS_ITERS:-30}
hogs=${M0_STRESS_HOGS:-$(( $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4) * 2 ))}
port=${M0_STRESS_PORT:-8188}
# The pump and the inversion are two different loops around the same executor,
# and the flake that widened this gate landed in the inverted one — so both are
# driven and each names itself when it fails. `M0_STRESS_MODES=inverted` narrows
# a rerun to the mode a failure named, which is the cheapest reproduction.
modes=${M0_STRESS_MODES:-"plain inverted"}

# A stray server on either port would answer instead — SO_REUSEPORT means a
# second bind SUCCEEDS and silently takes a share of the connections, so "it
# passed" would mean nothing. The two modes get two ports for that same
# reason: sequential restarts on ONE port can overlap, and the inverted
# server's drain deadline is 5 s, so the overlap is not hypothetical.
for p in $port $(( port + 1 )); do
  if pgrep -f "m0serve .*--port $p" > /dev/null 2>&1; then
    echo "stress-asgi: an m0serve is already on port $p; kill it first"
    exit 1
  fi
done

hog_pids=""
pid=""
# `wait` after each kill reaps the hog then and there; without it the shell
# announces every one of them as "Terminated" on the next command.
stop_hogs() {
  for h in $hog_pids; do kill $h 2>/dev/null; wait $h 2>/dev/null; done
  hog_pids=""
}
cleanup() {
  stop_hogs
  if [ -n "$pid" ]; then kill $pid 2>/dev/null; fi
}
trap cleanup EXIT

for mode in $modes; do
  case $mode in
    plain)    inverted=0; mport=$port ;;
    inverted) inverted=1; mport=$(( port + 1 )) ;;
    *) echo "stress-asgi: unknown mode '$mode' (plain|inverted)"; exit 1 ;;
  esac
  log=stress-$mode.log

  # The heartbeat cadence is smoke-asgi's, not the default, because the run
  # that failed had it: a WS slot gets a protocol PING on this cadence, so
  # the flood phase's two-second stall now has a timer-driven producer
  # queueing frames into the same outbox the application is filling. That
  # is a second writer on the seam under test, and it is free.
  M0_SSE_HEARTBEAT_MS=300 M0_INVERTED=$inverted bin/m0serve bareapp.asgi:application \
    --app-dir apps/asgi_bare --port $mport > $log 2>&1 &
  pid=$!
  curl --retry 30 --retry-delay 1 --retry-all-errors --silent --fail \
    http://localhost:$mport/ > /dev/null \
    || { echo "stress-asgi: the $mode server never became healthy"; cat $log; exit 1; }
  # The inversion is gated on a topology (unmounted, pool-free, no --realtime)
  # that this app happens to satisfy today. If that gate ever moves, the
  # variable is silently ignored and this mode proves the pump a second time
  # while reporting itself as the inverted one.
  if [ $inverted = 1 ]; then
    grep -q 'inverted: the event loop runs inside asyncio' $log \
      || { echo "stress-asgi: M0_INVERTED=1 did not invert the loop; this mode would prove the pump twice"; cat $log; exit 1; }
  fi

  for _ in $(seq 1 $hogs); do
    ( while :; do :; done ) &
    hog_pids="$hog_pids $!"
  done
  echo "stress-asgi[$mode]: $iters rounds under $hogs CPU hogs on port $mport"

  i=1
  while [ $i -le $iters ]; do
    # Interleaved, not run as two separate phases: chunked_keepalive's
    # HTTP/1.0 request closes after its head, so the WebSocket handshake
    # behind it lands on the slot that connection just released. That is the
    # recycled-slot shape the streamed half already covers, with a held 101
    # on the successor instead of another stream.
    for probe in scripts/chunked_keepalive.py apps/asgi_bare/ws_probe.py; do
      if ! M0_PORT=$mport python3 $probe > /dev/null 2>&1; then
        echo "stress-asgi: FAILED in $mode mode on round $i of $iters, in $probe"
        echo "stress-asgi: rerun that half alone with M0_STRESS_MODES=$mode uv run poe stress-asgi"
        M0_PORT=$mport python3 $probe
        echo "=== $log ==="; cat $log
        exit 1
      fi
    done
    i=$((i + 1))
  done

  stop_hogs
  curl -s --fail --max-time 10 http://localhost:$mport/ | grep -q 'hello from asgi_bare' \
    || { echo "stress-asgi: the $mode server did not survive the load"; cat $log; exit 1; }
  kill $pid 2>/dev/null; wait $pid 2>/dev/null
  pid=""
  rm -f $log
  echo "stress-asgi[$mode] OK: $iters/$iters rounds under $hogs hogs"
done
"""

# SPEC E18. The handler pool's lost-wake reproducers, run where the lost
# wake was caught: the m0lin Linux container (docs/notes/pool-ring-handoff.md
# -- 2 of 10 rounds on the ring's first build, never on macOS, whose kernel
# wakes every receiver on a datagram socket and so never leaves one parked
# beside a job). Per wake MODE, because the pool has three shipped wake
# protocols and a wake lost in one is invisible in the others: the GIL rules
# (the default on the container's 3.13), M0_POOL_PARALLEL=1 (the
# free-threaded default, forced on for the run) and M0_POOL_ELASTIC=0 (the
# eager wakes, the A/B control). Pre-release, not CI: CI has no such
# container, and a shared runner's scheduler is not the one under test.
# Do the benchmark page's conclusions still hold on Linux? Every artifact the
# page renders is macOS arm64, and measured 2026-09-08 TWO of its four headline
# conclusions invert there -- both of the "No" answers -- because a cross-thread
# handoff costs less on epoll and futex than on kqueue, and the handoff is what
# m0serve's two-thread shape pays for its isolation
# (docs/notes/the-conclusions-on-linux.md).
#
# PRE-RELEASE, and it must not become a CI gate: the differences that matter are
# narrow (0.98x -> 1.08x) and a shared four-core runner cannot resolve a
# ten-percent ratio shift. That is `stress-pool`'s reason too. A gate that cannot
# see what it watches for is worse than none, because it reads as coverage.
[tool.poe.tasks.bench-linux-conclusions]
help = "PRE-RELEASE: do the benchmark page's conclusions hold on Linux? (the m0lin container; not in CI)"
shell = """
# `$@` is EMPTY in a poe shell task: extra command-line arguments reach it
# only through declared `args` below, as named variables. A bare "$@" here
# silently dropped `--remote` and ran the CONTAINER instead -- a rented box
# was created, sat idle and was deleted having measured nothing, while the
# run reported success with container numbers. Hence both the declarations
# and the banner the script prints.
args=""
[ -n "$remote" ] && args="$args --remote $remote"
[ -n "$provision" ] && args="$args --provision"
[ -n "$keep" ] && args="$args --keep"
[ -n "$rounds" ] && args="$args --rounds $rounds"
started=""
# Only the container path needs a docker daemon; starting colima for a
# remote run would boot a VM nothing then uses.
if [ -z "$remote" ] && ! docker info >/dev/null 2>&1; then
  command -v colima >/dev/null 2>&1 \
    || { echo "bench-linux-conclusions: no docker daemon, and colima is not installed" >&2; exit 1; }
  echo "bench-linux-conclusions: no docker daemon — starting colima (8 cpu, 6 GiB)"
  colima start --cpu 8 --memory 6 || exit 1
  started=1
fi
rc=0
python3 scripts/bench_linux_conclusions.py $args || rc=1
if [ -n "$started" ]; then
  echo "bench-linux-conclusions: stopping the colima it started"
  colima stop >/dev/null 2>&1
fi
exit $rc
"""

[[tool.poe.tasks.bench-linux-conclusions.args]]
name = "remote"
options = ["--remote"]
help = "USER@HOST: run the arms on a remote Linux host over ssh, not the container"

[[tool.poe.tasks.bench-linux-conclusions.args]]
name = "provision"
options = ["--provision"]
type = "boolean"
help = "With --remote: install the toolchain on the host first (once per host or image)"

[[tool.poe.tasks.bench-linux-conclusions.args]]
name = "keep"
options = ["--keep"]
type = "boolean"
help = "Leave the container running when the run ends"

[[tool.poe.tasks.bench-linux-conclusions.args]]
name = "rounds"
options = ["--rounds"]
help = "Rounds per arm (default 3; 1 is a shape check)"

[tool.poe.tasks.stress-pool]
help = "PRE-RELEASE: the pool's lost-wake reproducers, N rounds per wake mode, in the m0lin Linux container (not in CI)"
shell = """
rounds=${M0_STRESS_POOL_ROUNDS:-20}
holds=${M0_STRESS_POOL_HOLDS:-40}
modes=${M0_STRESS_POOL_MODES:-"elastic parallel eager"}
c=${M0_LINUX_CONTAINER:-m0lin}
docker start "$c" > /dev/null 2>&1 \
  || { echo "stress-pool: no docker container named '$c' — create it with the recipe in scripts/probes/linux_setup.sh's header"; exit 1; }
# The tree goes in by tar (the container has no bind mount, so it can outlive
# any one checkout), and the sync script rebuilds what the probes serve: the
# packages, the binary, and the m0pub core lib the realtime app loads.
tar --exclude=.venv --exclude=.git --exclude='packages/*/*.mojoc' --exclude='bin/*' --exclude='.claude' \
    -cf - packages scripts apps pyproject.toml uv.lock bench \
  | docker exec -i "$c" bash -c 'mkdir -p /src && cd /src && rm -rf packages scripts apps bench && tar -xf -' || exit 1
# /src is cleared first because a tar carries no deletion: a file the Mac
# moved or removed would otherwise linger there, and in /work after the
# sync, and change the stamp (measured 2026-09-12, hold.mojo's move into
# the fork). /src holds sources only, so clearing it costs nothing.
# The stamp is what makes the copy above verifiable: the sync recomputes it
# from what actually landed in /work and refuses to build on a mismatch.
# Without it a partial extraction -- or a stale bind mount, in the other
# container recipe -- rebuilds the wrong sources and this gate passes having
# tested them.
stamp=$(bash scripts/probes/source_stamp.sh) || exit 1
docker exec -e M0_SYNC_STAMP="$stamp" "$c" bash /src/scripts/probes/linux_sync.sh core http datastar wsgi serve ffi || exit 1
for mode in $modes; do
  case $mode in
    elastic)  envs="M0_POOL_ELASTIC=1" ;;
    parallel) envs="M0_POOL_PARALLEL=1" ;;
    eager)    envs="M0_POOL_ELASTIC=0" ;;
    *) echo "stress-pool: unknown mode '$mode' (elastic|parallel|eager)"; exit 1 ;;
  esac
  echo "stress-pool[$mode]: smoke-django-realtime phase 5, $rounds rounds, a fresh server each"
  docker exec -w /work "$c" env $envs uv run --no-sync python3 scripts/probes/phase5_probe.py "$rounds" \
    || { echo "stress-pool: FAILED in $mode mode (phase5_probe.py) — a job was pushed and nobody was woken for it"; exit 1; }
  echo "stress-pool[$mode]: $holds holds opened while three clients keep the loop busy"
  docker exec -w /work "$c" env $envs uv run --no-sync python3 scripts/probes/hold_race_probe.py "$holds" \
    || { echo "stress-pool: FAILED in $mode mode (hold_race_probe.py)"; exit 1; }
  echo "stress-pool[$mode] OK: $rounds/$rounds rounds, $holds/$holds holds"
done
"""

# Not a gate: the C ping-pong docs/notes/elastic-pool.md quotes (W receivers
# blocked on one SOCK_DGRAM pair; macOS wakes all of them, Linux the oldest).
[tool.poe.tasks.probe-herd]
help = "PROBE: CPU per datagram round trip with 1/2/4/8 receivers parked on one socket (the wake herd; not a gate)"
shell = """
out=$(mktemp -d); trap 'rm -rf "$out"' EXIT
cc -O2 -o "$out/herd" scripts/probes/herd.c || exit 1
for w in 1 2 4 8; do "$out/herd" $w 100000; done
"""

[tool.poe.tasks.serve-asgi-bare]
help = "Serve the bare ASGI example on :8088 with m0serve"
deps = ["build-serve"]
cmd = "bin/m0serve bareapp.asgi:application --app-dir apps/asgi_bare --port 8088"

# The ASGI row: detection, the buffered bridge's HTTP contract, lifespan,
# the streaming watchdog, zero-config defaults, discovery, refusals, and
# the same RSS guard the Django row carries — the ASGI path must not leak
# per request any more than the WSGI path may.
[tool.poe.tasks.smoke-asgi]
help = "ASGI conformance: detection, scope shape, lifespan, streaming guard, zero-config defaults"
deps = ["build-serve"]
shell = """
out=$(mktemp -d)
srv=bin/m0serve
SPEC="bareapp.asgi:application --app-dir apps/asgi_bare --port 8088"
B=http://localhost:8088

cleanup() {
  kill $pid 2>/dev/null
  rm -rf "$out"
}
trap cleanup EXIT

fail() {
  echo "$1"
  if [ -f asgi.log ]; then echo '=== asgi.log ==='; cat asgi.log; fi
  exit 1
}

# A server still alive long after SIGTERM is a hang, not a slow drain: the
# drain is 5 s and the thread join another 5, so 30 s is generous. Unbounded,
# `wait $pid` here ate the smoke job's whole 20 min cap once (macOS,
# 2026-09-02: an inverted server that never exited) and left no log to read.
# Bounded, the failure names its phase and prints asgi.log.
wait_exit() {
  waited=0
  while kill -0 $pid 2>/dev/null && [ $waited -lt 300 ]; do
    sleep 0.1; waited=$((waited + 1))
  done
  if kill -0 $pid 2>/dev/null; then
    kill -9 $pid 2>/dev/null; wait $pid 2>/dev/null
    fail "$1: m0serve still alive 30 s after SIGTERM"
  fi
  wait $pid 2>/dev/null; rc=$?
}

# --- phase 1: zero-config against the bare app -------------------------------
# No topology flag, no M0_* topology variable: detection must answer asgi and
# the asyncio executor must be serving — the out-of-box ASGI shape. No pool:
# the executor IS the concurrency, so no x-thread header either. The short
# heartbeat cadence arms the split-event assert below: ASGI streams must
# never see a comment injected mid-frame, whatever the cadence.
M0_SSE_HEARTBEAT_MS=300 "$srv" $SPEC > asgi.log 2>&1 &
pid=$!

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ \
  | grep -q 'hello from asgi_bare' || fail 'GET / did not answer'
grep -q 'protocol=asgi' asgi.log || fail 'the banner does not report protocol=asgi'
grep -q 'asgi-loop' asgi.log || fail 'zero-config ASGI did not pick the asyncio executor'
grep -q 'blocking-threads' asgi.log && fail 'zero-config ASGI started a handler pool beside the executor'
curl -s -D "$out/hdr" $B/ -o /dev/null
grep -qi '^x-thread' "$out/hdr" && fail 'x-thread present: a pool is serving where the executor should be'

# The scope: headers lowercased byte pairs, query_string raw bytes, path
# decoded, lifespan state shallow-copied in.
scope=$(curl -s -H 'X-Custom: yes' "$B/scope?a=1&b=%20x")
echo "$scope" | grep -qF '"query_string": "a=1&b=%20x"' || fail "query_string wrong: $scope"
echo "$scope" | grep -qF '["x-custom", "yes"]' || fail "header pair missing: $scope"
echo "$scope" | grep -qF '"asgi_version": "3.0"' || fail "asgi version missing: $scope"

# The request body arrives as ONE http.request message, byte for byte.
python3 - <<'PYEOF'
import http.client, sys
body = bytes(range(256)) * 4
c = http.client.HTTPConnection("localhost", 8088, timeout=10)
c.request("POST", "/echo", body=body)
got = c.getresponse().read()
c.close()
sys.exit(0 if got == body else 1)
PYEOF
[ $? = 0 ] || fail 'binary body did not round-trip through receive()/send()'

# A finite more_body sequence is joined; two Set-Cookie headers both survive;
# an arbitrary status passes through.
got=$(curl -s $B/chunks)
[ "$got" = "one-two-three" ] || fail "finite chunked body not joined: got '$got'"
n=$(curl -s -D - $B/cookies -o /dev/null | grep -ci '^set-cookie')
[ "$n" = "2" ] || fail "expected 2 Set-Cookie headers, got $n"
code=$(curl -s -o /dev/null -w '%{http_code}' $B/status/418)
[ "$code" = "418" ] || fail "status passthrough failed: got $code"

# Thirty-two streams at once, FileResponse-shaped (4 KB pieces). The credit
# window is per stream while the chunk channel is shared and finite, so 32
# windows in flight overflow it; the executor used to retry 64 times and then
# DROP the datagram, and the body arrived short with a clean terminator -- a
# corrupt 200 -- or, with the end frame gone, never completed. Twelve
# concurrent WhiteNoise static files under a real Django project found it
# (docs/REAL_APP_VALIDATION.md). Every body must be exactly 237568 bytes.
(for i in $(seq 1 32); do echo "$B/stream?size=237568&piece=4096"; done) \
  | xargs -P 32 -I{} curl -s -o /dev/null -w '%{size_download}\n' --max-time 30 {} > "$out/sizes"
short=$(awk '$1 != 237568' "$out/sizes" | wc -l | tr -d ' ')
[ "$short" = "0" ] || fail "$short of 32 concurrent streams arrived short or not at all: $(sort "$out/sizes" | uniq -c | tr '\n' ' ')"
# And the server is still whole afterwards.
curl -s --max-time 5 $B/ | grep -q 'hello from asgi_bare' || fail 'the server did not answer after 32 concurrent streams'

# Lifespan ran at startup and its state reached the request scope.
curl -s $B/lifespan | grep -qF '"started": true' || fail 'lifespan startup did not run'
curl -s $B/lifespan | grep -qF '"state_flag": true' || fail 'lifespan state did not reach the scope'

# Await-concurrency: EIGHT 1.5s awaits must overlap on ONE loop with NO
# threads — the executor multiplexes them on the application's own awaits.
# A pool of 4 would take ~3s; the buffered bridge would take 12s.
python3 - <<'PYEOF'
import http.client, sys, threading, time
def one():
    c = http.client.HTTPConnection("localhost", 8088, timeout=15)
    c.request("GET", "/slow?ms=1500"); c.getresponse().read(); c.close()
t0 = time.time()
threads = [threading.Thread(target=one) for _ in range(8)]
for t in threads: t.start()
for t in threads: t.join()
sys.exit(0 if time.time() - t0 < 3.0 else 1)
PYEOF
[ $? = 0 ] || fail 'eight slow views did not overlap: the asyncio executor is not multiplexing'

# The RSS guard, same shape and same limit as smoke-django's: the ASGI path
# adds a Python-side scope build per request and must still not leak.
rss0=$(ps -o rss= -p $pid | tr -d ' ')
python3 - <<'PYEOF'
import http.client
done = attempts = 0
conn = http.client.HTTPConnection("localhost", 8088)
while done < 10000 and attempts < 20000:
    attempts += 1
    try:
        conn.request("GET", "/")
        conn.getresponse().read()
        done += 1
    except Exception:
        conn.close()
        conn = http.client.HTTPConnection("localhost", 8088)
conn.close()
raise SystemExit(0 if done >= 10000 else 1)
PYEOF
[ $? = 0 ] || fail 'leak-check load loop could not complete 10k requests'
rss1=$(ps -o rss= -p $pid | tr -d ' ')
growth=$((rss1 - rss0))
echo "asgi rss growth over 10k requests: ${growth}KB (limit ${M0_RSS_LIMIT_KB:-12288}KB)"
python3 scripts/emit.py asgi.rss_growth_kb "$growth" --unit KB --limit "${M0_RSS_LIMIT_KB:-12288}" --task smoke-asgi
[ "$growth" -lt "${M0_RSS_LIMIT_KB:-12288}" ] || fail "asgi bridge leaked ${growth}KB of RSS over 10k requests"

# --- the streaming surface (Phase 3a) ----------------------------------------
# An infinite SSE stream actually STREAMS: events arrive incrementally,
# the client walks away, and the server notices (disconnect tag → task
# cancelled) and stays healthy.
n=$(curl -sN --max-time 3 $B/stream-forever | head -6 | grep -c '^data:')
[ "$n" -ge 3 ] || fail "expected >=3 live SSE events from /stream-forever, got $n"
curl -s --fail $B/ > /dev/null || fail 'server died after a streaming client vanished'

# A 1 MB streamed body arrives byte-exact through the 32 KB chunk split
# and the credit window — hash-compared, because a truncated-in-the-middle
# body is the failure mode a drop-based path would produce.
want=$(python3 -c "import hashlib; b=bytes(range(256))*256; print(hashlib.md5(b*16).hexdigest())")
got=$(curl -s "$B/stream?size=1048576" | md5sum | cut -d' ' -f1)
[ "$got" = "$want" ] || fail "streamed 1MB body corrupt: $got != $want"

# Datastar-shaped named events, one split mid-word across two sends with a
# pause longer than the heartbeat cadence: the loop must NOT inject a
# ': heartbeat' comment inside the frame. Byte-exact or bust — this is
# what keeps signals-based patterns (Datastar, htmx SSE) safe. The hash
# is of the two fixed events /stream-events emits, precomputed (a TOML
# multiline string mangles inline-python backslash escapes).
hb_want=86bb66cab11c93043981f0eff7ff3586
hb_got=$(curl -sN --max-time 10 $B/stream-events | md5sum | cut -d' ' -f1)
[ "$hb_got" = "$hb_want" ] || fail 'a split SSE event was corrupted (heartbeat injection?)'

# --- Chunked framing: the stream leaves its connection reusable ---------------
# Everything above passes with close-delimited streams too -- the bytes
# arrive either way. The one thing that cannot work without real framing
# is a SECOND request on the same connection, so the probe speaks HTTP on
# a raw socket, decodes the chunked body by hand (catching a wrong chunk
# size or a missing terminator that a lenient client would paper over),
# and then reuses the connection. Verified load-bearing against a
# close-delimited build, where it fails on the missing header.
M0_PORT=8088 python3 scripts/chunked_keepalive.py \
  || fail 'a streamed response did not leave its connection reusable'

# --- WebSockets (Phase 3b) ---------------------------------------------------
# The raw RFC 6455 probe: handshake with verified accept, prefixed text
# echo, binary echo, app-initiated close(1000) through to the FIN — then a
# second connection that vanishes abruptly after the 101, whose disconnect
# must cancel the app task and leave the server healthy.
M0_PORT=8088 python3 apps/asgi_bare/ws_probe.py || fail 'the ASGI WebSocket probe failed'
curl -s --fail $B/ > /dev/null || fail 'server died after an abrupt WebSocket disconnect'

# Graceful stop with a live stream in flight: drains and exits 0.
curl -sN --max-time 10 $B/stream-forever > /dev/null &
stream_pid=$!
sleep 0.5
kill -TERM $pid
wait_exit 'SIGTERM with a live stream'
kill $stream_pid 2>/dev/null; wait $stream_pid 2>/dev/null
[ "$rc" = "0" ] || fail "SIGTERM with a live stream: exit $rc, want 0"

# Two requests that outlive the 5 s drain and finish in DIFFERENT loop
# iterations after the pill: the executor's post-pill gather must run both
# to completion and lifespan shutdown must still reach the application.
# A pump stop() scheduled inside that gather ended it with "Event loop
# stopped before Future completed" and skipped shutdown -- the marker file
# is the discriminator (it is written by the app's lifespan.shutdown), the
# log line the tell. Buffered request tasks are not cancelled by the
# farewell (only stream tasks are), which is what keeps them in flight.
M0_SHUTDOWN_MARKER="$out/shutdown.marker" "$srv" $SPEC > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail 'restart for the outlive-the-drain phase did not answer'
curl -s -m 15 "$B/slow?ms=5800" -o /dev/null &
c1=$!
curl -s -m 15 "$B/slow?ms=6800" -o /dev/null &
c2=$!
sleep 0.3
kill -TERM $pid
wait $c1 $c2 2>/dev/null
wait_exit 'SIGTERM with two requests outliving the drain'
[ "$rc" = "0" ] || fail "SIGTERM with two requests outliving the drain: exit $rc, want 0"
grep -q 'stopped before Future completed' asgi.log \
  && fail 'the post-pill gather was cut short by the pump stop'
[ -f "$out/shutdown.marker" ] \
  || fail 'lifespan shutdown did not reach the application after the drain'

# The other half of that case, and the one the loop inversion got wrong: a
# request that finishes INSIDE the drain must be answered when it FINISHES,
# not when the budget runs out. The phase above uses requests that outlive
# the 5 s drain on purpose, so it cannot see this -- both a correct drain
# and a frozen one end at the deadline there.
#
# Inverted, `_run_shutdown` ran to completion inside an asyncio callback,
# and the application's in-flight tasks live on that same loop: they could
# not be stepped, `active_count` never fell, and a 1.5 s request was
# answered at 5.36 s against the pump's 1.50. The drain is stepped now
# (`_port.drain_step`, one non-blocking pass, awaiting between passes).
# The bound is deliberately loose -- 3 s, against a 1.5 s request and a 5 s
# budget -- because what it discriminates is "finished" from "gave up", and
# a shared runner should not fail on a slow second.
M0_SHUTDOWN_MARKER="$out/drain2.marker" "$srv" $SPEC > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail 'restart for the answered-inside-the-drain phase did not answer'
started=$(python3 -c 'import time; print(time.time())')
curl -s -m 20 -o "$out/drain2.body" -w '%{http_code}' "$B/slow?ms=1500" > "$out/drain2.code" &
c3=$!
sleep 0.3
kill -TERM $pid
wait $c3 2>/dev/null
elapsed=$(python3 -c "import time; print('%.2f' % (time.time() - $started))")
wait_exit 'SIGTERM with a request that finishes inside the drain'
[ "$rc" = "0" ] || fail "SIGTERM with a request finishing inside the drain: exit $rc, want 0"
[ "$(cat "$out/drain2.code")" = "200" ] \
  || fail "a request finishing inside the drain was not answered 200 (got $(cat "$out/drain2.code"))"
python3 -c "import sys; sys.exit(0 if $elapsed < 3.0 else 1)" \
  || fail "a 1.5 s request was answered ${elapsed}s after it was sent — the drain waited out its budget instead of stepping (item 6)"
echo "in-flight request answered ${elapsed}s after it was sent (budget is 5s)"
python3 scripts/emit.py asgi.drain_inflight_s "$elapsed" --unit s --limit 3.0 --task smoke-asgi
[ -f "$out/drain2.marker" ] \
  || fail 'lifespan shutdown did not run after the answered-inside-the-drain phase'

# --- phase 2: explicit topology wins ------------------------------------------
# The escape hatch: an explicit pool keeps the Phase-1 buffered bridge —
# x-thread on responses, no asgi-loop in the banner.
M0_BLOCKING_THREADS=3 "$srv" $SPEC > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail 'M0_BLOCKING_THREADS=3 server never became healthy'
grep -q 'blocking-threads=3' asgi.log || fail 'the explicit pool size is not in the banner'
grep -q 'blocking-threads=3 (auto)' asgi.log && fail 'an explicit pool is marked (auto)'
grep -q 'asgi-loop' asgi.log && fail 'the executor started despite an explicit pool'
curl -s -D "$out/hdr" $B/ -o /dev/null
grep -qi '^x-thread' "$out/hdr" || fail 'no x-thread: the explicit pool is not serving'
# The buffered pool path keeps its watchdog: an infinite stream is a
# clean, explanatory 500 there — never a hang — and the server survives.
code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 $B/stream-forever)
[ "$code" = "500" ] || fail "buffered-pool infinite stream expected the watchdog's 500, got $code"
curl -s --fail $B/ > /dev/null || fail 'server died after the buffered watchdog fired'
kill -TERM $pid
wait $pid 2>/dev/null

# And the WSGI half of zero-config: no topology flags against the WSGI bare
# app must pick the auto pool.
"$srv" bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8088 > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail 'zero-config WSGI server never became healthy'
grep -q 'protocol=wsgi' asgi.log || fail 'the WSGI banner does not report protocol=wsgi'
grep -q 'blocking-threads=.* (auto)' asgi.log || fail 'zero-config WSGI did not pick an auto pool'
curl -s -D "$out/hdr" $B/ -o /dev/null
grep -qi '^x-thread' "$out/hdr" || fail 'no x-thread: the zero-config WSGI pool is not serving'
kill -TERM $pid
wait $pid 2>/dev/null

# --- phase 3: discovery and the forced protocol -------------------------------
# A bare MODULE finds bareapp.asgi:application by convention.
"$srv" bareapp --app-dir apps/asgi_bare --port 8088 > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ \
  | grep -q 'hello from asgi_bare' || fail 'discovery did not find bareapp.asgi:application'
grep -q 'm0serve: bareapp.asgi:application' asgi.log || fail 'the banner does not name the discovered spec'
kill -TERM $pid
wait $pid 2>/dev/null

"$srv" $SPEC --protocol bogus > asgi.log 2>&1; rc=$?
[ "$rc" = "2" ] || fail "--protocol bogus: exit $rc, want 2"

# --- phase 4: refusals --------------------------------------------------------
# Not callable at all: a startup error naming BOTH expected signatures and
# every discovery spec tried.
echo 'application = 42' > "$out/notcallable.py"
"$srv" notcallable --app-dir "$out" --port 8088 > asgi.log 2>&1; rc=$?
[ "$rc" = "1" ] || fail "non-callable app: exit $rc, want 1"
grep -q 'app(environ, start_response)' asgi.log || fail 'the error does not name the WSGI signature'
grep -q 'app(scope, receive, send)' asgi.log || fail 'the error does not name the ASGI signature'
grep -q 'tried notcallable:application' asgi.log || fail 'the error does not list the specs tried'

# ASGI and --realtime: refused before the bind when forced, at load when
# detected — same sentence both ways.
"$srv" $SPEC --protocol asgi --realtime > asgi.log 2>&1; rc=$?
[ "$rc" = "2" ] || fail "--protocol asgi --realtime: exit $rc, want 2"
grep -q 'realtime requires a WSGI application' asgi.log || fail 'forced refusal message wrong'
"$srv" $SPEC --realtime > asgi.log 2>&1; rc=$?
[ "$rc" = "1" ] || fail "detected asgi + --realtime: exit $rc, want 1"
grep -q 'realtime requires a WSGI application' asgi.log || fail 'detected refusal message wrong'

# --- the validated pass: the wsgiref.validate that ASGI never got -------
# M0_ASGI_VALIDATE=1 wraps the app in bareapp/validate.py, which asserts
# the SERVER'S obligations from the ASGI 3 spec -- scope keys and exact
# types (bytes-vs-str is THE classic server bug), receive-stream protocol,
# and one app-side rule so the canary below can exist. A violation raises
# out of the app and answers 500, so conformance failure is a failing
# status, never a quiet pass.
M0_ASGI_VALIDATE=1 "$srv" $SPEC > asgi.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ \
  > /dev/null || fail 'the validated server never became healthy'
for r in /scope /lifespan "/slow?ms=50"; do
  code=$(curl -s -o /dev/null --max-time 8 -w '%{http_code}' "$B$r")
  [ "$code" = "200" ] || fail "validated $r answered $code -- the server violated the ASGI contract (see asgi.log)"
done
echo -n 'ab' | curl -s --max-time 8 --data-binary @- $B/echo | grep -q 'ab' \
  || fail 'validated POST echo failed'
# The engagement canary, /pep3333/canary's twin: a bogus message type the
# unvalidated server ignores (an ordinary 200) and the validator refuses
# (500). Without it, a misspelled variable downgrades this whole pass into
# a second unvalidated run that always succeeds.
code=$(curl -s -o /dev/null --max-time 8 -w '%{http_code}' $B/validate/canary)
[ "$code" = "500" ] || fail "the validator canary answered $code, want 500 -- the wrapper is not engaged"
kill $pid 2>/dev/null; wait $pid 2>/dev/null

rm -f asgi.log
echo "smoke-asgi OK"
python3 scripts/emit.py --covers L1 --task smoke-asgi
python3 scripts/emit.py --covers L2 --task smoke-asgi
python3 scripts/emit.py --covers L3 --task smoke-asgi
python3 scripts/emit.py --covers L4 --task smoke-asgi
python3 scripts/emit.py --covers L5 --task smoke-asgi
python3 scripts/emit.py --covers L6 --task smoke-asgi
python3 scripts/emit.py --covers L8 --task smoke-asgi
python3 scripts/emit.py --covers L15 --task smoke-asgi
python3 scripts/emit.py --covers M3 --task smoke-asgi
"""

# The keep-alive request cap (`max_keepalive_requests`, 100) closes a
# connection once it has been reused that many times. A stream and a
# WebSocket upgrade are not reuse -- each owns the connection until it ends,
# and `_finish_response` clears `should_close` for both to say so -- but the
# cap check below those branches was guarded by `not should_close`, which is
# precisely what they had just established. Both shapes were caught, and
# `_after_send` closed the slot as the HEAD drained: a 200 with
# `Content-Length` set and zero body bytes, and a 101 that never framed.
# Found by a real-application soak (docs/REAL_APP_VALIDATION.md), on the
# hundredth request of a keep-alive connection, silent in the server log.
[tool.poe.tasks.smoke-keepalive-cap]
help = "The keep-alive cap must close the connection, not destroy the response"
deps = ["build-serve"]
shell = """
srv=bin/m0serve
fail() {
  echo "$1"
  if [ -f kac.log ]; then echo '=== kac.log ==='; cat kac.log; fi
  exit 1
}
# The cap is pinned here rather than inherited: the probe counts to 100,
# and a gate that read the default would test nothing the day the default
# moved (docs/notes/pool-tail.md moved it).
"$srv" bareapp.asgi:application --app-dir apps/asgi_bare --port 8144 --max-keepalive-requests 100 > kac.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null; rm -f kac.log' EXIT
curl --retry 20 --retry-delay 1 --retry-all-errors --silent --fail http://localhost:8144/ > /dev/null \
  || fail 'the asgi_bare app never became healthy'
python3 scripts/keepalive_cap_probe.py 8144 || fail 'keepalive cap probe failed'
python3 scripts/emit.py --covers A3 --task smoke-keepalive-cap
"""

# SPEC I17: `MAX_PENDING_BYTES` bounds ONE frame as well as the whole queue,
# so a WebSocket message at or above 64 KB can never be queued -- the credit
# gate clamps rather than waiting for a window that can never exist. The
# server ends the connection instead, because a dropped frame is a message
# the peer has no protocol-level way to notice it missed. The probe's marker
# is what separates that from the silent drop; its under-cap half is what
# stops a server that ends every large-message connection from passing.
[tool.poe.tasks.smoke-outbox-cap]
help = "A message at or above the outbox cap ends the connection, not silently dropped"
deps = ["build-serve"]
shell = """
srv=bin/m0serve
fail() {
  echo "$1"
  if [ -f oc.log ]; then echo '=== oc.log ==='; cat oc.log; fi
  exit 1
}
"$srv" bareapp.asgi:application --app-dir apps/asgi_bare --port 8156 > oc.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null; rm -f oc.log' EXIT
curl --retry 20 --retry-delay 1 --retry-all-errors --silent --fail http://localhost:8156/ > /dev/null \
  || fail 'the asgi_bare app never became healthy'
python3 scripts/outbox_cap_probe.py 8156 || fail 'outbox cap probe failed'
python3 scripts/emit.py --covers I17 --task smoke-outbox-cap
"""

# An SSE hold from a Mojo mount (SPEC N11). A view on the Mojo mount
# returns the two instruction headers a Django view returns, the pool
# thread rewrites the response into the stream's head and sends the loop
# the `h` frame a WSGI pool thread sends, and a publish from Django reaches
# the Mojo-held stream through the loop's registries. Each phase pins one
# thing that was silent-wrong or absent before: the frame arriving before
# the head (delivery at all), the reconnect cursor reaching the
# subscription, the hold drained as a HOLD (comment heartbeats, no chunked
# framing -- the smoke-django-realtime phase-6 shape), the slot released
# when the client leaves, the Mojo lane answering while the Python pool is
# busy, and the degrade without --realtime. The negative arm is the
# refusal that still stands: mojo_pool.mojo's 409 for an unheld stream,
# kept by test_mojo_pool and the pool sabotage.
[tool.poe.tasks.smoke-mount-seam]
help = "An application supplies its own Mojo mount by module, without copying m0serve.mojo"
shell = """
set -u
P=8795
B=http://localhost:$P
srv=bin/m0serve-seam
pid=
fail() { echo "FAIL: $1"; [ -n "$pid" ] && kill $pid 2>/dev/null; cat seam.log 2>/dev/null; rm -f seam.log seam_index.html; exit 1; }

# A directory with no mount module is refused by the build, in seconds, not
# compiled into something. Asserted on the task's own status, never a pipe's.
M0SERVE_MOUNT_DIR=packages/m0-wsgi/mount_fixture/absent M0SERVE_OUT=bin/m0serve-absent \
  uv run poe build-serve > /dev/null 2>&1
rc=$?
[ $rc -ne 0 ] || fail "build-serve accepted a mount directory with no m0serve_mount.mojo"
[ ! -e bin/m0serve-absent ] || fail "a refused mount directory still produced a binary"

# The seam: the same entry file, a different module on the path.
M0SERVE_MOUNT_DIR=packages/m0-wsgi/mount_fixture M0SERVE_OUT=$srv \
  uv run poe build-serve || fail "build-serve with the fixture mount did not build"

"$srv" --mount /=bareapp.wsgi --mount /native=mojo \
  --app-dir apps/wsgi_bare --port $P --blocking-threads 2 > seam.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail "server never became healthy"

# The fixture's routes answer, from a pool thread, with its own state.
body=$(curl -s $B/native/hello/ada)
echo "$body" | grep -q '"mount":"fixture"' || fail "the fixture mount did not answer: $body"
echo "$body" | grep -q '"name":"ada"' || fail "the fixture's path parameter did not arrive: $body"
echo "$body" | grep -q '"greeted":' || fail "the fixture's per-thread state did not answer: $body"

# REPLACED, not joined: the demo mount's routes are gone. With both modules
# on the path the first root wins silently, so this is the assertion that
# tells a replaced mount from a demo that happened to answer too.
code=$(curl -s -o /dev/null -w '%{http_code}' $B/native/probe)
[ "$code" = "404" ] || fail "the demo mount's /probe answered $code; the fixture did not replace it"

# A link the fixture renders carries the prefix, and following it lands.
curl -s -o seam_index.html $B/native/ || fail "the fixture's index did not answer"
href=$(grep -o 'href="[^"]*"' seam_index.html | head -1 | cut -d'"' -f2)
case "$href" in /native/hello/*) ;; *) fail "the fixture rendered $href, not a link under /native";; esac
curl -s "$B$href" | grep -q '"mount":"fixture"' || fail "following $href did not reach the fixture"

# The Python mount beside it is untouched.
curl -s $B/ | grep -q 'bare wsgi app' || fail "the WSGI mount did not answer"

kill -TERM $pid
for _ in $(seq 1 100); do kill -0 $pid 2>/dev/null || break; sleep 0.1; done
if kill -0 $pid 2>/dev/null; then kill -9 $pid; fail "did not exit within 10s of SIGTERM"; fi
pid=

rm -f seam.log seam_index.html "$srv"
echo "smoke-mount-seam OK"
python3 scripts/emit.py --covers N14 --task smoke-mount-seam
"""

[tool.poe.tasks.smoke-mojo-mount-hold]
help = "An SSE hold taken on a Mojo mount's pool thread, fed by a publish from Django"
deps = ["build-serve"]
shell = """
set -u
srv=bin/m0serve
P=8797
B=http://localhost:$P
D="--app-dir apps/django_realtime"
pid=
out=$(mktemp -d)
fail() { echo "FAIL: $1"; [ -n "$pid" ] && kill $pid 2>/dev/null; cat "$out"/server.log 2>/dev/null; rm -rf "$out"; exit 1; }
cleanup() { [ -n "$pid" ] && kill $pid 2>/dev/null; rm -rf "$out"; }
trap cleanup EXIT

# --- phase 1: the hold, and a publish from Django reaching it ----------
M0_SSE_HEARTBEAT_MS=800 "$srv" --mount /=djangoproj.wsgi:application --mount /native=mojo $D \
  --realtime --blocking-threads 2 --health-path /health --port $P > "$out"/server.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 1 --retry-all-errors --silent --fail $B/health > /dev/null \
  || fail "server never became healthy"

curl -s -N --max-time 4 -D "$out"/head1 "$B/native/hold?channel=news" > "$out"/body1 &
c1=$!
sleep 1
curl -s -X POST "$B/publish?channel=news&msg=first" | grep -q '"id": 1' \
  || fail "the publish did not allocate id 1 (is the shared counter exported?)"
curl -s $B/health | grep -q '"subscribers":1' \
  || fail "the loop's registry does not show the Mojo-held slot subscribed: $(curl -s $B/health)"
wait $c1
grep -q '^HTTP/1.1 200' "$out"/head1 || fail "the hold was not answered 200: $(head -1 "$out"/head1)"
grep -qi '^content-type: text/event-stream' "$out"/head1 || fail "the head is not an event stream"
grep -qi '^x-worker:' "$out"/head1 || fail "the head does not name its worker, as a WSGI hold's does"
grep -qi '^transfer-encoding' "$out"/head1 && fail "a hold was drained as an executor stream (chunked framing)"
grep -qi '^m0-hold\\|^m0-channel' "$out"/head1 && fail "the instruction headers leaked to the wire under --realtime"
grep -q '"mount":"mojo"' "$out"/body1 || fail "the Mojo view's head did not open the stream"
grep -q '^id: 1$' "$out"/body1 || fail "the published event's id did not reach the Mojo-held stream"
grep -q '^data: first$' "$out"/body1 || fail "the publish from Django did not reach the Mojo-held stream"
grep -q '^: heartbeat' "$out"/body1 || fail "no comment heartbeat on the held stream (drained as a stream, not a hold?)"

# --- phase 2: the slot is released when the client leaves ---------------
for _ in $(seq 1 30); do
  curl -s $B/health | grep -q '"subscribers":0' && break
  sleep 0.1
done
curl -s $B/health | grep -q '"subscribers":0' \
  || fail "the slot was not unsubscribed after the client left: $(curl -s $B/health)"

# --- phase 3: the reconnect cursor reaches the subscription -------------
# Last-Event-ID: 3 while the counter stands at 1 -- ids 2 and 3 must be
# muted and id 4 delivered, which is only true if the pool thread read the
# header off the request and the loop subscribed with it.
curl -s -N --max-time 4 -H 'Last-Event-ID: 3' "$B/native/hold?channel=news" > "$out"/body3 &
c3=$!
sleep 1
for m in second third fourth; do
  curl -s -X POST "$B/publish?channel=news&msg=$m" > /dev/null
done
wait $c3
grep -q '^data: fourth$' "$out"/body3 || fail "id 4 did not reach a client resuming at 3"
grep -q '^data: second$\\|^data: third$' "$out"/body3 && fail "an event at or below the client's Last-Event-ID was re-sent"

# --- phase 4: the Mojo lane holds while the Python pool is busy ---------
# Both WSGI threads inside 1.5 s views; the hold rides the Mojo lane's own
# threads, so its head arrives at once, and the publish that follows lands
# once a Python thread is free.
curl -s --max-time 5 "$B/slow?ms=1500" > /dev/null &
s1=$!
curl -s --max-time 5 "$B/slow?ms=1500" > /dev/null &
s2=$!
sleep 0.2
t0=$(python3 -c 'import time; print(time.time())')
curl -s -N --max-time 4 -D "$out"/head4 "$B/native/hold?channel=news" > "$out"/body4 &
c4=$!
for _ in $(seq 1 50); do
  grep -q '^HTTP/1.1 200' "$out"/head4 2>/dev/null && break
  sleep 0.02
done
dt=$(python3 -c "import time; print(round(time.time() - $t0, 3))")
grep -q '^HTTP/1.1 200' "$out"/head4 || fail "the hold's head did not arrive while the Python pool was busy"
python3 -c "import sys; sys.exit(0 if $dt < 1.0 else 1)" \
  || fail "the hold's head took ${dt}s behind two 1.5 s Python views; the Mojo lane is not isolated"
echo "hold head behind two busy Python threads: ${dt}s"
python3 scripts/emit.py mojo-mount-hold-head-s "$dt" --unit s --limit 1.0 --task smoke-mojo-mount-hold
sleep 1.6
curl -s -X POST "$B/publish?channel=news&msg=fifth" > /dev/null
wait $c4
grep -q '^data: fifth$' "$out"/body4 || fail "the publish did not reach the hold taken under load"
wait $s1 $s2

kill -TERM $pid
for _ in $(seq 1 100); do kill -0 $pid 2>/dev/null || break; sleep 0.1; done
if kill -0 $pid 2>/dev/null; then kill -9 $pid; fail "did not exit within 10s of SIGTERM with a Mojo hold live"; fi
pid=

# --- phase 5: without --realtime the same view degrades, as a Django one does
"$srv" --mount /=djangoproj.wsgi:application --mount /native=mojo $D \
  --blocking-threads 2 --health-path /health --port $P > "$out"/server2.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 1 --retry-all-errors --silent --fail $B/health > /dev/null \
  || fail "server never became healthy without --realtime"
curl -s --max-time 3 -D "$out"/head5 "$B/native/hold?channel=news" > "$out"/body5 \
  || fail "without --realtime the hold view did not answer as an ordinary response"
grep -q '^HTTP/1.1 200' "$out"/head5 || fail "the degraded answer is not a 200"
grep -qi '^content-length:' "$out"/head5 || fail "the degraded answer was held rather than served"
grep -q '"mount":"mojo"' "$out"/body5 || fail "the degraded answer lost the view's body"
kill -TERM $pid; wait $pid 2>/dev/null; pid=

echo "smoke-mojo-mount-hold OK"
python3 scripts/emit.py --covers N11 --task smoke-mojo-mount-hold
"""

# The grant-verified hold mount (SPEC I21). Django decides, in its own
# view with its own session, whether a browser may hold a stream and on
# which channel, and signs that into the stream URL (`m0serve.grant`); a
# `--mount PREFIX=hold` verifies the grant on a pool thread that never
# touches Python and takes the hold. Each phase pins one property of the
# design: the two startup refusals (and the doctor agreeing), a bound grant
# admitting its own session and a publish reaching it, every refusal shape
# by name (no cookie, another session's cookie, expired, tampered, no
# grant), a grant signed under the previous key admitted while it is
# listed, an unbound grant needing no cookie, and the issuer refusing a
# channel the format cannot carry. The verifier's unit form is
# test_grant.mojo, against grants the same issuer signed.
[tool.poe.tasks.smoke-hold-mount]
help = "A stream held on a Mojo pool thread against a grant Django signed"
deps = ["build-serve"]
shell = """
set -u
srv=bin/m0serve
P=8803
B=http://localhost:$P
D="--app-dir apps/django_realtime"
M="--mount /=djangoproj.wsgi:application --mount /rt=hold"
export M0_GRANT_KEY="smoke-key-0123456789abcdef0123456789abcdef"
export M0_GRANT_KEY_PREV="smoke-prev-key-fedcba9876543210fedcba98765432"
pid=
out=$(mktemp -d)
fail() { echo "FAIL: $1"; [ -n "$pid" ] && kill $pid 2>/dev/null; cat "$out"/server.log 2>/dev/null; rm -rf "$out"; exit 1; }
cleanup() { [ -n "$pid" ] && kill $pid 2>/dev/null; rm -rf "$out"; }
trap cleanup EXIT
grant_url() { curl -s --max-time 5 "$@" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])'; }

# --- phase 1: the refusals, and the doctor agreeing with each ----------
"$srv" $M $D --port $P --blocking-threads 2 > "$out"/r1.log 2>&1
rc=$?; [ $rc -eq 2 ] || fail "a hold mount without --realtime exited $rc, expected 2"
grep -q 'needs --realtime' "$out"/r1.log || fail "the refusal did not name --realtime"
"$srv" --doctor $M $D --port $P --blocking-threads 2 > /dev/null 2>&1
rc=$?; [ $rc -eq 2 ] || fail "--doctor disagreed with main on the missing --realtime (exit $rc)"
env -u M0_GRANT_KEY "$srv" $M $D --port $P --realtime --blocking-threads 2 > "$out"/r2.log 2>&1
rc=$?; [ $rc -eq 2 ] || fail "a hold mount without M0_GRANT_KEY exited $rc, expected 2"
grep -q 'needs M0_GRANT_KEY' "$out"/r2.log || fail "the refusal did not name M0_GRANT_KEY"
env -u M0_GRANT_KEY "$srv" --doctor $M $D --port $P --realtime --blocking-threads 2 > /dev/null 2>&1
rc=$?; [ $rc -eq 2 ] || fail "--doctor disagreed with main on the missing key (exit $rc)"

# --- phase 2: a bound grant admits its session, and a publish reaches it
"$srv" $M $D --port $P --realtime --blocking-threads 2 --health-path /health > "$out"/server.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 1 --retry-all-errors --silent --fail $B/health > /dev/null \
  || fail "server never became healthy"
url=$(grant_url -H 'Cookie: sessionid=s3cret' "$B/grant?channel=news")
case "$url" in /rt/stream?g=v1.*) ;; *) fail "the issuer did not render a stream URL into the mount: $url";; esac
curl -s -N --max-time 4 -H 'Cookie: sessionid=s3cret' -D "$out"/head "$B$url" > "$out"/body &
c=$!
sleep 1
curl -s -X POST "$B/publish?channel=news&msg=granted" > /dev/null
curl -s $B/health | grep -q '"subscribers":1' || fail "the granted stream is not subscribed in the loop's registry: $(curl -s $B/health)"
wait $c
grep -q '^HTTP/1.1 200' "$out"/head || fail "the granted hold was not answered 200: $(head -1 "$out"/head)"
grep -qi '^content-type: text/event-stream' "$out"/head || fail "the head is not an event stream"
grep -qi '^transfer-encoding' "$out"/head && fail "the hold was drained as an executor stream"
grep -qi '^m0-hold\\|^m0-channel' "$out"/head && fail "the instruction headers leaked to the wire"
grep -q '^data: granted$' "$out"/body || fail "the publish from Django did not reach the granted stream"
grep -q '^id: 1$' "$out"/body || fail "the event's id did not reach the granted stream"

# --- phase 3: every refusal, by name ------------------------------------
# Every curl here carries a time limit ON PURPOSE: on a build that wrongly
# admits one of these, the answer is a held stream, and a gate that hangs on
# the bug it guards is worse than one that fails. Found by sabotaging the
# session binding: the first run of this phase sat in an admitted hold for
# an hour and three quarters.
curl -s --max-time 5 "$B$url" | grep -q '"reason":"no session cookie"' || fail "a bound grant without its cookie was not refused as such"
curl -s --max-time 5 -H 'Cookie: sessionid=other' "$B$url" | grep -q '"reason":"session mismatch"' || fail "another session's cookie was not refused as such"
expired=$(grant_url -H 'Cookie: sessionid=s3cret' "$B/grant?channel=news&ttl=-5")
curl -s --max-time 5 -H 'Cookie: sessionid=s3cret' "$B$expired" | grep -q '"error":"expired"' || fail "an expired grant was not refused as expired"
curl -s --max-time 5 -H 'Cookie: sessionid=s3cret' "$B${url%?}Z" | grep -q '"reason":"bad signature"' || fail "a tampered tag was not refused as a bad signature"
curl -s --max-time 5 "$B/rt/stream" | grep -q '"reason":"no grant"' || fail "a stream request with no grant was not refused as such"
code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H 'Cookie: sessionid=s3cret' "$B${url%?}Z")
[ "$code" = "401" ] || fail "a refusal answered $code, expected 401"
curl -s --max-time 5 "$B/grant?channel=a.b" | grep -q 'refuses it' || fail "the issuer accepted a channel the format cannot carry"

# --- phase 4: rotation, and a grant bound to no session ------------------
prev=$(grant_url "$B/grant?channel=notate_submission_7&bind=0&key=prev")
curl -s -N --max-time 2 -D "$out"/head4 "$B$prev" > /dev/null
grep -q '^HTTP/1.1 200' "$out"/head4 || fail "a grant signed under M0_GRANT_KEY_PREV was refused while the key is listed"
unbound=$(grant_url "$B/grant?channel=news&bind=0")
curl -s -N --max-time 2 -D "$out"/head5 "$B$unbound" > /dev/null
grep -q '^HTTP/1.1 200' "$out"/head5 || fail "an unbound grant was refused without a cookie"
for _ in $(seq 1 30); do curl -s $B/health | grep -q '"subscribers":0' && break; sleep 0.1; done
curl -s $B/health | grep -q '"subscribers":0' || fail "a granted slot was not released after its client left"

kill -TERM $pid
for _ in $(seq 1 100); do kill -0 $pid 2>/dev/null || break; sleep 0.1; done
if kill -0 $pid 2>/dev/null; then kill -9 $pid; fail "did not exit within 10s of SIGTERM"; fi
pid=
grep -qi 'traceback' "$out"/server.log && fail "the server logged a traceback"

echo "smoke-hold-mount OK"
python3 scripts/emit.py --covers I21 --task smoke-hold-mount
"""

# PRE-RELEASE: rebuilds m0-http for three of its five sabotages, so minutes
# rather than seconds. The question it answers is the only one that matters
# about a security gate: not "does the suite pass", which it did before the
# login existed, but "would it notice if the check were gone".
[tool.poe.tasks.sabotage-notes-login]
help = "PRE-RELEASE: revert each session/CSRF rule and insist smoke-fragment-notes fails"
shell = "python3 scripts/notes_login_sabotage.py"

# PRE-RELEASE: rebuilds m0serve per sabotage, so minutes rather than seconds.
[tool.poe.tasks.sabotage-outbox-cap]
help = "PRE-RELEASE: revert each outbox-cap rule and insist the probe fails"
shell = "python3 scripts/outbox_cap_sabotage.py"

# Both ends of the wire in Mojo: the client dials, sends, and parses against
# the notes API — GET, POST with body, negotiation, problem+json, a refused
# connection, and the https rejection. client_check.mojo raises on any miss.
[tool.poe.tasks.smoke-client]
help = "Start the notes API, run the Mojo HTTP client against it, stop"
shell = """
M0_PORT=8091 mojo run -I packages/m0-core/ -I packages/m0-http/ apps/notes_api/server.mojo > notes.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null' EXIT
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail http://localhost:8091/health \
  || { echo '=== notes.log ==='; cat notes.log; exit 1; }
mojo run -I packages/m0-http/ -I packages/m0-core/ packages/m0-http/client_check.mojo \
  || { echo '=== notes.log ==='; cat notes.log; exit 1; }
rm -f notes.log
echo "smoke-client OK"
python3 scripts/emit.py --covers M14 --task smoke-client
"""

# The foreign-caller half of the C-ABI story: the emitted shared object must
# load and answer through ctypes — the same dlopen path Bun or N-API takes.
# Vectors are the public known answers test_hashing.mojo also pins, so the
# .so is checked against the algorithm, not against itself.
[tool.poe.tasks.bundle-ffi]
help = "Assemble a self-contained, redistributable libm0core bundle under dist/"
deps = ["build-ffi"]
shell = """
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
case "$(uname)-$(uname -m)" in
  Darwin-arm64) plat=macos-arm64 ;;
  Darwin-*)     plat=macos-x86_64 ;;
  *-aarch64)    plat=linux-aarch64 ;;
  *)            plat=linux-x86_64 ;;
esac
out="dist/libm0core-$plat"
rm -rf "$out"
python3 scripts/bundle_artifact.py "packages/m0-core/libm0core.$ext" "$out" || exit 1
# Apache-2.0 with LLVM Exceptions governs the Mojo runtime shipped alongside
# on macOS; sections 4(a) and 4(d) want the licence text and attribution to
# travel with it. Included unconditionally so the bundle is self-describing
# on both platforms.
cp licenses/LICENSE.mojo-runtime.txt "$out/LICENSE.mojo-runtime.txt" || exit 1
cp LICENSE "$out/LICENSE.mojo-http.txt" || exit 1
cp licenses/NOTICE.bundle.txt "$out/NOTICE.txt" || exit 1
python3 scripts/ffi_portability_check.py --require-self-contained \
  "$out/libm0core.$ext" || exit 1
echo "bundle ready: $out"
"""

[tool.poe.tasks.check-ffi-portable]
help = "Assert the C-ABI artifact does not depend on the machine that built it"
shell = """
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
lib=${FFI_LIB:-packages/m0-core/libm0core.$ext}
[ -f "$lib" ] || { echo "check-ffi-portable: $lib not built - run: poe build-ffi"; exit 2; }
python3 scripts/ffi_portability_check.py "$lib"
"""

# The same treatment for the CLI binary, which never had any. bin/m0serve
# statically embeds the lightbug fork, so unlike libm0core it carries an MIT
# attribution obligation into every artifact it ships in -- hence a licence
# set of its own rather than the bundle's. Deliberately NOT named smoke-*:
# scripts/check_docs.py requires every smoke-* task to be run by test.yml,
# and this one is a release-path task.
[tool.poe.tasks.bundle-serve]
help = "Assemble a self-contained, redistributable m0serve bundle under dist/"
deps = ["build-serve", "build-ffi"]
shell = """
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
case "$(uname)-$(uname -m)" in
  Darwin-arm64) plat=macos-arm64 ;;
  Darwin-*)     plat=macos-x86_64 ;;
  *-aarch64)    plat=linux-aarch64 ;;
  *)            plat=linux-x86_64 ;;
esac
out="dist/m0serve-$plat"
rm -rf "$out"
# libm0core rides along because _discover_core_lib (m0serve.mojo) looks for
# it beside argv[0] first. Without it in the bundle, --realtime and the ASGI
# state["m0"] fan-out still deliver but lose their shared event ids, and they
# lose them SILENTLY -- the failure is duplicate suppression quietly not
# working, not an error anyone sees.
python3 scripts/bundle_artifact.py \
  --also "packages/m0-core/libm0core.$ext" bin/m0serve "$out" || exit 1
cp LICENSE "$out/LICENSE.mojo-http.txt" || exit 1
cp licenses/LICENSE.lightbug_http.txt "$out/LICENSE.lightbug_http.txt" || exit 1
cp licenses/LICENSE.mojo-runtime.txt "$out/LICENSE.mojo-runtime.txt" || exit 1
cp licenses/NOTICE.m0serve.txt "$out/NOTICE.txt" || exit 1
python3 scripts/ffi_portability_check.py --require-self-contained \
  "$out/m0serve" || exit 1
echo "bundle ready: $out"
"""

[tool.poe.tasks.build-serve-native]
help = "Build bin/m0serve-native for THIS machine's CPU and OS: the desktop-Mac flavor, never the wheel"
shell = """
mkdir -p bin
# The other side of build-serve's trade-off. The wheel pins --target-cpu to
# the OLDEST CPU each platform must support and the deployment floor to
# 13.0, so one artifact runs on every Mac -- which is exactly what forfeits
# the M-series-specific codegen (docs/notes/desktop-mac-server.md). This
# task passes neither: `mojo build` then targets the BUILD HOST (on an M4,
# apple-m4 with +sme/+sme2) and inherits the host SDK as its floor. The
# result runs where it was built and on nothing older, which is what a
# server on a Mac mini or Studio someone already owns wants. pip cannot
# select a microarchitecture, so this is a local build or a release
# tarball, never a second wheel. `--doctor` tells the two apart:
# `build.apple_target` is m1 for the wheel on every Mac, and the host's
# generation here (smoke-apple-silicon asserts both).
mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-postgres/ -I packages/m0-wsgi/ -I packages/m0-wsgi/mount/ \
  packages/m0-wsgi/m0serve.mojo -o bin/m0serve-native || exit 1
python3 scripts/relocate.py --no-id \
  --rpath '@loader_path' --rpath '@loader_path/../_lib' bin/m0serve-native || exit 1
echo "built bin/m0serve-native (host CPU, host floor)"
"""

[tool.poe.tasks.check-serve-portable]
help = "Assert bin/m0serve does not depend on the machine that built it"
shell = """
bin=${SERVE_BIN:-bin/m0serve}
[ -f "$bin" ] || { echo "check-serve-portable: $bin not built - run: poe build-serve"; exit 2; }
python3 scripts/ffi_portability_check.py "$bin"
"""

# ---------------------------------------------------------------------------
# The PyPI wheel. Built from packaging/m0serve/, which is a separate project
# with its own [build-system] -- see the comment at the top of its pyproject.
# ---------------------------------------------------------------------------

[tool.poe.tasks.stage-wheel]
help = "Stage the binary, the Mojo runtime and the licences into packaging/m0serve"
deps = ["build-serve", "build-ffi"]
shell = """
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
pkg=packaging/m0serve/src/m0serve
rm -rf "$pkg/_bin" "$pkg/_lib" "$pkg/licenses" packaging/m0serve/licenses

# _bin/ and _lib/ siblings, so the binary searches @loader_path/../_lib -- a
# relative path with no Python version in it, which is what lets ONE wheel
# per platform serve 3.10 through 3.14 rather than one per version.
python3 scripts/bundle_artifact.py --layout wheel \
  --also "packages/m0-core/libm0core.$ext" bin/m0serve "$pkg" || exit 1

# Licences twice, deliberately. PEP 639 license-files puts the canonical copy
# in .dist-info/licenses/ where pip and downstream packagers look; the copy
# beside the binary travels with the directory that has to be moved as a unit
# (the @loader_path neighbourhood). smoke-wheel asserts the two are identical
# so they cannot drift.
for d in "$pkg/licenses" packaging/m0serve/licenses; do
  mkdir -p "$d" || exit 1
  cp LICENSE "$d/LICENSE.mojo-http.txt" || exit 1
  cp licenses/LICENSE.lightbug_http.txt "$d/" || exit 1
  cp licenses/LICENSE.mojo-runtime.txt "$d/" || exit 1
  cp licenses/NOTICE.m0serve.txt "$d/NOTICE.txt" || exit 1
done

python3 scripts/ffi_portability_check.py --require-self-contained \
  "$pkg/_bin/m0serve" || exit 1
echo "staged $pkg"
"""

[tool.poe.tasks.build-wheel]
help = "Build the PyPI wheel, with the platform tag measured from the binaries"
deps = ["stage-wheel"]
shell = """
tag=$(python3 scripts/wheel_tag.py packaging/m0serve/src/m0serve) || exit 1
echo "measured platform tag: $tag"
rm -rf dist/wheels
M0SERVE_WHEEL_TAG="$tag" uv build packaging/m0serve --wheel --out-dir dist/wheels || exit 1
ls -1 dist/wheels/
"""

# The repo-side half of the wheel proof, and its docstring says so on purpose:
# a poe task runs inside the repo, where .venv/.../modular/lib is on disk --
# the very directory a stale rpath would name. It therefore CANNOT establish
# portability. What it can do is check every property that is visible from
# here, and run the artifact from outside the tree with the environment
# scrubbed. The other half is the clean consumer jobs in release.yml.
[tool.poe.tasks.smoke-wheel]
help = "Build the wheel, install it outside this tree, and serve a real app from it"
deps = ["build-wheel"]
shell = """
set -u
fail() { echo "smoke-wheel: $1" >&2; exit 1; }
work=$(mktemp -d)
# The server pid joins the trap as soon as it exists. It used to be killed
# only on the success path, so every `fail` after the launch left a server
# running -- and the launch itself leaked one every time (see step 6).
srv=""
cleanup() { [ -n "$srv" ] && kill "$srv" 2>/dev/null; rm -rf "$work"; }
trap cleanup EXIT

# The port must be free BEFORE the run, because the server sets SO_REUSEPORT
# (prefork needs it) so the kernel adds this listener ALONGSIDE any stale one
# and load-balances between them. A leaked server from an earlier run can
# then answer this smoke's request and the assertions pass against a binary
# that is not the one under test. Not hypothetical: nine of them accumulated
# over a day of development, and one was still answering 200 OK a day later.
if command -v lsof >/dev/null 2>&1; then
  stale=$(lsof -nP -iTCP:8129 -sTCP:LISTEN -t 2>/dev/null | tr '\n' ' ')
  [ -z "$stale" ] || fail "port 8129 already has a listener (pids: $stale) -- SO_REUSEPORT means this run could be answered by the wrong binary. Clear them: kill $stale"
fi

whl=$(ls dist/wheels/*.whl 2>/dev/null | head -1)
[ -n "$whl" ] || fail "no wheel was built"
[ "$(ls dist/wheels/*.whl | wc -l | tr -d ' ')" = "1" ] || fail "more than one wheel in dist/wheels"

# 1. The tag. `-none-any` would mean the binary is missing or the hook did not
#    run; a cp3xx/abi3 tag would mean something decided we link libpython.
base=$(basename "$whl")
case "$base" in
  *-py3-none-macosx_*_arm64.whl|*-py3-none-manylinux_*_x86_64.whl|*-py3-none-manylinux_*_aarch64.whl) ;;
  *-py3-none-any.whl) fail "wheel is tagged py3-none-any: the binary did not make it in" ;;
  *) fail "unexpected wheel tag: $base" ;;
esac

# 2. The macOS floor must not be a promise the binary cannot keep. This is the
#    guard for LC_BUILD_VERSION: a Mojo binary inherits the build host's SDK,
#    so a tag copied from the toolchain rather than measured would install on
#    an older macOS and then fail in dyld.
if [ "$(uname)" = "Darwin" ]; then
  minos=$(otool -l packaging/m0serve/src/m0serve/_bin/m0serve \
    | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
  [ -n "$minos" ] || fail "could not read LC_BUILD_VERSION from the staged binary"
  python3 - "$base" "$minos" <<'PY' || fail "the wheel promises a macOS it cannot keep"
import re, sys
base, minos = sys.argv[1], sys.argv[2]
m = re.search(r"-macosx_([0-9]+)_([0-9]+)_", base)
if not m:
    sys.exit("could not read the macOS floor from the wheel name")
tagged = (int(m.group(1)), int(m.group(2)))
required = tuple(int(x) for x in minos.split("."))
if tagged < required:
    sys.exit(f"wheel is tagged macOS {tagged} but the binary requires {required}")
print(f"macOS floor OK: tagged {tagged}, binary requires {required}")
PY
fi

# 3. Contents: the payload, and the exec bit, which is lost silently.
python3 - "$whl" <<'PY' || fail "wheel contents check failed"
import sys, zipfile
z = zipfile.ZipFile(sys.argv[1])
names = z.namelist()
exe = [n for n in names if n.endswith("m0serve/_bin/m0serve")]
assert exe, f"no _bin/m0serve in the wheel: {names}"
mode = (z.getinfo(exe[0]).external_attr >> 16) & 0o777
assert mode & 0o111, f"_bin/m0serve is not executable in the archive (mode {mode:o})"
assert any(n.endswith("_lib/libm0core.dylib") or n.endswith("_lib/libm0core.so")
           for n in names), "libm0core is not in the wheel"
assert any("dist-info/RECORD" in n for n in names), "no RECORD"
for want in ("NOTICE.txt", "LICENSE.lightbug_http.txt", "LICENSE.mojo-runtime.txt",
             "LICENSE.mojo-http.txt"):
    assert any(n.endswith("m0serve/licenses/" + want) for n in names), f"missing {want}"
    assert any("dist-info/licenses/" in n and n.endswith(want) for n in names), \
        f"missing {want} from dist-info/licenses"
    a = z.read([n for n in names if n.endswith("m0serve/licenses/" + want)][0])
    b = z.read([n for n in names if "dist-info/licenses/" in n and n.endswith(want)][0])
    assert a == b, f"{want} differs between the package copy and dist-info"
print("wheel contents OK")
PY

# 4. Install OUTSIDE the tree, on a different Python minor than the repo pins,
#    so a wheel that accidentally depends on the build interpreter fails here.
py=3.12; [ "${M0_WHEEL_PY:-}" != "" ] && py=$M0_WHEEL_PY
uv venv "$work/venv" --python "$py" >/dev/null 2>&1 || uv venv "$work/venv" >/dev/null 2>&1 \
  || fail "could not create a test venv"
"$work/venv/bin/python" -m ensurepip >/dev/null 2>&1 || true
uv pip install --python "$work/venv/bin/python" --quiet "$whl" flask \
  || fail "the wheel would not install"

# 5. Run it with the environment scrubbed and from another directory. This is
#    what would catch a binary still leaning on DYLD_LIBRARY_PATH or on the
#    venv that built it.
ver=$(cd "$work" && env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
  -u LD_LIBRARY_PATH -u MOJO_PYTHON_LIBRARY -u VIRTUAL_ENV \
  "$work/venv/bin/m0serve" --version 2>&1) || fail "installed m0serve would not run: $ver"
want=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
[ "$ver" = "m0serve $want" ] || fail "version mismatch: got '$ver', pyproject says '$want'"

# 6. Serve a real application through the installed wheel, which is the only
#    assertion that proves the embedded interpreter reaches the INSTALL venv's
#    site-packages rather than some other Python's.
mkdir -p "$work/app"
cat > "$work/app/wheelapp.py" <<'PY'
def application(environ, start_response):
    start_response("200 OK", [("Content-Type", "text/plain")])
    return [b"served from the wheel"]
PY
# `exec`, so the subshell BECOMES the server and $! is the server's own pid.
# Without it, `cd ... && env ...` is a list that bash cannot exec-optimize, so
# $! was the SUBSHELL: `kill $pid` killed the wrapper and left m0serve
# orphaned to init. That is exactly how the stale listeners were made.
# bench_mixed_workload.sh already does it this way.
(cd "$work/app" && exec env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
  -u LD_LIBRARY_PATH -u MOJO_PYTHON_LIBRARY -u VIRTUAL_ENV \
  "$work/venv/bin/m0serve" wheelapp:application --port 8129 > "$work/wheel.log" 2>&1) &
pid=$!
srv=$pid
curl --retry 25 --retry-delay 1 --retry-all-errors --silent --fail \
  http://127.0.0.1:8129/ > "$work/body" || { cat "$work/wheel.log"; kill $pid 2>/dev/null; fail 'never became healthy'; }
grep -q 'served from the wheel' "$work/body" || { kill $pid 2>/dev/null; fail 'wrong body'; }
kill $pid 2>/dev/null; wait $pid 2>/dev/null; srv=""

# 7. Removal sabotage, permanent. If the binary still starts once its runtime
#    is gone, it is resolving it from somewhere else -- the build venv -- and
#    the bundle is a placebo. This is the blind spot, checked from the machine
#    where it hides.
# Both platforms: the m0serve EXECUTABLE links the Mojo runtime dynamically
# on Linux too, which is not true of libm0core.so and was assumed away until
# CI refused to bundle it. So the sabotage is meaningful on both.
site=$("$work/venv/bin/python" -c 'import m0serve,os;print(os.path.dirname(m0serve.__file__))')
mv "$site/_lib" "$work/_lib_moved" || fail "could not move _lib"
if (cd "$work" && env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
    -u LD_LIBRARY_PATH "$work/venv/bin/m0serve" --version >/dev/null 2>&1); then
  mv "$work/_lib_moved" "$site/_lib"
  fail "m0serve still ran with its bundled runtime removed - it is resolving it elsewhere, so the bundle proves nothing"
fi
mv "$work/_lib_moved" "$site/_lib" || fail "could not restore _lib"

# The listener ships in the wheel, and an absent libpq must be a REFUSAL
# rather than a server that runs with no listener. It used to be the
# latter -- one log line and then serving forever, which is an absent
# library degrading into a listener that silently hears nothing, and the
# one failure this flag exists to make impossible. Asserted on the WHEEL's
# binary because that is the artifact whose users have no toolchain and no
# libpq: 78 is sysexits' EX_CONFIG, and the message must name what was
# tried so an operator can see where it looked.
#
# No database and no libpq needed, which is why it belongs here rather than
# in the postgres job: M0_LIBPQ names a path that cannot exist.
out=$(cd "$work" && env M0_LIBPQ=/nonexistent/libpq.so.5 "$work/venv/bin/m0serve" \
  --realtime --pg-listen 'postgres:///x' nosuchmodule:application 2>&1)
rc=$?
[ "$rc" = "78" ] \
  || { echo "$out"; fail "--pg-listen with no libpq exited $rc, want 78"; }
case "$out" in
  *"/nonexistent/libpq.so.5"*) ;;
  *) echo "$out"; fail 'the refusal does not name the path it tried' ;;
esac
case "$out" in
  *M0_LIBPQ*) ;;
  *) echo "$out"; fail 'the refusal does not say how to point it at a library' ;;
esac

echo "smoke-wheel OK ($base)"
python3 scripts/emit.py --covers M7 --task smoke-wheel
python3 scripts/emit.py --covers M8 --task smoke-wheel
python3 scripts/emit.py --covers I22 --task smoke-wheel
"""


# `docker stop` is SIGTERM to PID 1 and nothing else, and PID 1 gets no
# default signal dispositions from the kernel: with no handler installed the
# signal is DISCARDED, not fatal. This server installs its handlers post-fork
# by design, so every in-process SIGTERM gate (smoke-shutdown first among
# them) proves the handler works once installed while proving nothing about
# the one environment where the default disposition cannot paper over a
# missing install. scripts/pid1_probe.py runs the wheel exec'd as PID 1 in
# python:3.12-slim and `docker stop`s it, alone and as a supervisor reaping
# two workers; the sabotaged shape is SIGKILL at the deadline, exit 137.
# Needs docker, so CI runs it in its own Linux job (the smoke matrix's macOS
# runners have none, and a step-level `if:` would make the citing spec row
# unverifiable).
[tool.poe.tasks.smoke-pid1]
help = "docker stop on m0serve as PID 1: the drain's exit 0, never SIGKILL at the deadline"
deps = ["build-wheel"]
shell = """
python3 scripts/pid1_probe.py || exit 1
python3 scripts/emit.py --covers M11 --task smoke-pid1
"""


# The quickstart is executable on purpose: scripts/run_quickstart.py extracts
# QUICKSTART.md's tagged fences and runs them, so the doc a stranger follows
# is pinned by CI rather than trusted to stay true. Runs against the TREE's
# wheel (M0SERVE_WHEEL), because a pull request must prove this tree and must
# not depend on what is currently published. --expect pins the doc's shape:
# editing the quickstart's structure means updating it here, loudly.
[tool.poe.tasks.smoke-quickstart]
help = "Execute QUICKSTART.md, then docs/QUICKSTART_NEXT.md, against the tree's own wheel"
deps = ["build-wheel"]
shell = """
whl=$(ls dist/wheels/*.whl | head -1)
[ -n "$whl" ] || { echo "smoke-quickstart: no wheel built"; exit 2; }
M0SERVE_WHEEL="$whl" python3 scripts/run_quickstart.py \
  --doc QUICKSTART.md --doc docs/QUICKSTART_NEXT.md \
  --expect setup=5,serve=5,verify=5 || exit 1
python3 scripts/emit.py --covers M10 --task smoke-quickstart
python3 scripts/emit.py --covers K11 --task smoke-quickstart
python3 scripts/emit.py --covers M16 --task smoke-quickstart
"""
[tool.poe.tasks.smoke-ffi]
help = "Load the C-ABI shared library via ctypes and assert known vectors"
deps = ["build-ffi"]
shell = """
ext=so; [ "$(uname)" = "Darwin" ] && ext=dylib
# Built by the `build-ffi` dependency above, NOT here. This task used to run
# its own `mojo build`, which silently overwrote build-ffi's output -- so the
# artifact this smoke tested was never the artifact build-ffi produced, and
# the post-link fixups were undone before the smoke ever saw them.
#
# The Mojo runtime is supplied explicitly rather than through a search path
# baked into the library, which is the whole point of the fixups: the
# artifact now looks beside itself, so a consumer (and this smoke) has to say
# where the runtime is. That is the documented requirement, exercised here.
modlib=$(ls -d .venv/lib/python*/site-packages/modular/lib 2>/dev/null | head -1)
export DYLD_LIBRARY_PATH="$modlib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
export LD_LIBRARY_PATH="$modlib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
python3 - "packages/m0-core/libm0core.$ext" <<'PYEOF'
import ctypes, sys

lib = ctypes.CDLL(sys.argv[1])
u32, buf_t = ctypes.c_uint32, ctypes.c_char_p
lib.m0_fnv1a.restype = u32
lib.m0_fnv1a.argtypes = [buf_t, u32]
lib.m0_xxhash32.restype = u32
lib.m0_xxhash32.argtypes = [buf_t, u32, u32]
lib.m0_format_hash.restype = u32
lib.m0_format_hash.argtypes = [u32, ctypes.c_char_p, u32]

# FNV-1a and xxHash32 public vectors, the same ones test_hashing.mojo pins.
assert lib.m0_fnv1a(b"a", 1) == 0xE40C292C, "fnv1a('a')"
assert lib.m0_fnv1a(b"foobar", 6) == 0xBF9CF968, "fnv1a('foobar')"
assert lib.m0_xxhash32(b"", 0, 0) == 0x02CC5D05, "xxhash32('')"
h0 = lib.m0_xxhash32(b"hello world", 11, 0)
h7 = lib.m0_xxhash32(b"hello world", 11, 7)
assert h0 != h7, "seed had no effect"

out = ctypes.create_string_buffer(8)
n = lib.m0_format_hash(0xBF9CF968, out, 8)
assert n == 8 and out.raw == b"bf9cf968", f"format_hash wrote {n}: {out.raw}"
assert lib.m0_format_hash(1, out, 4) == 0, "short buffer must write nothing"

# m0_shared_fetch_add is the export apps/django_realtime's m0pub.py calls to
# number the events it publishes: the ONE thing Python cannot do for itself,
# because there is no atomic read-modify-write over a raw address anywhere in
# the stdlib. This is that exact call path -- ctypes, a bare address, an
# Int64 -- against a local cell rather than the server's MAP_SHARED page.
lib.m0_shared_fetch_add.restype = ctypes.c_int64
lib.m0_shared_fetch_add.argtypes = [ctypes.c_uint64, ctypes.c_int64]
cell = ctypes.c_int64(0)
addr = ctypes.addressof(cell)
seen = [lib.m0_shared_fetch_add(addr, 1) for _ in range(3)]
assert seen == [0, 1, 2], f"fetch_add returned {seen}, want the previous values"
assert cell.value == 3, f"cell is {cell.value}, want 3"
assert lib.m0_shared_fetch_add(0, 1) == 0, "a null address must answer 0, not crash"
print("ctypes round trip OK")
PYEOF
[ $? = 0 ] || exit 1
echo "smoke-ffi OK"
python3 scripts/emit.py --covers M9 --task smoke-ffi
"""

# Two claims, each with its own server run off one compiled binary. First:
# a mutation on one connection reaches another client's open SSE stream as a
# single patch-elements frame carrying the rendered fragment. Second: the
# list is rows in SQLite, so a killed and restarted server comes back with
# the same list — the claim the in-memory version could not make. (The
# browser half — Datastar actually morphing the DOM in a second tab — was
# verified with Playwright when the attribute syntax was pinned; see
# apps/datastar_todo/page.mojo.)
[tool.poe.tasks.browser-datastar-form]
help = "PRE-RELEASE: the Datastar form arm driven by Chromium — the form posts its fields, a field posts the store, the other tab morphs (SPEC N12; not in CI)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ \
  -I packages/m0-sqlite/ -I apps/ -Xlinker -lsqlite3 \
  apps/datastar_todo/server.mojo -o "$out/todo" || exit 1
# playwright is not a dependency of this project; `--with` borrows it for
# one process, and the Chromium it drives comes from the ms-playwright
# cache (`uv run --no-project --with playwright playwright install chromium`
# once, if this says the browser is missing).
uv run --no-project --with playwright python3 scripts/datastar_form_check.py --bin "$out/todo"
"""

# The delete button's request is the one thing about this app that curl
# cannot judge: htmx 2.0.4 would put a DELETE's fields in the query string,
# and the app's `htmx-config` meta narrows that so the CSRF token stays in
# the body. Serving the meta and refusing a query-string token is all the
# wire can say; whether the bundle HONOURED it needs a bundle.
[tool.poe.tasks.browser-notes-login]
help = "PRE-RELEASE: the notes login driven by Chromium — sign in, write with the token in the body, delete, sign out (SPEC N13; not in CI)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-core/ -I packages/m0-http/ \
  apps/fragment_notes/server.mojo -o "$out/notes" || exit 1
# playwright is not a dependency of this project; `--with` borrows it for
# one process, and the Chromium it drives comes from the ms-playwright
# cache (`uv run --no-project --with playwright playwright install chromium`
# once, if this says the browser is missing).
uv run --no-project --with playwright python3 scripts/notes_login_browser.py --bin "$out/notes"
"""

[tool.poe.tasks.smoke-todo]
help = "Todo demo: assert a broadcast patches a live client, the list survives a restart, and Last-Event-ID replays across it"
shell = """
out=$(mktemp -d)
trap 'kill $pid 2>/dev/null; rm -rf "$out"' EXIT
mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ \
  -I packages/m0-sqlite/ -I apps/ -Xlinker -lsqlite3 \
  apps/datastar_todo/server.mojo -o "$out/todo" || exit 1

M0_DB="$out/todos.db" "$out/todo" > todo.log 2>&1 &
pid=$!
curl --retry 20 --retry-delay 3 --retry-all-errors --silent --fail http://localhost:8080/health \
  || { echo '=== todo.log ==='; cat todo.log; exit 1; }
curl -sN --max-time 6 -H 'Accept: text/event-stream' http://localhost:8080/events > todo_sse.txt &
sse=$!
sleep 2
curl -s -X POST http://localhost:8080/add -d '{"draft":"buy milk"}' -o /dev/null
curl -s -X POST http://localhost:8080/toggle/1 -o /dev/null
# The rename form (SPEC N12): what Datastar sends for {contentType: 'form'}
# is the form's fields urlencoded, which form(req) reads; a JSON signal
# store posted to the same route is refused rather than read as a field.
curl -s -X POST http://localhost:8080/add -d '{"draft":"walk dog"}' -o /dev/null
curl -s -X POST http://localhost:8080/edit/2 -H 'Content-Type: application/x-www-form-urlencoded' -d 'text=walk+the+dog' -o /dev/null
code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/edit/2 -H 'Content-Type: application/json' -d '{"text":"nope"}')
[ "$code" = 400 ] || { echo "a JSON body posted to the rename route answered $code, not 400"; exit 1; }
sleep 2
kill $sse 2>/dev/null
grep -q 'event: datastar-patch-elements' todo_sse.txt \
  || { echo 'no patch-elements frame reached the client'; cat todo_sse.txt; exit 1; }
grep -q 'data: elements <section id="todos">' todo_sse.txt \
  || { echo 'broadcast did not carry the todos fragment'; cat todo_sse.txt; exit 1; }
grep -q 'buy milk' todo_sse.txt \
  || { echo 'broadcast did not carry the new todo'; cat todo_sse.txt; exit 1; }
grep -q '<s>buy milk</s>' todo_sse.txt \
  || { echo 'toggle broadcast did not strike the todo through'; cat todo_sse.txt; exit 1; }
grep -q 'data: event:' todo_sse.txt && { echo 'frame was double-framed'; exit 1; }
grep -q 'value="walk the dog"' todo_sse.txt \
  || { echo 'the rename posted as a form did not reach the broadcast'; cat todo_sse.txt; exit 1; }
grep -q 'nope' todo_sse.txt && { echo 'the refused JSON body was applied anyway'; exit 1; }
curl -s http://localhost:8080/ > todo_page.txt
grep -q '<s>buy milk</s>' todo_page.txt \
  || { echo 'a fresh page load did not render current server state'; exit 1; }
# The form arm's wire spelling, as the page serves it: the submit action
# with the form content type, generated by Fragment[Datastar] from the
# route pattern, and the field the handler reads.
grep -q 'data-on:submit__prevent="@post(&#x27;/edit/2&#x27;, {contentType: &#x27;form&#x27;})"' todo_page.txt \
  || { echo 'the page does not carry the Datastar form arm for the rename'; grep -o '<form[^>]*>' todo_page.txt; exit 1; }
grep -q 'name="text" value="walk the dog"' todo_page.txt \
  || { echo 'the rename form does not carry the current text'; exit 1; }
rm -f todo_page.txt

# The persistence claim: kill the server, start it again on the same M0_DB,
# and the struck-through todo must still be there.
kill $pid 2>/dev/null
wait $pid 2>/dev/null
M0_DB="$out/todos.db" "$out/todo" > todo.log 2>&1 &
pid=$!
curl --retry 20 --retry-delay 3 --retry-all-errors --silent --fail http://localhost:8080/health \
  || { echo '=== todo.log (restart) ==='; cat todo.log; exit 1; }
curl -s http://localhost:8080/ | grep -q '<s>buy milk</s>' \
  || { echo 'the list did not survive the restart'; curl -s http://localhost:8080/; exit 1; }

# The replay claim: a client reconnecting with the id it saw last is caught
# up by the *restarted* process from the persisted event log — the toggle
# frame (id 2) replays, the add frame (id 1) it already has does not, and no
# new mutation is needed to cause any of it.
curl -sN --max-time 4 -H 'Accept: text/event-stream' -H 'Last-Event-ID: 1' \
  http://localhost:8080/events > todo_replay.txt || true
grep -q 'id: 2' todo_replay.txt \
  || { echo 'reconnect did not replay the missed frame after restart'; cat todo_replay.txt; exit 1; }
grep -q '<s>buy milk</s>' todo_replay.txt \
  || { echo 'the replayed frame did not carry the struck-through todo'; cat todo_replay.txt; exit 1; }
grep -q 'id: 1$' todo_replay.txt \
  && { echo 'replay redelivered a frame the client already had'; cat todo_replay.txt; exit 1; }
# A consumer with no Last-Event-ID is new, and gets no history.
curl -sN --max-time 4 -H 'Accept: text/event-stream' http://localhost:8080/events > todo_fresh.txt || true
grep -q 'datastar-patch-elements' todo_fresh.txt \
  && { echo 'a new consumer was served history it never asked for'; cat todo_fresh.txt; exit 1; }

rm -f todo_sse.txt todo_replay.txt todo_fresh.txt todo.log
echo "smoke-todo OK"
python3 scripts/emit.py --covers I10 --task smoke-todo
python3 scripts/emit.py --covers N12 --task smoke-todo
python3 scripts/emit.py --covers O5 --task smoke-todo
"""

# Each assertion pins one framework feature the notes API exists to showcase:
# routing with :id and a real 405, negotiation, ETag/304, problem+json, CORS,
# and M0_PORT via AppConfig (the smoke runs the whole thing on :8091).
[tool.poe.tasks.smoke-sendfile]
help = "Serve a file larger than every buffer without holding it in memory"
deps = ["build-serve"]
shell = """
set -u
srv=bin/m0serve
B=http://localhost:8140
dir=$(mktemp -d)
fail() { echo "FAIL: $1"; echo '=== sendfile.log ==='; cat sendfile.log 2>/dev/null; kill $pid 2>/dev/null; rm -rf "$dir"; exit 1; }

# 64 MB: far past the socket buffer, the 4KB staging read, and the
# encode buffer. A path that read the file into memory to serve it would
# show this in RSS; sendfile never brings it into the process at all.
dd if=/dev/urandom of="$dir/big.bin" bs=1048576 count=64 2>/dev/null
want=$(md5sum < "$dir/big.bin" | cut -d' ' -f1)
printf 'hello static' > "$dir/small.txt"

"$srv" bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8140 \
  --static /assets/="$dir" > sendfile.log 2>&1 &
pid=$!
curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/ > /dev/null \
  || fail 'server never became healthy'

rss_before=$(ps -o rss= -p $pid | tr -d ' ')

# Byte-exact delivery of the whole file, three times over.
for i in 1 2 3; do
  got=$(curl -s --max-time 120 $B/assets/big.bin | md5sum | cut -d' ' -f1)
  [ "$got" = "$want" ] || fail "64MB body differed on pass $i (want $want, got $got)"
done

rss_after=$(ps -o rss= -p $pid | tr -d ' ')
growth=$((rss_after - rss_before))
echo "sendfile: RSS ${rss_before}KB -> ${rss_after}KB (grew ${growth}KB) after 3x64MB"
python3 scripts/emit.py sendfile.rss_growth_kb "$growth" --unit KB --limit 16384 --task smoke-sendfile

# The actual claim. Reading each file into memory would add ~65536KB per
# concurrent response; 16MB of headroom catches that with room to spare
# while tolerating allocator noise.
[ "$growth" -lt 16384 ] || fail "RSS grew ${growth}KB serving 64MB files - the body is being buffered"

# Range: served by giving sendfile an offset, so this reads mid-file.
code=$(curl -s -o part.bin -w '%{http_code}' -H 'Range: bytes=1048576-1048583' $B/assets/big.bin)
[ "$code" = "206" ] || fail "range expected 206, got $code"
[ "$(wc -c < part.bin | tr -d ' ')" = "8" ] || fail 'range served the wrong length'
want_part=$(dd if="$dir/big.bin" bs=1 skip=1048576 count=8 2>/dev/null | md5sum | cut -d' ' -f1)
got_part=$(md5sum < part.bin | cut -d' ' -f1)
[ "$want_part" = "$got_part" ] || fail 'range served the wrong bytes'

# HEAD: the headers a GET would send, and no body at all.
curl -s -I --max-time 20 $B/assets/big.bin > head.txt
grep -qi '^content-length: 67108864' head.txt || fail 'HEAD lost the real Content-Length'
n=$(curl -s -o - -I --max-time 20 $B/assets/big.bin | wc -c | tr -d ' ')
[ "$n" -lt 4096 ] || fail 'HEAD sent a body'

# The validator is now derived from stat, and must still round-trip.
etag=$(grep -i '^etag:' head.txt | tr -d '\r' | cut -d' ' -f2-)
[ -n "$etag" ] || fail 'no ETag on a sendfile response'
code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" $B/assets/small.txt)
# small.txt has its own ETag; a mismatched one must NOT 304.
[ "$code" = "200" ] || fail "another file's ETag produced $code, want 200"
code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" $B/assets/big.bin)
[ "$code" = "304" ] || fail "the file's own ETag produced $code, want 304"

kill $pid 2>/dev/null; wait $pid 2>/dev/null
rm -rf "$dir" part.bin head.txt sendfile.log
echo "smoke-sendfile OK"
python3 scripts/emit.py --covers J1 --task smoke-sendfile
"""

[tool.poe.tasks.smoke-notes]
help = "Start the notes API, assert each framework feature end to end (incl. static files), stop"
shell = """
M0_PORT=8091 mojo run -I packages/m0-core/ -I packages/m0-http/ apps/notes_api/server.mojo > notes.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null' EXIT

fail() { echo "$1"; echo '=== notes.log ==='; cat notes.log; exit 1; }

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail http://localhost:8091/health \
  | grep -q '"status":"ok"' || fail 'health check did not answer'

# M0_PORT reached AppConfig: the server is on 8091, not the 8080 default.

# Create: 201, a Location header, and the note echoed back.
code=$(curl -s -o note1.json -w '%{http_code}' -D headers.txt \
  -X POST http://localhost:8091/notes -d '{"title":"First","body":"hello"}')
[ "$code" = "201" ] || fail "expected 201 from create, got $code"
grep -qi '^location: /notes/1' headers.txt || fail 'create did not answer a Location header'
grep -q '"title":"First"' note1.json || fail 'created note did not echo its title'

# The :id route, and an ETag on the JSON representation.
curl -s -D headers.txt http://localhost:8091/notes/1 -o /dev/null
etag=$(grep -i '^etag:' headers.txt | cut -d' ' -f2 | tr -d '\\r\\n')
[ -n "$etag" ] || fail 'GET /notes/:id answered no ETag'

# 304: same resource, If-None-Match, no body.
code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" http://localhost:8091/notes/1)
[ "$code" = "304" ] || fail "expected 304 for a matching If-None-Match, got $code"

# Content negotiation: same note, HTML representation on request — and the
# response says it varies, so a shared cache cannot replay HTML to a JSON
# client.
curl -s -H 'Accept: text/html' http://localhost:8091/notes/1 \
  | grep -q '<h1>First</h1>' || fail 'Accept: text/html did not negotiate HTML'
curl -s -D headers.txt http://localhost:8091/notes/1 -o /dev/null
grep -qi '^vary: Accept' headers.txt || fail 'negotiated response carried no Vary'
# A plain curl (Accept: */*) still gets JSON, never HTML.
curl -s http://localhost:8091/notes \
  | grep -q '^\\[{"id":1' || fail 'the list was not JSON for Accept: */*'

# Errors are RFC 9457 problem+json, with the right content type.
curl -s -D headers.txt http://localhost:8091/notes/999 -o problem.json
grep -qi '^content-type: application/problem+json' headers.txt \
  || fail 'a 404 was not problem+json'
grep -q '"status":404' problem.json || fail 'the problem body did not carry the status'

# The router distinguishes 405 from 404, and says what IS allowed.
code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt -X PATCH http://localhost:8091/notes/1)
[ "$code" = "405" ] || fail "expected 405 for PATCH on a GET/PUT/DELETE route, got $code"
grep -qi '^allow: GET, PUT, DELETE, OPTIONS' headers.txt || fail '405 carried no Allow header'
# And a method the route does not take must not reach any view: the
# handler-id dispatch chain this app used to carry ended in a bare
# `return self._delete(...)`, so a route registered without its own arm
# deleted the note instead of answering. The note must still be there.
code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8091/notes/1)
[ "$code" = "200" ] || fail "a 405 must leave the note intact, but GET answered $code"

# CORS: preflight and ordinary responses both carry the headers.
curl -s -D headers.txt -X OPTIONS http://localhost:8091/notes -o /dev/null
grep -qi '^access-control-allow-origin' headers.txt || fail 'preflight carried no CORS headers'

# Validation: a body without a title is a 400 problem, not a 500.
code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8091/notes -d '{"nope":1}')
[ "$code" = "400" ] || fail "expected 400 for a note without a title, got $code"

# Update and delete round out the CRUD.
curl -s -X PUT http://localhost:8091/notes/1 -d '{"title":"Renamed","body":"x"}' \
  | grep -q '"title":"Renamed"' || fail 'PUT did not update the note'
code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8091/notes/1)
[ "$code" = "204" ] || fail "expected 204 from delete, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8091/notes/1)
[ "$code" = "404" ] || fail "expected 404 after delete, got $code"

# Static files: a real type, an ETag, a 304 on revalidation — and, the part
# that matters, traversal probes answering 404 with no source code in them.
curl -s -D headers.txt http://localhost:8091/static/styles.css -o static.css
grep -q 'font-family' static.css || fail 'static css did not serve'
grep -qi '^content-type: text/css' headers.txt || fail 'static css had the wrong content type'
setag=$(grep -i '^etag:' headers.txt | cut -d' ' -f2 | tr -d '\r\n')
[ -n "$setag" ] || fail 'static file served without an ETag'
code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $setag" http://localhost:8091/static/styles.css)
[ "$code" = "304" ] || fail "static revalidation expected 304, got $code"

# Byte ranges: a bounded range comes back 206 with the right slice and a
# Content-Range naming the total; a range past the end is 416 with */total.
total=$(wc -c < static.css | tr -d ' ')
code=$(curl -s -o part.bin -w '%{http_code}' -D headers.txt -r 0-3 http://localhost:8091/static/styles.css)
[ "$code" = "206" ] || fail "range request expected 206, got $code"
[ "$(wc -c < part.bin | tr -d ' ')" = "4" ] || fail 'range served the wrong number of bytes'
grep -qi "^content-range: bytes 0-3/$total" headers.txt || fail 'missing or wrong Content-Range'
code=$(curl -s -o /dev/null -w '%{http_code}' -r 9999999- http://localhost:8091/static/styles.css)
[ "$code" = "416" ] || fail "unsatisfiable range expected 416, got $code"
rm -f part.bin
code=$(curl -s --path-as-is -o trav.txt -w '%{http_code}' http://localhost:8091/static/../server.mojo)
[ "$code" = "404" ] || fail "traversal probe expected 404, got $code"
grep -q 'HTTPService' trav.txt && fail 'traversal probe served source code'
code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://localhost:8091/static/%2e%2e/server.mojo)
[ "$code" = "404" ] || fail "encoded traversal probe expected 404, got $code"

# G14, the app-level sites: a byte that is not UTF-8 in the static path,
# in Accept, in If-None-Match and in Range used to trap a String slice on
# the loop thread and kill the process. Each must be answered and the
# server must still be up. Raw sockets, because curl will not send the byte.
python3 - <<'PY' || fail 'a request carrying a byte that is not UTF-8 got no answer'
import socket
def req(line, headers=b""):
    s = socket.create_connection(("127.0.0.1", 8091), timeout=5)
    s.sendall(line + b" HTTP/1.1\\r\\nHost: x\\r\\n" + headers + b"Connection: close\\r\\n\\r\\n")
    head = s.recv(4096).split(b"\\r\\n")[0]
    s.close()
    assert head.startswith(b"HTTP/1.1 "), (line, headers, head)
req(b"GET /static/\\x80%41.css")
req(b"GET /static/\\x80/x.css")
req(b"GET /static/x.\\x80")
req(b"GET /notes", b"Accept: text/html;q=\\x80, \\x80/x\\r\\n")
req(b"GET /notes/1", b"If-None-Match: \\"\\x80\\", W/\\"\\x80\\r\\n")
req(b"GET /static/styles.css", b"Range: bytes=\\x80-\\r\\n")
req(b"GET /notes", b"Cookie: a=\\x80; b=1\\r\\n")
PY
curl --silent --fail http://localhost:8091/health > /dev/null || fail 'the server was gone after a request carrying a byte that is not UTF-8'

rm -f notes.log note1.json problem.json headers.txt static.css trav.txt
echo "smoke-notes OK"
python3 scripts/emit.py --covers G10 --task smoke-notes
python3 scripts/emit.py --covers J6 --task smoke-notes
python3 scripts/emit.py --covers G14 --task smoke-notes
"""

# The notes resource as a server-rendered htmx app, gated on WIRE OUTPUT
# only, so the app can be refactored onto the framework layer one piece at
# a time under a green gate. Each assertion pins something a hand-written
# page gets wrong: a title with a multi-byte character round-tripping
# through a urlencoded form (the continuation-byte regression the todo
# demo's escaper shipped), a `<script>` title rendered inert, a checkbox
# key repeated once per tick and every value kept, one URL answering a bare
# fragment under `HX-Request: true` (or `Datastar-Request: true`) and a
# whole document without it — or WITH it beside a history restore or a
# boost — with `Vary` naming all four on every answer, a body that is not a form
# refused rather than parsed as one field named after the whole document,
# and a method the collection does not take answered 405 with a correct
# Allow.
[tool.poe.tasks.smoke-fragment-notes]
help = "Start the fragment notes app, assert its wire contract (login, sessions, CSRF, fragment vs page, Vary, forms, escaping, 405), stop"
shell = """
KEY=notes-smoke-key-0123456789abcdef
PASSWORD=hunter2-correct-horse

# Built rather than `mojo run`, because the gate runs the app TWICE: once
# to serve, and once with no key at all to prove it refuses to start.
mojo build -I packages/m0-core/ -I packages/m0-http/ apps/fragment_notes/server.mojo -o notes_app

fail() { echo "$1"; echo '=== fragment.log ==='; cat fragment.log; exit 1; }

# Fail closed. A notes app that served everyone because a deployment
# forgot a variable is worse than one that did not start, so the refusal
# is a gated claim and not a comment. EX_CONFIG (78), the code the hold
# mount refuses with.
M0_PORT=8095 ./notes_app > refusal.log 2>&1
code=$?
[ "$code" = "78" ] || fail "expected exit 78 with no M0_NOTES_KEY, got $code"
grep -q 'M0_NOTES_KEY is not set' refusal.log || fail 'the refusal did not name the missing variable'
M0_PORT=8095 M0_NOTES_KEY=$KEY ./notes_app > refusal.log 2>&1
code=$?
[ "$code" = "78" ] || fail "expected exit 78 with no M0_NOTES_PASSWORD, got $code"
grep -q 'M0_NOTES_PASSWORD is not set' refusal.log || fail 'the refusal did not name the missing password'

M0_PORT=8094 M0_NOTES_KEY=$KEY M0_NOTES_PASSWORD=$PASSWORD ./notes_app > fragment.log 2>&1 &
pid=$!
trap 'kill $pid 2>/dev/null' EXIT
B=http://localhost:8094

# Every header the fragment-or-page decision reads, in the order Vary names them.
VARY='HX-Request, HX-History-Restore-Request, HX-Boosted, Datastar-Request'

curl --retry 30 --retry-delay 2 --retry-all-errors --silent --fail $B/health \
  | grep -q '"status":"ok"' || fail 'health check did not answer'

# --- N13: nothing under /notes is readable without a session ---------------
#
# A navigation is sent to the login page; a swap gets 401 carrying the same
# form as a bare fragment, because a redirect a swap followed would put the
# login page inside the element the list was in. Both answers are chosen by
# the fragment headers, so both name them in Vary.
code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt $B/notes)
[ "$code" = "303" ] || fail "expected 303 for /notes with no session, got $code"
grep -qi '^location: /login' headers.txt || fail 'the unauthenticated redirect did not name the login page'
grep -qi "^vary: $VARY" headers.txt || fail 'the unauthenticated redirect carried no Vary naming every header read'
code=$(curl -s -o frag.html -w '%{http_code}' -D headers.txt -H 'HX-Request: true' $B/notes)
[ "$code" = "401" ] || fail "expected 401 for a swap with no session, got $code"
head -c 20 frag.html | grep -q '<section id="notes">' || fail 'the 401 did not carry the login fragment'
grep -qiE 'doctype|<html' frag.html && fail 'the 401 fragment carried document markup'
grep -q 'name="password"' frag.html || fail 'the 401 fragment carried no login form'
grep -qi "^vary: $VARY" headers.txt || fail 'the 401 carried no Vary naming every header read'
code=$(curl -s -o /dev/null -w '%{http_code}' -H 'HX-Request: true' -d 'title=x' $B/notes)
[ "$code" = "401" ] || fail "expected 401 for a write with no session, got $code"
# The other two writes, with the token field present but EMPTY: a refused
# session's own token is empty, and two empty strings compare equal, so
# this is the body a write view that forgot its session guard would take.
code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -d 'csrf=' $B/notes/1)
[ "$code" = "303" ] || fail "expected 303 for a DELETE with no session, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -d 'csrf=' $B/logout)
[ "$code" = "303" ] || fail "expected 303 for a logout with no session, got $code"
# Everything the session decided says so to a cache: the redirect and the
# 401 alike, or a shared cache hands the anonymous answer to a signed-in
# user.
curl -s -o /dev/null -D headers.txt $B/notes
grep -qi '^cache-control: no-store' headers.txt || fail 'the unauthenticated redirect was cacheable'
curl -s -o /dev/null -D headers.txt -H 'HX-Request: true' $B/notes
grep -qi '^cache-control: no-store' headers.txt || fail 'the 401 fragment was cacheable'
code=$(curl -s -o /dev/null -w '%{http_code}' $B/notes/1)
[ "$code" = "303" ] || fail "expected 303 for a note with no session, got $code"
# A detail page must not say whether the note exists: 303 before the lookup.
code=$(curl -s -o /dev/null -w '%{http_code}' $B/notes/999)
[ "$code" = "303" ] || fail "an unauthenticated request learned whether a note exists ($code)"

# The login page is the one page outside the session, and it is a document
# without the header and a fragment with it, like every other page here.
curl -s -D headers.txt $B/login -o page.html
head -c 15 page.html | grep -q '<!doctype html>' || fail 'GET /login was not a document'
grep -q 'name="user"' page.html || fail 'the login page carried no form'
grep -qi "^vary: $VARY" headers.txt || fail 'the login page carried no Vary naming every header read'

# The one library setting this app makes, and the reason the CSRF token can
# ride in the body of a DELETE: htmx 2.0.4 ships methodsThatUseUrlParams as
# ["get","delete"], which would put the token in the query string.
grep -q 'name="htmx-config" content="{&quot;methodsThatUseUrlParams&quot;:\\[&quot;get&quot;\\]}"' page.html \
  || fail 'the shell did not narrow htmx methodsThatUseUrlParams to get'

# --- N13: the login itself -------------------------------------------------
code=$(curl -s -o frag.html -w '%{http_code}' -D headers.txt -d "user=notes&password=wrong" $B/login)
[ "$code" = "401" ] || fail "expected 401 for a wrong password, got $code"
grep -qi '^set-cookie' headers.txt && fail 'a failed login set a cookie'
grep -q 'wrong user or password' frag.html || fail 'a failed login did not say so'
code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt -d "user=someone&password=$PASSWORD" $B/login)
[ "$code" = "401" ] || fail "expected 401 for a wrong user, got $code"
grep -qi '^set-cookie' headers.txt && fail 'a login as an unknown user set a cookie'

code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt -c jar.txt -d "user=notes&password=$PASSWORD" $B/login)
[ "$code" = "303" ] || fail "expected 303 from a good login, got $code"
grep -qi '^location: /notes' headers.txt || fail 'a good login did not redirect to the notes'
SETCOOKIE=$(grep -i '^set-cookie' headers.txt | head -1)
echo "$SETCOOKIE" | grep -q 'HttpOnly' || fail "the session cookie is not HttpOnly: $SETCOOKIE"
echo "$SETCOOKIE" | grep -q 'SameSite=Lax' || fail "the session cookie is not SameSite=Lax: $SETCOOKIE"
echo "$SETCOOKIE" | grep -q 'Path=/' || fail "the session cookie has no Path: $SETCOOKIE"
echo "$SETCOOKIE" | grep -q 'Max-Age=' || fail "the session cookie has no Max-Age: $SETCOOKIE"
# The format, on the wire: version, key id, expiry, subject, 43 base64url
# characters of tag. A cookie that stopped being signed would still be a
# cookie; this is what says it is a signed one.
echo "$SETCOOKIE" | grep -qE 'm0_notes_session=v1\\.[0-9a-f]{8}\\.[0-9]{10}\\.notes\\.[A-Za-z0-9_-]{43};' \
  || fail "the session cookie is not a signed token: $SETCOOKIE"

# --- N13: forgeries, each signed (or mis-signed) by CPython ----------------
#
# The verifier is never checked against itself: scripts/notes_session.py is
# the other implementation of the same format, and what it signs under the
# server's key the server must admit, while each way of getting it wrong
# must be refused by NAME. The reason travels back in the login form, which
# is what makes "refused" distinguishable from "refused for another reason".
NOW=$(python3 -c 'import time; print(int(time.time()))')
ISSUE="python3 scripts/notes_session.py"
GOOD=$($ISSUE --key $KEY --subject notes --exp $((NOW + 600)))
refusal() {
  curl -s -H 'HX-Request: true' -H "Cookie: m0_notes_session=$1" $B/notes \
    | grep -o 'signed out ([a-z ]*)'
}
[ "$(refusal "$GOOD")" = "" ] || fail 'a cookie CPython signed under the server key was refused'
curl -s -H 'HX-Request: true' -H "Cookie: m0_notes_session=$GOOD" $B/notes \
  | grep -q 'signed in as notes' || fail 'a cookie CPython signed did not name its subject'
got=$(refusal "$($ISSUE --key $KEY --subject notes --exp $((NOW - 1)))")
[ "$got" = "signed out (expired)" ] || fail "an expired cookie was not refused as expired: $got"
got=$(refusal "$($ISSUE --key other-key --subject notes --exp $((NOW + 600)))")
[ "$got" = "signed out (unknown key)" ] || fail "a cookie under another key was not refused: $got"
# The last character is replaced, never rotated: a tag's final character
# carries four bits and can be 0, 4 or 8, which a letter rotation leaves
# alone — three runs in sixteen used to present the untampered cookie.
# `${GOOD: -1}` is bash's substring expansion and poe runs these with sh,
# which is dash on the Linux runner: it answers `Bad substitution` and the
# gate exits 2 before reaching any assertion. The prefix/suffix forms below
# are POSIX and behave identically in both shells.
last=${GOOD#"${GOOD%?}"}
case "$last" in A) FLIP=B ;; *) FLIP=A ;; esac
got=$(refusal "${GOOD%?}$FLIP")
[ "$got" = "signed out (bad signature)" ] || fail "a tampered tag was not refused: $got"
got=$(refusal 'not-a-session')
[ "$got" = "signed out (malformed)" ] || fail "a malformed cookie was not refused as such: $got"
# A subject the server never issued is still a subject the server SIGNED:
# the cookie is stateless, so this must be admitted, and saying so here is
# what keeps anyone from reading the session as a lookup.
curl -s -H 'HX-Request: true' \
  -H "Cookie: m0_notes_session=$($ISSUE --key $KEY --subject someone_else --exp $((NOW + 600)))" \
  $B/notes | grep -q 'signed in as someone_else' \
  || fail 'a cookie signed for another subject was not honoured as that subject'

# --- the wire contract, now behind the session -----------------------------
#
# Everything below this line is what the app promised before it had a login,
# asserted with the cookie the login just set. None of it changed.
CSRF=$($ISSUE --key $KEY --csrf-for "$(grep m0_notes_session jar.txt | awk '{print $7}')")

# One URL, two representations. Without the header: a whole document, and
# the fragment inside it. With it: the bare fragment, no doctype, no <html>.
curl -s -b jar.txt -D headers.txt $B/notes -o page.html
grep -qi '^cache-control: no-store' headers.txt || fail 'the signed-in list, token and all, was cacheable'
head -c 15 page.html | grep -q '<!doctype html>' || fail 'GET /notes without HX-Request was not a document'
grep -q '<section id="notes">' page.html || fail 'the document did not contain the fragment'
grep -qi "^vary: $VARY" headers.txt || fail 'the document carried no Vary naming every header read'
curl -s -b jar.txt -D headers.txt -H 'HX-Request: true' $B/notes -o frag.html
head -c 20 frag.html | grep -q '<section id="notes">' || fail 'GET /notes with HX-Request did not start with the fragment'
grep -qiE 'doctype|<html' frag.html && fail 'the fragment carried document markup'
grep -qi "^vary: $VARY" headers.txt || fail 'the fragment carried no Vary naming every header read'
grep -q 'none yet' frag.html || fail 'the empty list did not say so'
# The token the browser will send back, rendered into the form by the app
# and derived from the cookie by CPython: the two must be the same string.
grep -q "value=\\"$CSRF\\"" frag.html || fail 'the rendered CSRF token is not the one the session stands for'

# A history restore is a page: htmx 2.0.4 sends `HX-Request: true` AND
# `HX-History-Restore-Request: true`, then swaps the answer's body into
# the page it is rebuilding — a bare fragment there is a page with no
# head, no script and no styles. The second header wins.
curl -s -b jar.txt -D headers.txt -H 'HX-Request: true' -H 'HX-History-Restore-Request: true' $B/notes -o page.html
head -c 15 page.html | grep -q '<!doctype html>' || fail 'a history restore was answered a bare fragment'
grep -q '<section id="notes">' page.html || fail 'the restored document did not contain the fragment'
grep -qi "^vary: $VARY" headers.txt || fail 'the restored document carried no Vary naming every header read'

# A boosted navigation is a page too: hx-boost sends `HX-Boosted: true`
# beside `HX-Request: true`, targets the body with innerHTML and takes a
# full document's body — a bare fragment there replaces the whole page
# with one section.
curl -s -b jar.txt -D headers.txt -H 'HX-Request: true' -H 'HX-Boosted: true' $B/notes -o page.html
head -c 15 page.html | grep -q '<!doctype html>' || fail 'a boosted request was answered a bare fragment'
grep -qi "^vary: $VARY" headers.txt || fail 'the boosted document carried no Vary naming every header read'

# Datastar asks with its own header and gets the same bare fragment as a
# text/html body, which it morphs into the element carrying the id. One
# renderer, the other transport, decided by the framework from the header.
curl -s -b jar.txt -D headers.txt -H 'Datastar-Request: true' $B/notes -o frag.html
head -c 20 frag.html | grep -q '<section id="notes">' || fail 'GET /notes with Datastar-Request did not answer the fragment'
grep -qiE 'doctype|<html' frag.html && fail 'the Datastar answer carried document markup'
grep -qi '^content-type: text/html' headers.txt || fail 'the Datastar answer was not text/html'
grep -qi "^vary: $VARY" headers.txt || fail 'the Datastar answer carried no Vary naming every header read'

# --- N13: a write carries the token, and only this session's ---------------
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -d 'title=forged' $B/notes)
[ "$code" = "403" ] || fail "expected 403 for a write with no CSRF token, got $code"
OTHER=$($ISSUE --key $KEY --subject notes --exp $((NOW + 1200)))
OTHER_CSRF=$($ISSUE --key $KEY --csrf-for "$OTHER")
[ "$OTHER_CSRF" != "$CSRF" ] || fail 'two sessions derived the same CSRF token'
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -d "csrf=$OTHER_CSRF&title=forged" $B/notes)
[ "$code" = "403" ] || fail "expected 403 for another session's CSRF token, got $code"
# The token is read from the body and from nowhere else: in the query
# string it is in the access log, the Referer and the history, and a
# server that accepted it there would make the htmx-config above
# decorative.
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X POST "$B/notes?csrf=$CSRF" -d 'title=forged')
[ "$code" = "403" ] || fail "expected 403 for a CSRF token in the query string, got $code"
curl -s -b jar.txt -H 'HX-Request: true' $B/notes | grep -q 'forged' \
  && fail 'a write refused for its token still happened'

# A urlencoded form: `+` is a space, %C3%A9 is one character and must come
# back as those two bytes, and a checkbox key repeated once per tick keeps
# every value. The answer is the list, as a fragment.
code=$(curl -s -o frag.html -w '%{http_code}' -b jar.txt -H 'HX-Request: true' \
  -d "csrf=$CSRF&title=Caf%C3%A9+au+lait&body=hello+world&tag=work&tag=home" $B/notes)
[ "$code" = "200" ] || fail "expected 200 from create, got $code"
grep -q 'Café au lait' frag.html || fail 'the title did not round-trip: multi-byte or plus-space decoding is wrong'
grep -q '<span class="tag">work</span>' frag.html || fail 'the first checkbox value was lost'
grep -q '<span class="tag">home</span>' frag.html || fail 'the repeated checkbox key lost its second value'
head -c 20 frag.html | grep -q '<section id="notes">' || fail 'POST /notes with HX-Request did not answer the fragment'

# A title that is markup is rendered as text, in the list and on its page.
curl -s -o frag.html -b jar.txt -H 'HX-Request: true' \
  --data-urlencode "csrf=$CSRF" --data-urlencode 'title=<script>alert(1)</script>' --data-urlencode 'body=b' $B/notes
grep -q '&lt;script&gt;alert(1)&lt;/script&gt;' frag.html || fail 'a markup title was not escaped in the list'
grep -q '<script>alert' frag.html && fail 'a markup title reached the list unescaped'
curl -s -b jar.txt -D headers.txt $B/notes/2 -o page.html
grep -q '<h1>&lt;script&gt;alert(1)&lt;/script&gt;</h1>' page.html || fail 'a markup title was not escaped on its page'
grep -q '<script>alert' page.html && fail 'a markup title reached its page unescaped'
grep -qi "^vary: $VARY" headers.txt || fail 'the detail page carried no Vary naming every header read'

# The detail route, reached by FOLLOWING a rendered link rather than typing
# the path: a route constant that was never registered reverses fine and
# 404s only when clicked, and this is the click. Then a note that does not
# exist.
href=$(grep -o 'href="/notes/[0-9]*"' frag.html | head -1 | cut -d'"' -f2)
[ -n "$href" ] || fail 'the list rendered no link to a note'
curl -s -b jar.txt -H 'HX-Request: true' "$B$href" | grep -q '<h1>Café au lait</h1><p>hello world</p>' \
  || fail "following the rendered link $href did not reach the note"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes/999)
[ "$code" = "404" ] || fail "expected 404 for a missing note, got $code"

# A body whose content type is not the form's is refused, never parsed as
# one. The bytes are deliberately form-SHAPED under a JSON content type:
# a JSON document would fail the title check anyway, so only this shape
# tells a server that reads the content type from one that guesses.
# A form with no title is refused too.
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -H 'Content-Type: application/json' -d 'title=json' $B/notes)
[ "$code" = "400" ] || fail "expected 400 for a body declared application/json, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -d "csrf=$CSRF&title=&body=b" $B/notes)
[ "$code" = "400" ] || fail "expected 400 for an empty title, got $code"
curl -s -b jar.txt -H 'HX-Request: true' $B/notes -o frag.html
grep -q 'json' frag.html && fail 'a refused body still created a note'
# Two notes were created above; a refused one must not have become a third.
[ "$(grep -o '<li>' frag.html | wc -l | tr -d ' ')" = "2" ] || fail 'a refused body still created a note (list length moved)'

# The router distinguishes 405 from 404 and says what IS allowed; a method
# a note's route does not take must not touch the note.
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -D headers.txt -X DELETE $B/notes)
[ "$code" = "405" ] || fail "expected 405 for DELETE on the collection, got $code"
grep -qi '^allow: GET, POST, OPTIONS' headers.txt || fail '405 carried no or a wrong Allow header'
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X PATCH $B/notes/1)
[ "$code" = "405" ] || fail "expected 405 for PATCH on a note, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes/1)
[ "$code" = "200" ] || fail "a 405 on a note must leave it intact, but GET answered $code"

# Delete carries the token in the BODY, which is what the shell's
# htmx-config buys: with the token in the query string it is refused, and
# the note survives.
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X DELETE "$B/notes/1?csrf=$CSRF")
[ "$code" = "403" ] || fail "expected 403 for a DELETE whose token was in the query, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X DELETE $B/notes/1)
[ "$code" = "403" ] || fail "expected 403 for a DELETE with no token, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes/1)
[ "$code" = "200" ] || fail "a refused DELETE must leave the note, but GET answered $code"
curl -s -X DELETE -b jar.txt -H 'HX-Request: true' -d "csrf=$CSRF" $B/notes/1 -o frag.html
grep -q 'Café au lait' frag.html && fail 'the list after delete still carried the note'
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes/1)
[ "$code" = "404" ] || fail "expected 404 after delete, got $code"

# G14, the body side: a form field holding a byte that is not UTF-8
# beside a percent-escape reaches the decoder from the body, not the
# target. It must be answered, and the server must still be up. The
# cookie rides with it, so the session parser sees the same bytes.
COOKIE=$(grep m0_notes_session jar.txt | awk '{print $7}')
python3 - "$COOKIE" "$CSRF" <<'PY' || fail 'a form body carrying a byte that is not UTF-8 got no answer'
import socket, sys
cookie, csrf = sys.argv[1], sys.argv[2]
body = ("csrf=%s&title=" % csrf).encode() + b"\\x80%41&body=x"
head = (
    "POST /notes HTTP/1.1\\r\\nHost: x\\r\\n"
    "Cookie: m0_notes_session=%s\\r\\n"
    "Content-Type: application/x-www-form-urlencoded\\r\\n"
    "Content-Length: %d\\r\\nConnection: close\\r\\n\\r\\n" % (cookie, len(body))
).encode()
s = socket.create_connection(("127.0.0.1", 8094), timeout=5)
s.sendall(head + body)
line = s.recv(4096).split(b"\\r\\n")[0]
s.close()
assert line.startswith(b"HTTP/1.1 "), line
PY
# G14, the cookie side: the session cookie is request-derived too, and a
# byte above 0x7F in it reaches the verifier's field walk. Refused, not
# fatal — one such request used to take the loop thread with it.
python3 - <<'PY' || fail 'a session cookie carrying a byte that is not UTF-8 got no answer'
import socket
head = (
    b"GET /notes HTTP/1.1\\r\\nHost: x\\r\\n"
    b"Cookie: m0_notes_session=v1.aaaaaaaa.1800000600.n\\x80tes.x\\r\\n"
    b"Connection: close\\r\\n\\r\\n"
)
s = socket.create_connection(("127.0.0.1", 8094), timeout=5)
s.sendall(head)
line = s.recv(4096).split(b"\\r\\n")[0]
s.close()
assert line.startswith(b"HTTP/1.1 "), line
PY
curl --silent --fail $B/health > /dev/null || fail 'the server was gone after a request carrying bytes that are not UTF-8'

# --- N13: logout -----------------------------------------------------------
#
# The cookie is stateless: logout expires it in the CLIENT, and a client
# that kept the value could use it until its own expiry. That is the TTL's
# job, and the gate says which of the two it is asserting — the jar is
# what honours the expiry.
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -c jar.txt -D headers.txt -d "csrf=$CSRF" $B/logout)
[ "$code" = "303" ] || fail "expected 303 from logout, got $code"
grep -qi '^location: /login' headers.txt || fail 'logout did not redirect to the login page'
grep -i '^set-cookie' headers.txt | grep -q 'Max-Age=0' || fail 'logout did not expire the cookie'
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes)
[ "$code" = "303" ] || fail "expected 303 after logout, got $code"
# And logout is itself a write: without the token it does not happen.
curl -s -o /dev/null -c jar.txt -d "user=notes&password=$PASSWORD" $B/login
CSRF=$($ISSUE --key $KEY --csrf-for "$(grep m0_notes_session jar.txt | awk '{print $7}')")
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X POST $B/logout)
[ "$code" = "403" ] || fail "expected 403 for a logout with no CSRF token, got $code"
code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt $B/notes)
[ "$code" = "200" ] || fail "a refused logout signed the session out anyway ($code)"

# The root is a redirect to the list, not a second copy of it.
code=$(curl -s -o /dev/null -w '%{http_code}' -D headers.txt $B/)
[ "$code" = "303" ] || fail "expected 303 from /, got $code"
grep -qi '^location: /notes' headers.txt || fail 'the root redirect carried no Location'

rm -f fragment.log refusal.log headers.txt page.html frag.html jar.txt notes_app
echo "smoke-fragment-notes OK"
python3 scripts/emit.py --covers N1 --task smoke-fragment-notes
python3 scripts/emit.py --covers N8 --task smoke-fragment-notes
python3 scripts/emit.py --covers N13 --task smoke-fragment-notes
python3 scripts/emit.py --covers G14 --task smoke-fragment-notes
"""

# --- Benchmarks ------------------------------------------------------------

[tool.poe.tasks.bench-core]
help = "Benchmark m0-core hot paths"
cmd = "mojo packages/m0-core/run_benchmarks.mojo"

# Built and run rather than `mojo run`, for the same libsqlite3 linking reason
# as test-sqlite above. Not part of test-all — neither is bench-core.
[tool.poe.tasks.bench-sqlite]
help = "Benchmark m0-sqlite read-out (links libsqlite3)"
shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-sqlite -Xlinker -lsqlite3 \
  packages/m0-sqlite/bench_sqlite.mojo -o "$out/bench_sqlite" || exit 1
"$out/bench_sqlite"
"""

# --- Toolchain -------------------------------------------------------------

[tool.poe.tasks.mojo-pin]
help = "Print the Mojo version pinned in uv.lock"
shell = "awk '/^name = \"mojo\"$/{f=1;next} f&&/^version = /{gsub(/[\",]/,\"\",$3);print $3;exit}' uv.lock"

# --- Nightly canary --------------------------------------------------------
# The pinned toolchain stays on stable in uv.lock. These swap the venv's mojo
# for a nightly to check for upcoming breakage, without touching the lockfile.
#
# IMPORTANT: plain `uv run` re-syncs the venv to uv.lock first, which silently
# reverts the nightly. While on a nightly, invoke every task as
#   uv run --no-sync poe <task>
# `nightly-restore` (or any plain `uv run`) puts you back on stable.

[tool.poe.tasks.nightly-try]
help = "Swap the venv onto the latest Mojo nightly (then use: uv run --no-sync poe ...)"
shell = """
uv pip install --index https://whl.modular.com/nightly/simple/ --prerelease allow --upgrade mojo
mojo --version
echo 'Now on a nightly. Run tasks as: uv run --no-sync poe <task>'
"""

[tool.poe.tasks.nightly-restore]
help = "Restore the pinned stable toolchain from uv.lock"
shell = "uv sync --reinstall-package mojo && mojo --version"

# One command for the whole nightly probe, because doing it by hand has two
# traps and both were hit while characterising the 1.1 break.
#
# 1. Every task run while on a nightly must avoid `uv run`, which re-syncs the
#    venv to uv.lock and silently puts you back on stable — the canary then
#    reports a green *stable* run and means nothing. Bare `poe` is
#    .venv/bin/poe and never syncs, so it is what this uses throughout.
# 2. A .mojoc is locked to the compiler that produced it, so a nightly run
#    leaves artifacts that stable cannot load ("precompiled file is
#    incompatible..."). Restoring the toolchain is not enough; the artifacts
#    have to be rebuilt too, and that must happen even when the canary fails.
#    Hence the EXIT trap rather than a trailing command.
#
# Exit codes: 0 the nightly is clean, 1 the nightly broke something (the
# signal), 2 the environment could not be put back and needs a hand. Note
# that while a break is mutually exclusive between toolchains - as the 1.1
# `Atomic` change is - no tree can return 0: the pinned build fails for a
# tree that satisfies the nightly, and vice versa. That is the break being
# reported accurately, not a fault in this task.
[tool.poe.tasks.canary]
help = "Run build-all + test-all against the Mojo nightly, then restore the pin"
shell = """
set -u

restore() {
  code=$?
  echo ""
  echo "--- restoring the pinned toolchain ---"
  if ! poe nightly-restore; then
    echo "CANARY: restore FAILED - the venv may still be on a nightly." >&2
    echo "Recover with: uv run poe nightly-restore && uv run poe build-all" >&2
    exit 2
  fi
  if ! poe build-all >/dev/null 2>&1; then
    echo "CANARY: rebuild on the pinned toolchain FAILED." >&2
    echo "The toolchain is restored, but the .mojoc artifacts are not." >&2
    echo "Most likely the working tree holds a change that only compiles on" >&2
    echo "the nightly - which is its own useful result. See: uv run poe build-all" >&2
    exit 2
  fi
  echo "--- restored $(mojo --version) ---"
  exit $code
}
trap restore EXIT

poe nightly-try || exit 1
echo ""
echo "--- canary: $(mojo --version) ---"
poe build-all || exit 1
poe test-all || exit 1
echo ""
echo "CANARY PASSED against $(mojo --version)"
"""

# --- Free-threaded Python canary ---------------------------------------------
#
# Like the Mojo nightly canary above, but probing the OTHER half of the
# toolchain: can this stack run on free-threaded CPython 3.14t (PEP 703/779)?
# The design swaps the whole .venv rather than the interpreter inside it: the
# poe executor targets .venv and prepends .venv/bin to PATH, so a swapped venv
# consistently switches BOTH the embedded libpython (Mojo resolves it from
# PATH's python3) AND the smoke tasks' client-side python3 probes, with zero
# smoke-task edits. The same uv.lock resolves under 3.14t (Django, asgiref,
# and Flask ship py3-none wheels; mojo==1.0.0 is py3-none-<platform>), so
# `uv sync --frozen --python 3.14t` builds an identically-locked venv without
# touching the lock. Unlike the nightly canary there is nothing to rebuild:
# .mojoc artifacts are compiler-locked, and both venvs install the same
# compiler.
#
# The traps, learned the way the nightly canary's were:
# 1. While swapped, every task must be invoked as bare `poe` - a plain
#    `uv run` re-syncs .venv to the lock's 3.13 resolution and the canary
#    then reports a green *stable* run that means nothing.
# 2. PYTHON_GIL=0 (honest mode: an extension that needs the GIL fails loudly
#    instead of silently re-enabling it and voiding the measurement) applies
#    to EVERY CPython that starts under it, including poe and the mojo driver
#    script themselves. On the 3.14t venv that is fine; exported into a 3.13
#    process it is an instant "Disabling the GIL is not supported by this
#    build" abort - so py-canary never sets it before the swap, and the
#    restore path unsets it first.
# 3. Target 3.14t only, never 3.13t: 3.13t systematically immortalizes
#    objects (a known leak; Django dropped 3.13t from its own CI over it).

# The same question through the stdlib's own bindings, under plain `mojo
# run`: `Python().cpython()` exposes PyEval_SaveThread / PyGILState_Ensure on
# the dlopen'd handle, so a threaded server needs no libpython on its link
# line — the rule m0-wsgi lives by. Also proves `print` from a pthread and a
# parametric `def` as a start routine, the two things the threaded execution
# mode (docs/WSGI_VS_ASGI.md §5) spawns. A GIL build answers ~1.0x; 3.14t
# parallelizes (run it as bare `poe` after `py314t-try`).
[tool.poe.tasks.py-thread-probe-stdpy]
help = "Thread probe via std.python's CPython bindings — no -lpython, plain mojo run"
cmd = "mojo run scripts/py_thread_stdpy_probe.mojo"

# The instrument behind the thread-pool go/no-go (docs/WSGI_VS_ASGI.md §5):
# spawns raw pthreads from Mojo and has each attach to the embedded
# interpreter and run Python, measuring correctness and parallel speedup.
# It BUILDS against the active venv's libpython rather than `mojo run`ning:
# the C-API symbols it calls directly (PyGILState_*, PyEval_*Thread) are not
# resolvable by the JIT before std.python's lazy dlopen — the same
# build-then-run rule m0-sqlite lives by. It therefore probes whichever
# interpreter the venv holds: the 3.13 pin, or 3.14t after `poe py314t-try`
# (invoke as bare `poe py-thread-probe` while swapped).
# Knobs: M0_PROBE_MODE=interop|raw|naive, M0_PROBE_THREADS, M0_PROBE_N.
[tool.poe.tasks.py-thread-probe]
help = "Build and run the multi-thread embedding probe against the active venv's Python"
shell = """
libdir=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
ldver=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LDVERSION"))')
out=$(mktemp -d)
mojo build scripts/py_thread_probe.mojo -o "$out/probe" \
  -Xlinker -L"$libdir" -Xlinker -lpython"$ldver" -Xlinker -rpath -Xlinker "$libdir" || exit 1
"$out/probe"
rc=$?
rm -rf "$out"
exit $rc
"""

[tool.poe.tasks.py314t-try]
help = "Swap .venv onto free-threaded CPython 3.14t from the same uv.lock (then: bare poe only, never uv run)"
shell = """
[ ! -e .venv-pinned ] || { echo 'py314t-try: .venv-pinned already exists - a previous canary did not restore. Run: uv run poe py314t-restore' >&2; exit 2; }
uv python install 3.14t || exit 1
mv .venv .venv-pinned || exit 2
if ! uv sync --frozen --python 3.14t; then
  echo 'py314t-try: the 3.14t venv could not be built from uv.lock - restoring the pinned venv' >&2
  rm -rf .venv
  mv .venv-pinned .venv || exit 2
  exit 1
fi
.venv/bin/python3 -VV
echo 'Now on 3.14t. Run tasks as: poe <task> (bare poe - a plain uv run re-syncs back to 3.13).'
"""

[tool.poe.tasks.py314t-restore]
help = "Restore the pinned 3.13 venv (no artifact rebuild needed - both venvs install the same mojo compiler)"
shell = """
if [ -d .venv-pinned ]; then
  rm -rf .venv || exit 2
  mv .venv-pinned .venv || exit 2
else
  uv sync || exit 2
fi
.venv/bin/python3 --version 2>&1 | grep -q ' 3.13' || { echo 'py314t-restore: restore left the wrong python in .venv' >&2; exit 2; }
.venv/bin/mojo --version >/dev/null || exit 2
echo "restored $(.venv/bin/python3 --version 2>&1)"
"""

# One command for the whole free-threaded probe. Exit codes match the nightly
# canary: 0 the 3.14t path is open, 1 free-threaded Python broke something
# (the signal - the environment is restored), 2 the environment could not be
# put back and needs a hand. Each phase is a distinguishable failure class;
# the report at the end names the phase that failed, and py-canary.log holds
# the full output.
[tool.poe.tasks.py-canary]
help = "Run the WSGI stack against free-threaded CPython 3.14t, then restore the pinned venv"
shell = """
set -u
: > py-canary.log
report=$(mktemp)
phase=provision
# Every phase runs under a watchdog and announces itself to the JOB LOG (the
# smokes' own output goes to py-canary.log). Without both, a hang is a
# 60-minute job timeout that GitHub reports as "cancelled", which runs no
# failure step, uploads no log, and names no phase -- the shape of the
# 2026-09-03 Linux run. perl's alarm survives the exec, so the phase's
# process gets SIGALRM at the deadline and the `|| FAIL($phase)` after it
# fires with the phase named. 20 minutes is several times any phase's
# worst on either runner (the whole canary took 3m31s on Linux 2026-08-23).
run() { echo "--- $phase $(date -u +%H:%M:%S)"; perl -e 'alarm shift; exec @ARGV' 1200 "$@" >> py-canary.log 2>&1; }

restore() {
  code=$?
  # PYTHON_GIL=0 aborts any 3.13 interpreter at startup - clear it before
  # anything from the restored venv runs.
  unset PYTHON_GIL MOJO_PYTHON_LIBRARY M0_RSS_LIMIT_KB
  echo ''
  echo '--- restoring the pinned 3.13 venv ---'
  # Inlined rather than `poe py314t-restore`: poe itself runs on the venv
  # being deleted, and uv/mv/grep do not.
  if [ -d .venv-pinned ]; then
    rm -rf .venv && mv .venv-pinned .venv || { echo 'PY-CANARY: restore FAILED - recover with: uv run poe py314t-restore' >&2; exit 2; }
  fi
  .venv/bin/python3 --version 2>&1 | grep -q ' 3.13' || { echo 'PY-CANARY: restore left the wrong python - recover with: uv run poe py314t-restore' >&2; exit 2; }
  git diff --quiet -- uv.lock .python-version || { echo 'PY-CANARY: the pin files changed during the canary' >&2; exit 2; }
  echo ''
  echo '--- PY-CANARY REPORT (full log: py-canary.log) ---'
  cat "$report"
  rm -f "$report"
  [ $code -eq 0 ] || echo "failed during phase: $phase"
  exit $code
}

# Artifacts are built on the PINNED toolchain before the swap: the same
# compiler serves both sides, and a pre-existing build failure must not be
# misread as a 3.14t finding.
run poe build-all || { echo 'PY-CANARY: build-all failed on the pinned toolchain - fix that first'; exit 1; }
trap restore EXIT
run poe py314t-try || { echo 'PY-CANARY: could not provision the 3.14t venv (see py-canary.log)'; exit 1; }
echo "provision: OK ($(.venv/bin/python3 --version 2>&1))" >> "$report"

# MOJO_PYTHON_LIBRARY is belt-and-braces: PATH resolution already finds the
# swapped venv's python3, but auto-discovery of free-threaded builds has a
# history (modular/modular#6366), and naming the dylib is harmless when
# redundant.
pylib=$(.venv/bin/python3 -c 'import sysconfig, os; print(os.path.join(sysconfig.get_config_var("LIBDIR") or "", sysconfig.get_config_var("INSTSONAME") or ""))')
[ -f "$pylib" ] || { echo "PY-CANARY: FAIL(libpython-discovery): $pylib not found"; exit 1; }
export MOJO_PYTHON_LIBRARY="$pylib"
export PYTHON_GIL=0
export M0_RSS_LIMIT_KB=24576

phase=A0-driver-and-artifacts
run poe test-wsgi || { echo "PY-CANARY: FAIL($phase): the mojo driver or the pinned-compiler artifacts break under the 3.14t venv (see py-canary.log)"; exit 1; }
echo 'A0 test-wsgi (driver + artifacts, no interpreter): OK' >> "$report"

phase=A1-interpreter-probe
if ! mojo run scripts/py_canary_probe.mojo > probe.out 2>&1; then
  cat probe.out; cat probe.out >> py-canary.log
  echo 'retrying with PYTHON_GIL=1 to split "3.14 breaks us" from "free-threading breaks us":'
  PYTHON_GIL=1 mojo run scripts/py_canary_probe.mojo || true
  echo "PY-CANARY: FAIL($phase)"; exit 1
fi
cat probe.out >> py-canary.log
grep -q 'free_threaded_build=1' probe.out || { echo 'PY-CANARY: FAIL(not-actually-free-threaded): the embedded interpreter is not a free-threaded build'; cat probe.out; exit 1; }
grep -q 'gil_enabled=False' probe.out || { echo 'PY-CANARY: FAIL(gil-still-enabled): free-threaded build, but the GIL is on'; cat probe.out; exit 1; }
echo "A1 probe: OK ($(grep 'python_version=' probe.out), embedded GIL off)" >> "$report"
rm -f probe.out

phase=B-smoke-wsgi
run poe smoke-wsgi || { echo "PY-CANARY: FAIL($phase): PEP 3333 conformance or the first fork (see py-canary.log)"; exit 1; }
echo 'B smoke-wsgi (PEP 3333 + fork, M0_WORKERS=2): OK' >> "$report"

phase=C-smoke-django
run poe smoke-django || { echo "PY-CANARY: FAIL($phase) (see py-canary.log)"; exit 1; }
echo "C smoke-django: OK ($(grep -o 'rss growth over 10k requests: [0-9-]*KB' py-canary.log | tail -1) vs 12288KB production limit)" >> "$report"

phase=C2-smoke-flask
run poe smoke-flask || { echo "PY-CANARY: FAIL($phase) (see py-canary.log)"; exit 1; }
echo 'C2 smoke-flask: OK' >> "$report"

phase=C3-smoke-django-realtime
run poe smoke-django-realtime || { echo "PY-CANARY: FAIL($phase): the hybrid hold/publish path (see py-canary.log)"; exit 1; }
echo "C3 smoke-django-realtime (hybrid SSE + numbered ids, phase 4: cross-THREAD fan-out over one bus; $(grep -o 'phase 6: .*' py-canary.log | tail -1)): OK" >> "$report"

# The WebSocket half, and the only phase that drives a second shared library
# into the embedded interpreter: m0pub ctypes-loads libm0core to fetch-add the
# event counter. A free-threaded build changes how that dlopen and that call
# interact with the GIL-less runtime, which is exactly what a canary is for.
phase=C4-smoke-django-realtime-ws
run poe smoke-django-realtime-ws || { echo "PY-CANARY: FAIL($phase): Django-gated WebSocket holds (see py-canary.log)"; exit 1; }
echo "C4 smoke-django-realtime-ws (WebSocket holds + ctypes atomic under free-threading; $(grep -o 'phase 4: .*' py-canary.log | tail -1)): OK" >> "$report"

# The mode free-threading exists for: N loops on N threads, one interpreter.
# Phase 2 of smoke-threads only runs here, where the GIL is genuinely off.
phase=D-smoke-threads
run poe smoke-threads || { echo "PY-CANARY: FAIL($phase): the threaded execution mode (see py-canary.log)"; exit 1; }
echo "D smoke-threads ($(grep -o 'threads seen: .*' py-canary.log | tail -1)): OK" >> "$report"

# Phase 3 of smoke-reload -- --reload in front of --threads -- is gated the
# same way, so this is where the two modes are proven to compose.
phase=E-smoke-reload
run poe smoke-reload || { echo "PY-CANARY: FAIL($phase): hot reload (see py-canary.log)"; exit 1; }
echo "E smoke-reload (1 worker, 2 workers, and --reload in front of --threads): OK" >> "$report"

# Stage B composed with Stage A. Phase 1 of smoke-blocking-threads runs on
# every CI machine; phase 2 -- a pool per loop under --threads N -- only runs
# where the loops themselves can, which is here.
phase=F-smoke-blocking-threads
run poe smoke-blocking-threads || { echo "PY-CANARY: FAIL($phase): the blocking-threads pool (see py-canary.log)"; exit 1; }
echo "F smoke-blocking-threads ($(grep -o 'threads+pool: .*' py-canary.log | tail -1)): OK" >> "$report"

echo ''
echo "PY-CANARY PASSED against $(.venv/bin/python3 --version 2>&1) (free-threaded)"
"""

[tool.poe.tasks.smoke-drain-upload]
help = "A request whose body is still arriving at SIGTERM is read on and answered; the drain exits promptly"
deps = ["build-serve"]
shell = """
# SPEC D9. The soak driver's uploads population found this on
# color-separation: with 9.7 MB POSTs in flight every drain took exactly
# its 5 s budget, because the drain loop dispatched writes only and never
# read the rest of a body. `scripts/drain_upload_probe.py` is two-sided --
# the upload must be ANSWERED (read on during the drain), AND the process
# must exit inside 3 s of the signal -- and runs in both shapes: the ASGI
# executor's /echo (the whole 10 MB comes back), and a WSGI pool thread's
# /input/read (the length it read comes back). Sabotage: restore the old
# write-only drain loop; the probe reports the reset at ~5 s in both.
srv=bin/m0serve
cleanup() { kill $pid 2>/dev/null; rm -f drain-upload.log; }
trap cleanup EXIT
fail() { echo "$1"; [ -f drain-upload.log ] && cat drain-upload.log; exit 1; }

"$srv" bareapp.asgi:application --app-dir apps/asgi_bare --port 8114 --max-body 64m > drain-upload.log 2>&1 &
pid=$!
curl --retry 20 --retry-delay 1 --retry-all-errors --silent --fail http://127.0.0.1:8114/ > /dev/null \
  || fail 'the ASGI server never became healthy'
python3 scripts/drain_upload_probe.py --port 8114 --pid $pid \
  || fail 'ASGI executor: the drain did not finish an upload in flight'

"$srv" bareapp.wsgi:application --app-dir apps/wsgi_bare --port 8115 --max-body 64m > drain-upload.log 2>&1 &
pid=$!
curl --retry 20 --retry-delay 1 --retry-all-errors --silent --fail http://127.0.0.1:8115/ > /dev/null \
  || fail 'the WSGI server never became healthy'
python3 scripts/drain_upload_probe.py --port 8115 --pid $pid --path /input/read --answer-contains len=10485760 \
  || fail 'WSGI pool thread: the drain did not finish an upload in flight'

python3 scripts/emit.py --covers D9 --task smoke-drain-upload
echo "smoke-drain-upload: an upload in flight at SIGTERM is answered and the drain exits promptly, both shapes"
"""

[tool.poe.tasks.soak-selftest]
help = "Prove the soak driver's comparator can report a difference"
cmd = "python3 scripts/soak.py --selftest"

[tool.poe.tasks.soak-apps]
help = "PRE-RELEASE: the soak driver's shakedown against two in-tree apps (not in CI)"
deps = ["build-serve"]
shell = """
# The soak's subjects are third-party applications (docs/REAL_APP_VALIDATION.md);
# this task is not the soak. It is what keeps the DRIVER honest between passes,
# because a harness that only ever runs against somebody else's Django project
# rots silently. hybrid_mix produces every population but uploads and sockets
# (four mounts, two executors, a pool); asgi_bare produces those two.
python3 scripts/soak.py --selftest || exit 1

secs=${M0_SOAK_SECONDS:-30}
port=${M0_SOAK_PORT:-8340}

# A stray server would answer instead: SO_REUSEPORT means a second bind
# SUCCEEDS and takes a share of the connections, so "it passed" means nothing.
for p in $port $(( port + 1 )) $(( port + 2 )); do
  if nc -z 127.0.0.1 $p 2>/dev/null; then
    echo "soak-apps: port $p is already in use"; exit 1
  fi
done

# Leg 1: the mounted mix, SIGTERM'd and restarted every third of the run
# with every population mid-flight. The drain must exit 0 inside its budget
# and leave no worker behind; connection errors are tolerated only between
# the signal and readiness, and a body cut short is a failure even then.
python3 scripts/soak.py \
  --manifest scripts/soak_manifests/hybrid_mix.json \
  --url http://127.0.0.1:$port --seconds "$secs" --log soak-hybrid.log \
  --churn-every $(( secs / 3 )) --churn-mode sigterm \
  --serve "bin/m0serve --mount /=shop.wsgi --mount /portal=portal.wsgi:app \
           --mount /app=live.asgi --mount /live=feed.asgi \
           --app-dir apps/hybrid_mix --port $port --metrics" || exit 1

# Leg 2: the same mix under --reload, re-forked by a touch every third of
# the run. The supervisor keeps the listener, so this one should tolerate
# nothing at all -- a connection error here is the reload dropping a request.
python3 scripts/soak.py \
  --manifest scripts/soak_manifests/hybrid_mix.json \
  --url http://127.0.0.1:$(( port + 2 )) --seconds "$secs" --log soak-reload.log \
  --churn-every $(( secs / 3 )) --churn-mode reload \
  --serve "bin/m0serve --mount /=shop.wsgi --mount /portal=portal.wsgi:app \
           --mount /app=live.asgi --mount /live=feed.asgi \
           --app-dir apps/hybrid_mix --port $(( port + 2 )) --metrics --reload" || exit 1

# Leg 3: uploads and WebSockets, which the mix cannot produce.
python3 scripts/soak.py \
  --manifest scripts/soak_manifests/asgi_bare.json \
  --url http://127.0.0.1:$(( port + 1 )) --seconds "$secs" --log soak-bare.log \
  --serve "bin/m0serve bareapp.asgi --app-dir apps/asgi_bare \
           --port $(( port + 1 )) --metrics --max-body 8m" || exit 1

echo "soak-apps: three in-tree legs clean over ${secs}s each"
"""
