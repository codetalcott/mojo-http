shell = """
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
mojo build -I packages/m0-core/ -I packages/m0-http/ -I packages/m0-datastar/ \
  -I packages/m0-sqlite/ -I apps/ \
  apps/datastar_todo/server.mojo -o "$out/todo" || exit 1
"$out/todo"
"""

