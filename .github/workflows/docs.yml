# The doc-fact ratchet, on EVERY commit.
#
# `Tests` already runs `poe check-docs`, but it carries
# `paths-ignore: ['*.md', 'docs/**', '.claude/**']` — so a pull request that
# edits only prose runs no CI at all, and the ratchet is silent on exactly the
# changes it exists to check. `check_wheel_platform_claims`' docstring records
# the asymmetry it produces: a PR touching only README.md skips CI entirely,
# while one touching only packaging/m0serve/README.md runs the full suite,
# because a GitHub path glob's `*` does not cross `/`.
#
# This workflow deliberately has NO path filter. A filtered workflow has the
# same defect inverted — it would never trigger on a code-only PR — and a check
# that does not always report can never be a required one. Unfiltered, this
# always reports, which is what makes it eligible to be the first required
# status check on `main`. The ruleset declares none today precisely because
# `Tests` cannot report on every PR.
#
# It must NOT be named `Tests`: dependabot-automerge.yml and label-automerge.yml
# both trigger on `workflow_run` of that exact name. Nor should this workflow be
# added to their trigger lists — QUICKSTART.md is a file CI *executes*
# (`poe smoke-quickstart`), so letting a doc-only PR auto-merge on a doc lint
# alone would land quickstart edits that were never run.
#
# Its own concurrency group, for the same class of reason: reusing
# `tests-${{ github.ref }}` would cancel an in-flight `Tests` run on any PR
# that touches both code and docs.
#
# What it runs is scripts/docs_gate.sh, the same file `poe check-docs` runs,
# so the required check and the local task are one list (they were two, and
# each skipped checks the other ran). That script needs standard-library
# Python 3.11 or later (tomllib) and pyflakes, and check_docs' one network
# check treats a failure to ask as a skip. So this needs no uv, no Mojo
# toolchain, and nothing compiled. (It once said a bare Python 3.9 was
# enough; tomllib ended that, and the runner's python3 is 3.12.)
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # No setup-python: the runner's system python3 is enough, and pinning a
      # version here would be a third place the interpreter is chosen.
      # pyflakes is the gate's one dependency outside the standard library,
      # pinned, and installed here rather than through uv because this
      # workflow deliberately needs no toolchain.
      - name: Install pyflakes
        run: python3 -m pip install --quiet pyflakes==3.4.0
      # The whole gate: the doc-fact ratchet with docs/SPEC.md's rules, each
      # checker's selftest, pyflakes over the executor shim, the spec-sheet,
      # citation and milestone sabotages, and the milestone rot gates. What
      # each part is for is written beside it in the script. An unconditional
      # step that may not fail: check_docs holds it to that, because this
      # job is the required check and a step that could not fail it would
      # leave every pull request merging on nothing.
      - name: The docs gate, as `poe check-docs` runs it
        run: sh scripts/docs_gate.sh
