name: Free-Threaded Python Canary

on:
  schedule:
    # Weekly, offset from the Mojo nightly canary (Tuesday). This is the
    # standing go/no-go gate for the thread-pool successor to M0_WORKERS
    # forking (docs/WSGI_VS_ASGI.md §5): it keeps "the 3.14t path is open"
    # a measured fact as CPython patches, Django, and Mojo all move, rather
    # than a one-time result from August 2026.
    - cron: '0 22 * * 3'  # Wednesday 10pm UTC
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  py-canary:
    # The 2026-09-02 failure was diagnosed from macOS alone: fail-fast
    # cancelled the Linux job before it reached the failing phase, twice.
    # Each platform is its own answer here.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    # The repository's default token is read-only, so "Create issue on
    # failure" below had never been able to file anything (the 2026-08-26
    # cancellation and the 2026-09-02 failure both went unreported).
    permissions:
      contents: read
      issues: write
    runs-on: ${{ matrix.os }}
    # The canary runs the full WSGI suite twice-ish (pinned build, then the
    # 3.14t smokes, including smoke-django's 10k-request RSS loop).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Same reason as test.yml: m0-sqlite links libsqlite3, and build-all
      # (the canary's first step) compiles every package. macOS resolves it
      # from the dyld shared cache with no setup.
      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf

      - name: Install pinned dependencies
        run: uv sync

      # The task owns the whole probe: builds on the pinned toolchain, swaps
      # .venv onto free-threaded 3.14t from the same uv.lock, runs the WSGI
      # suite under PYTHON_GIL=0, and restores the pin in an EXIT trap.
      # Exit 1 is the signal (3.14t broke something); exit 2 means the
      # runner's environment could not be put back, which is disposable here.
      - name: Run the free-threaded canary
        # Shorter than the job's 60 so a hang is a FAILED step (the failure
        # steps below then run) rather than a cancelled job that uploads
        # nothing and files nothing. The task's own per-phase watchdog
        # should fire first and name the phase.
        timeout-minutes: 45
        run: uv run poe py-canary

      - name: Upload the canary log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: py-canary-log-${{ matrix.os }}
          path: py-canary.log

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Free-threaded canary failed (${{ matrix.os }})" \
            --label "freethreading-breakage" \
            --body "The weekly free-threaded Python canary failed on ${{ matrix.os }}.

          [View failed run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) — py-canary.log is attached as an artifact, and the job output ends with the phase-by-phase report naming which failure class this is (provision, libpython discovery, probe, conformance, Django/Flask, realtime hybrid, or restore).

          This likely means a CPython 3.14t patch, a dependency release, or a Mojo change moved under the free-threaded embedding path. docs/WSGI_VS_ASGI.md §5 records what the canary gates and why."

  # FastHTML beside uvicorn at the NEWEST release of each (SPEC L36,
  # docs/FASTHTML.md). It rides this workflow's weekly cron because it asks
  # the same kind of question -- did something outside the lockfile move --
  # and scripts/spec_sheet.py reads a `(weekly)` gate from this file.
  #
  # It runs code this repository does not pin: PyPI's newest releases and
  # the HEAD of FastHTML's two example repositories. So the checkout keeps
  # no credential, and the token reaches only the step that files the issue.
  fasthtml-canary:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          apt: libsqlite3-dev patchelf

      - name: Install pinned dependencies
        run: uv sync

      - name: Compare FastHTML under m0serve and under uvicorn
        timeout-minutes: 30
        run: uv run poe fasthtml-canary

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fasthtml-canary
          path: fasthtml-canary.log

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "FastHTML canary failed" \
            --body "The weekly comparison of FastHTML under m0serve and under uvicorn failed.

          [View failed run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) — the job output ends with one FAIL line per finding and names the versions compared; fasthtml-canary.log is attached as an artifact.

          A new python-fasthtml, Starlette or uvicorn release moved, or this server did. scripts/fasthtml_compare/compare.py's docstring says what each failure means and how a difference is added to or retired from docs/FASTHTML.md."
