name: Dependabot auto-merge

# Merges Dependabot PRs once the Tests workflow has actually passed.
#
# This deliberately does NOT use `gh pr merge --auto`. Repository auto-merge
# is disabled here, so `--auto` errors — and it would not gate on CI even if
# enabled, because auto-merge waits only on required status checks, and the
# ruleset protecting `main` declares none on purpose: test.yml's paths-ignore
# means a doc-only PR produces no Tests run at all, so a required check would
# never report and such a PR could never merge.
#
# Triggering on workflow_run instead means this only fires after Tests has
# reported success for the PR's head commit.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    # Gated on Dependabot's branch namespace rather than the actor field,
    # which is not reliably 'dependabot[bot]' on a workflow_run event.
    # Creating a dependabot/* branch requires write access to this repo
    # anyway, so the namespace is a sufficient gate.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Resolve the PR for this run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          # workflow_run.pull_requests is unreliable, so resolve by head branch.
          number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" \
                     --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for $HEAD_BRANCH; nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found PR #$number for $HEAD_BRANCH"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge --repo "$REPO" "$NUMBER" --squash --delete-branch
