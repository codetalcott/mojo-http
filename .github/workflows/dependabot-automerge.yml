name: Dependabot auto-merge

# Merges Dependabot PRs once the Tests workflow has actually passed.
#
# This deliberately does NOT use `gh pr merge --auto`. Repository auto-merge
# is disabled here, so `--auto` errors — and it would not gate on CI even if
# enabled, because auto-merge waits only on required status checks, and the
# ruleset protecting `main` declares none on purpose: test.yml's paths-ignore
# means a doc-only PR produces no Tests run at all, so a required check would
# never report and such a PR could never merge.
#
# Triggering on workflow_run instead means this only fires after Tests has
# reported success for the PR's head commit.
#
# **The branch name is not the gate.** It used to be: the job ran on
# `startsWith(head_branch, 'dependabot/')`, reasoning that pushing such a
# branch requires write access. That is true of a branch in THIS repository
# and false of a pull request from a fork, where the head-ref name is chosen
# by whoever opened it — so anyone able to get a green Tests run on a fork PR
# named `dependabot/anything` could have it squash-merged to a protected
# `main` with the base repo's token, no label and no review. The author,
# the head repository, and the tested commit are all checked below instead.
#
# **Two of the refusals are red.** "No open PR" and "the PR moved on" are
# routine — label-automerge.yml got there first, or a push landed while Tests
# ran — and exit 0. A PR on a `dependabot/` branch that is not Dependabot's,
# or that comes from a fork, is never routine, so those exit 1: it is either
# someone impersonating the bot or this gate no longer recognising it. The
# second is what happened for 26 days (2026-08-17 to 2026-09-12) when the
# runner's gh began rendering the author as `app/dependabot` where it had
# said `dependabot[bot]`: every run green, every Dependabot PR refused, the
# reason one log line nobody read. The author is therefore resolved through
# the REST API (`user.login` + `user.type`, the API's contract), never
# through the CLI's `--json author` rendering, and `check_dependabot_gate`
# in scripts/check_docs.py pins both the source and the exit codes.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Resolve the PR and verify it is really Dependabot's
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # workflow_run.pull_requests is unreliable, so resolve by head branch.
          # `--head` matches on the bare ref name, which a fork PR also
          # supplies — every check that matters is made on the PR object.
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,headRefOid,isCrossRepository \
                 --jq '.[0]')
          if [ -z "$pr" ]; then
            echo "No open PR for $HEAD_BRANCH; nothing to merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(printf '%s' "$pr" | jq -r '.number')
          head=$(printf '%s' "$pr" | jq -r '.headRefOid')
          cross=$(printf '%s' "$pr" | jq -r '.isCrossRepository')

          # The authorization gate: Dependabot itself opened this, not
          # someone who named a branch after it. The author comes from the
          # REST API, whose `user.login` and `user.type` are the contract —
          # NOT from `gh pr list --json author`, whose login is a rendering:
          # gh 2.98 prints a bot as `app/dependabot` where earlier versions
          # printed `dependabot[bot]`, and a compare against one spelling
          # refused every Dependabot PR for 26 days with a green run each
          # time. Hence exit 1: on a `dependabot/` branch this refusal is
          # never routine — an impersonation, or the gate no longer
          # recognising Dependabot — and either must be red.
          user=$(gh api "repos/$REPO/pulls/$number" --jq '.user.login + " " + .user.type')
          if [ "$user" != "dependabot[bot] Bot" ]; then
            echo "::error::PR #$number was opened by '$user', not 'dependabot[bot] Bot'; refusing."
            exit 1
          fi

          # Dependabot pushes branches to this repository. A cross-repository
          # PR claiming to be from it is not something to merge unattended,
          # and not something to be quiet about either.
          if [ "$cross" != "false" ]; then
            echo "::error::PR #$number comes from a fork; refusing to auto-merge."
            exit 1
          fi

          # The run that just passed must describe the PR's current head.
          # Without this, pushing a commit while CI ran on the previous one
          # would merge code that was never tested. (Same rule, and the same
          # reason, as label-automerge.yml.)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$number moved on ($head != $HEAD_SHA); waiting for the new run."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #$number is green, current, and authored by dependabot[bot]."
          echo "merge=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Squash-merge
        if: steps.pr.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge --repo "$REPO" "$NUMBER" --squash --delete-branch
