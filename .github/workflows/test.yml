# dependabot-automerge.yml keys on this exact workflow name — do not rename.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build packages (cross-package deps need .mojoc)
        run: uv run poe build-all
      - name: Run unit tests
        run: uv run poe test-all

  smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build all packages
        run: uv run poe build-all
      # Exercises the m0-http <-> lightbug_http cycle end to end: the binary
      # only runs if lightbug_http/event_loop.mojo's `from m0_http.log import
      # log_access` resolves against m0_http.mojoc at run time.
      - name: Smoke test the hello server
        run: uv run poe smoke-hello
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hello-log-${{ matrix.os }}
          path: hello.log
          if-no-files-found: ignore
