# dependabot-automerge.yml keys on this exact workflow name — do not rename.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Green runs finish in 13-18 min (2026-09-21; 11-15 on 2026-09-03, and
    # 4-6 when the cap was first set). Without an explicit cap a hung step
    # runs to GitHub's 6-hour default while holding this ref's concurrency
    # group, so a stall reads as "still running" for hours instead of
    # failing. See the apt step below for the stall that motivated this.
    #
    # 30 was too close. `Run unit tests` is ONE 14-minute step (`poe
    # test-all`), and the same slow ubuntu runners that cancelled the
    # smoke job ran this leg at 22m0s and 26m1s against 18m0s on `main`
    # — 87% of the cap, with nothing in the tree changed. A cap a green
    # run can reach is a coin toss, so this one is left at roughly twice
    # the measured run, like the two smoke jobs below.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The doc-fact ratchet, before anything is built: prose numbers with
      # a machine source (warning counts, smoke coverage in THIS file, the
      # generated bench table) must match it. Runs here and not in the
      # smoke job because it needs nothing compiled and fails in seconds.
      - name: Check machine-sourced doc facts
        run: uv run poe check-docs
      # Known issues must declare what retires them -- one outlived its fix
      # by a release because nothing could notice. The milestone REPORT
      # prints beside it, so "what is left for 1.0" is answered by CI on
      # every pull request rather than by whoever remembers.
      - name: Milestone rot gates, and the report
        run: |
          uv run poe check-milestones
          uv run poe milestones
      # m0-sqlite opens libsqlite3 at run time (SPEC O17), so nothing links
      # it; the development package is for `verify-vtab-layout`, which
      # compiles a C file against sqlite3.h. The library itself is on every
      # runner already.
      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        # Normally ~6 s. Observed hanging for 63 min against an unreachable
        # apt mirror, which is what a step-level cap turns into a fast,
        # legible failure — the job cap above is the backstop, this is the
        # one step known to stall.
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      # Both steps tee into one log so the ratchet below sees every warning:
      # build-all covers the packages, and test-all is the only thing that
      # compiles test/ sources, where most of the residual warnings live.
      # pipefail keeps a build failure fatal despite the pipe into tee.
      - name: Build packages (cross-package deps need .mojoc)
        shell: bash
        run: |
          set -o pipefail
          uv run poe build-all 2>&1 | tee -a compile.log
      - name: Run unit tests
        shell: bash
        run: |
          python3 scripts/emit.py --covers L7 --task step
          python3 scripts/emit.py --covers L20 --task step
          python3 scripts/emit.py --covers N28 --task step
          python3 scripts/emit.py --covers I27 --task step
          set -o pipefail
          uv run poe test-all 2>&1 | tee -a compile.log
      # Holds the residual warning count at scripts/warning_baseline.json.
      # mojo has no per-warning suppression, so without this a new warning
      # just joins ~68 existing ones and nobody sees it.
      # Guards the guard: the ratchet is only meaningful if its parser still
      # matches. A silent parse regression would under-count and pass.
      - name: Self-test the warning parser
        run: python3 scripts/warning_ratchet.py --selftest
      # Same reasoning, different parser. binfmt.py tells a dylib from an
      # executable, and getting that backwards is invisible to any test that
      # only ever inspects one of them -- which is exactly how the portability
      # checker came to report bin/m0serve as self-contained while it resolved
      # the Mojo runtime through a path on one developer's machine.
      - name: Self-test the Mach-O/ELF parser
        run: python3 scripts/binfmt.py --selftest
      # Same reason as the two above: a silent regression in the recorder would
      # drop measurements rather than fail, and nothing else would notice.
      - name: Self-test the measurement recorder
        run: |
          python3 scripts/emit.py --selftest
          python3 scripts/emit.py --covers F11 --task emit-selftest
      - name: Check the compiler warning count has not grown
        run: uv run poe check-warnings compile.log
      # The Mojo pool's guards, proven able to fail: each rule in
      # mojo_pool.mojo is reverted in turn and test_mojo_pool must go red for
      # every one. Deterministic, so it belongs in CI (the shim sabotage's
      # argument); ubuntu only because the one-pill-per-thread rule is
      # invisible on macOS -- closing the submit channel wakes a blocked recv
      # there and does not on Linux (OffloadPool.stop's documented lesson).
      - name: Sabotage the Mojo pool's rules (Linux observes all four)
        if: matrix.os == 'ubuntu-latest'
        run: uv run poe sabotage-pool

      # The chunked decoder's trailer states: reverting each rule must fail
      # test_parsing. They were the decoder's untested region -- the
      # round-trip tests set `consume_trailer` over a wire with no trailer
      # section, so no test reached them (SPEC A10).
      - name: Sabotage the chunked trailer rules
        run: uv run poe sabotage-trailers

      # `check-keepalive-barrier` runs inside test-all above and asserts that
      # a bare `_ = x` after an FFI call still pins the buffer that call reads
      # -- and that deleting it still frees EARLY, without which the gate
      # would pass on a toolchain where the line does nothing. This is the
      # half that matters when the gate is green, which is the normal result:
      # it reverts each rule in the probe and insists the check reports it.
      # Both runners, because the IR is per-target.
      - name: Sabotage the keep-alive probe the barrier check reads
        run: uv run poe sabotage-keepalive

      # SPEC G13. The request decoder is a pure function over bytes, so the
      # fuzz harness needs no socket: mutate a seed corpus, assert the
      # invariants, and stay replayable from --seed. `sabotage-fuzz` is the
      # half that matters when the fuzzer finds nothing, which is the normal
      # result -- it breaks each invariant and insists the run reports it, so
      # "no findings" cannot mean "checks nothing".
      - name: Fuzz the request decoder
        run: uv run poe fuzz-request

      - name: Sabotage the decoder invariants the fuzzer checks
        run: uv run poe sabotage-fuzz
      # m0-wsgi embeds CPython, so its interpreter has to resolve on both
      # runners. Failing here rather than inside a smoke test makes a
      # libpython discovery problem legible.
      - name: Check the embedded interpreter resolves
        run: uv run python -c "import django, sys; print(sys.version, django.__version__)"

  # aarch64, on every pull request rather than only at release time.
  #
  # release.yml runs on a tag, so without this the arm64 wheel would first
  # be built during a release -- discovering a break after the GitHub
  # release exists and with the PyPI upload gated behind it. That is the
  # exact shape of failure the clean-consumer jobs were added to prevent,
  # and it would have been reintroduced by putting aarch64 only in the
  # release path.
  #
  # Scoped to the arch-specific part -- build plus the wheel smoke, which
  # installs outside the tree and runs the removal sabotage -- rather than
  # the whole smoke suite. What differs by architecture is codegen and
  # linking, not HTTP semantics. Widen it if this ever catches something
  # the wheel smoke misses.
  #
  # Trade-off worth knowing: this gates automerge like every other job here,
  # so an arm-runner outage blocks merges. Moving it to its own workflow
  # would remove that fragility and the gate together.
  wheel-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - name: Build and smoke test the aarch64 wheel
        run: uv run poe smoke-wheel

  # The m0-postgres rows that need a real server (SPEC O10-O15). A separate
  # Linux-only job, the wheel-aarch64 / pid1 shape: job-level `runs-on`, no
  # step-level condition on the cited step, because the spec checker rightly
  # rejects a cited step carrying an `if:`.
  #
  # Linux-only because GitHub's service containers require a Linux runner —
  # not a preference, a platform fact — so there is no macOS arm to write.
  # docs/RELEASING.md names `poe test-postgres-server` on a Mac with a local
  # server as the pre-release arm; the lifetime rules the job pins are
  # toolchain behaviour rather than OS behaviour, so Linux every PR is the
  # coverage that matters for them.
  #
  # `libpq5` is installed explicitly rather than relied on: the runner image
  # ships a PostgreSQL client, but this package opens the library by name at
  # run time and an image change that dropped it would otherwise surface as a
  # confusing "libpq could not be opened" rather than as a missing dependency.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: m0
          POSTGRES_DB: m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: postgres
      M0_PG_TEST_URL: postgres://postgres:m0@127.0.0.1:5432/m0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev libpq5 patchelf
      - run: uv run poe build-all
      - name: Test m0-postgres against a real server
        run: uv run poe test-postgres-server
      - name: Build the serve CLI
        run: uv run poe build-serve
      - name: Smoke test a Postgres NOTIFY reaching a held stream
        run: uv run poe smoke-pg-notify
      - name: Record the measurements
        if: always()
        run: python3 scripts/emit.py --render "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-postgres
          path: ci-results.jsonl
          if-no-files-found: ignore

  # N30: `uv run m0 dev` on a scaffolded app, asked of a real process tree --
  # the OLD server answers while a build runs and after one fails, a build
  # that succeeded swaps pids with exactly one process listening, and SIGINT
  # to m0 dev alone stops the server and exits 0.
  #
  # A job of its own, on both platforms, rather than a step in `smoke`: that
  # job is capped at 35 minutes and its macOS leg ran 33:00 on main the day
  # this was added, and this gate needs nothing `smoke` builds -- the m0
  # wheel is pure Python and the scaffold compiles from the SOURCE it
  # carries, so there is no `build-all` here and it starts with the run.
  scaffold-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: scaffold-dev-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Smoke test m0 dev on the scaffold
        run: uv run poe smoke-scaffold-dev
      # N33: the Mojo stack's front door, executed. Here and not in `smoke`
      # for the reason above -- it needs the m0 wheel and nothing else -- and
      # on both platforms, because the page claims both. The page lives at
      # packaging/m0/QUICKSTART.md, outside this workflow's paths-ignore, so
      # a pull request that edits only the page still runs it.
      - name: Execute the Mojo quickstart
        run: uv run poe smoke-quickstart-mojo
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-scaffold-dev-${{ matrix.os }}
          path: ci-results.jsonl
          if-no-files-found: ignore

  # M11: `docker stop` is SIGTERM to PID 1 and nothing else, and PID 1 gets
  # no default signal dispositions — a SIGTERM with no handler installed is
  # discarded, not fatal. The smoke matrix cannot host this (macOS runners
  # have no Docker) and the spec checker rightly rejects a cited step that
  # carries an `if:`, so it is a separate Linux-only job, the wheel-aarch64
  # shape: job-level runs-on, no step-level conditions on the cited step.
  pid1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: pid1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - name: Smoke test SIGTERM delivered to PID 1 in a container
        run: uv run poe smoke-pid1
      # The documentation site's deploy image, built from THIS tree's wheel
      # (deploy/site/Dockerfile is what `fly deploy` builds) and served from a
      # container through a published port: llms.txt and the sitemap at the
      # root, a page and its markdown twin, the redirect and 404 from the app
      # behind the mount, m0serve as PID 1, and `docker stop` as the drain.
      - name: Smoke test the documentation site's deploy image
        run: uv run poe smoke-site-image
      # The live demo's deploy image, built from THIS tree's wheel
      # (deploy/demo/Dockerfile is what `fly deploy` builds for
      # demo.m0serve.dev) and probed from outside the container: the page and
      # its version line, per-visitor channels a stranger cannot hear, an SSE
      # hold and a WebSocket hold, the 413 and 429 limits, m0serve as PID 1,
      # and `docker stop` as the drain with held connections open.
      - name: Smoke test the live demo's deploy image
        run: uv run poe smoke-demo
      # The Mojo demo's deploy image (deploy/mojo/Dockerfile for apps/blobs,
      # what `fly deploy` builds for blobs.m0serve.dev): the pinned toolchain
      # compiles the tree inside the builder stage -- on this x86-64 runner,
      # with --target-cpu x86-64-v2, the only x86 Mojo build CI makes -- and
      # the runtime stage carries the binary and nothing else. Probed from
      # outside: PID 1, no interpreter, the page's claims about the image
      # true, the producer stepping and streaming through the published
      # port, and `docker stop` ending a held stream with exit 0.
      - name: Smoke test the Mojo demo's deploy image
        run: uv run poe smoke-blobs-image
      # What `m0 new` writes under deploy/, built AS WRITTEN by the user's own
      # `uv run m0 image` -- the Dockerfile byte for byte, `uv sync --frozen`
      # and all -- and probed from outside: about.json says no Python and the
      # baseline CPU, the binary is PID 1, the views template's wire (its 422
      # fragment included) through the published port, `docker stop` exit 0.
      # The first x86-64 build of the scaffold's image. The tree's wheel,
      # which no index serves, arrives in a base image that replaces
      # python:3.13-slim as a named build context.
      - name: Smoke test the m0 scaffold's deploy image
        run: uv run poe smoke-scaffold-image
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-pid1
          path: ci-results.jsonl
          if-no-files-found: ignore

  # E11: the handler pool's GIL hand-off, judged by job order. Four pool
  # threads under a CPU-bound view at sixteen connections must answer in
  # order, and the barrier disabled must convoy. E34's keep arm is NOT
  # run here: this runner answers the keep rule's old shape in order (its
  # first run: 0 requests passed over, where the 4-vCPU KVM guest that
  # found the starvation shows 88-171), so it is a pre-release run on a
  # machine that starves (docs/notes/fairness-judged-by-order.md). A job
  # of its own rather than a step in `smoke-gateway`: it is Linux-only,
  # the spec checker rightly rejects a cited step carrying an `if:`, and a
  # timing probe wants a runner with nothing else running on it. The pid1
  # shape: job-level runs-on, no step-level condition on the cited step.
  # macOS stays the reference Mac's, before a release (docs/RELEASING.md).
  pool-fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: pool-fairness
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - name: Probe the handler pool's GIL hand-off for fairness
        run: uv run poe probe-pool-fairness
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-pool-fairness
          path: ci-results.jsonl
          if-no-files-found: ignore

  # E13/E14/M18: what only an Apple Silicon runner can check -- the
  # performance-core count against sysctl, the --qos knob, and the native
  # build flavor naming its host. The smoke matrix's macOS leg could host
  # it, but the spec checker rightly rejects a cited step carrying an
  # `if:`, so it is the pid1 shape with the OS swapped: job-level runs-on,
  # no step-level conditions on the cited step.
  apple-silicon:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: apple-silicon
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run poe build-all
      - name: Smoke test Apple Silicon topology, QoS and the native build flavor
        run: uv run poe smoke-apple-silicon
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-apple-silicon
          path: ci-results.jsonl
          if-no-files-found: ignore

  smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # NOT `needs: unit-tests`. It was, and the serialization cost 18-26 min
    # on the front of every run while catching nothing: in the three most
    # recent failing `Tests` runs (35515503893, 35477118692, 35477093973)
    # the failure was in a smoke job every time and `unit-tests` was green
    # every time. The repository is PUBLIC, so the minutes are free and the
    # macOS 10x multiplier does not bill; observed queueing is under 90 s.
    # What the gate really protected against -- a doc-fact drift, or a
    # broken `build-all` lighting up every job at once -- is answered by
    # `Docs`, which is unfiltered, always reports, and is the ONE required
    # check on `main` (see CLAUDE.md).
    # THE SMOKES ARE TWO JOBS, and the split is a cap, not taste. One job
    # ran 30m17s green on `main` and the ubuntu leg was cancelled at the
    # 35-minute cap four times across two pull requests -- always mid
    # `Smoke test the Django realtime example over WebSockets`, the last
    # long step, on a runner that was simply slower (its unit-tests leg
    # took 26m1s against the usual 18m0s). A cap a green run reaches is a
    # coin toss, so the work is halved AND the cap left at roughly twice
    # the measured run: this job and `smoke-gateway` divide `main`'s own
    # step times into 12.0 and 13.1 min on ubuntu, 13.2 and 12.8 on macOS,
    # against 30. The slowest runner observed
    # so far was 1.45x (that 26m1s unit-tests leg), which lands a 14 min
    # job at 21; 30 still turns a wedged server into a failure rather than
    # a six-hour hang, and the cap is not the thing that has to be right
    # to the minute.
    #
    # Shards are SEPARATE JOBS, never one job with `if: matrix.shard`:
    # scripts/spec_sheet.py refuses a SPEC row whose cited step carries an
    # `if:`, because a conditional step is not evidence that it ran.
    # Moving a step between the two jobs is free -- the sheet reads step
    # NAMES out of this file and does not care which job holds one -- but
    # renaming or deleting one is what it is there to catch.
    timeout-minutes: 30
    env:
      # Where `scripts/emit.py` appends the measurements the smokes already
      # compute (RSS growth, fast-request latency). Unset locally, which makes
      # every call site a no-op there; the script also always exits 0, so a
      # recording failure can never turn a green gate red.
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        # Normally ~6 s. Observed hanging for 63 min against an unreachable
        # apt mirror, which is what a step-level cap turns into a fast,
        # legible failure — the job cap above is the backstop, this is the
        # one step known to stall.
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - name: Build all packages
        run: uv run poe build-all
      # `Compile every example app` is deliberately NOT here. It builds each
      # app into a mktemp dir and DISCARDS the binaries, so nothing in this
      # job could consume it even in principle: every row either `mojo run`s
      # its app, `mojo build`s its own copy, or serves through bin/m0serve.
      # It is a compile gate, `poe test-all` runs it in the unit-tests job,
      # and it cost 4 min a leg -- twice over, once per shard -- to
      # re-answer a settled question. The discarded output is the reason,
      # not any ordering against unit-tests, which now runs in parallel.

      # The serve CLI. Most of this job's rows are Mojo, but the timeout,
      # keep-alive, sendfile and site rows all serve through it, and the
      # tasks declare it as a poe dep -- building it as a step keeps that
      # cost out of whichever smoke happens to run first.
      - name: Build the serve CLI
        run: uv run poe build-serve
      # Emits libm0core.so (.dylib on macOS) and drives it through ctypes —
      # the same dlopen path Bun or N-API takes — against public hash vectors.
      - name: Smoke test the C-ABI shared library
        run: uv run poe smoke-ffi
      # The property smoke-ffi cannot test: that the artifact loads somewhere
      # OTHER than the machine that built it. smoke-ffi dlopens it in the
      # build tree, where the venv it linked against still exists, so it
      # passes on exactly the machine where the defect cannot appear — which
      # is how a broken asset shipped in seven releases. This asserts the
      # bundle is self-contained, and fails if it ever regresses.
      - name: Assert the C-ABI bundle is self-contained
        run: uv run poe bundle-ffi
      # The same gate for the CLI binary, which shipped without one. Every
      # bin/m0serve ever built recorded a search path into its build venv;
      # this asserts the bundled artifact resolves the runtime beside itself
      # instead, and that the licences it must carry travel with it.
      - name: Assert the m0serve bundle is self-contained
        run: uv run poe bundle-serve
      # The artifact a user actually installs. Builds the wheel with its
      # platform tag MEASURED from the staged binaries, installs it into a
      # throwaway venv outside this tree on a different Python minor, serves
      # a real WSGI app through it with the environment scrubbed, and asserts
      # it stops working when its bundled runtime is removed. That last one
      # matters most: if it still ran, the bundle would be a placebo and the
      # binary would be resolving the runtime from the build venv.
      #
      # This is the repo-side half only. A poe task runs where
      # .venv/.../modular/lib exists, which is the directory a stale rpath
      # would name, so it cannot prove portability on its own -- that is what
      # the clean consumer jobs in release.yml are for.
      - name: Build and smoke test the installable wheel
        run: uv run poe smoke-wheel
      # The doc a stranger follows, executed: QUICKSTART.md's and docs/QUICKSTART_NEXT.md's fenced blocks
      # run against the tree's own wheel. A code change that breaks the
      # quickstart, or a quickstart edit that breaks the path, fails here.
      - name: Execute the quickstart
        run: uv run poe smoke-quickstart
      - name: Smoke test the hello server
        run: uv run poe smoke-hello
      # Both stop paths: SIGTERM draining a single process, and a SIGTERM aimed
      # at the supervisor alone reaching its workers — which is what `docker
      # stop` does, and what used to leave them orphaned on the port.
      - name: Smoke test graceful shutdown
        run: uv run poe smoke-shutdown
      - name: Smoke test spawned workers
        run: uv run poe smoke-spawn-workers
      # SPEC E16: the worker that wins an accept passes the connection to
      # the least-loaded sibling, so a burst of keep-alive connections
      # spreads across --workers instead of landing on one (32 of 32 on
      # macOS, 23-31 of 32 on Linux, before). Both legs, both worker modes.
      - name: Smoke test accept sharing
        run: uv run poe smoke-accept-spread
      # SPEC C8: a burst of new connections does not hold the loop away
      # from the connections it already serves. A pass admits at most one
      # batch of them, after the events of the ones it holds; before, the
      # epoll drain ran to EAGAIN and a keep-alive request waited out the
      # whole backlog (625 ms behind 120 queued 5 ms requests). Both legs;
      # the knob-off arm, the old drain, is asserted on Linux.
      - name: Smoke test the accept batch
        run: uv run poe smoke-accept-batch
      # The drain's other half (SPEC D9): a request whose body is still
      # arriving when SIGTERM lands is read on and answered, in both
      # execution shapes, and the process leaves inside 3 s of the signal
      # instead of resetting the client at the 5 s deadline.
      - name: Smoke test the drain with an upload in flight
        run: uv run poe smoke-drain-upload
      # The one deadline with no event to hang itself on: a client that
      # connects and says nothing is never readable. Also pins the inverse —
      # a keep-alive gap past the header timeout must NOT be answered 408.
      - name: Smoke test the header read timeout
        run: uv run poe smoke-header-timeout
      # The other deadline, and the one a shipped fix depends on: the idle
      # sweep is what bounds the WebSocket close linger (RFC 6455 5.5.1).
      # Nothing asserted it until this step, and writing it found the bound
      # broken -- the linger re-armed on every loop pass, so a peer that
      # never answered Close held its slot forever.
      - name: Smoke test the idle connection timeout
        run: uv run poe smoke-idle-timeout
      # The two backends genuinely disagree about trigger mode, and used to
      # disagree about half-close too; each disagreement hid a bug on the
      # platform that forgives it. These smokes run on both runners for
      # that reason.
      #
      # kqueue reports the peer's shutdown as EV_EOF on the read filter,
      # and epoll only matches it because add_read registers EPOLLRDHUP —
      # the bug this pins lost nearly every response on macOS and none on
      # Linux, and its truncated-request case now holds BOTH platforms to
      # a prompt close (Linux used to sit out the header timeout).
      - name: Smoke test a half-closed client
        run: uv run poe smoke-half-close
      # The same reset from the server's side. A 413 goes out while the
      # client is still uploading, and closing at once left the rest of the
      # body unread, which the kernel answers with RST -- so a client that
      # writes everything before it reads (http.client, so urllib and
      # requests) got BrokenPipeError and never the 413. The refusal now
      # lingers (RFC 9112 §9.6); this pins that the 413 is readable and
      # that the linger is bounded.
      - name: Smoke test a 413 reaching a client still uploading
        run: uv run poe smoke-early-413
      # The mirror image: connection reads are level triggered on kqueue and
      # edge triggered on epoll, so a request bigger than one read stalled on
      # Linux at exactly 8192 bytes while macOS served any size.
      - name: Smoke test a request larger than one read
        run: uv run poe smoke-large-request
      # RFC 9112 §9.3: pipelined requests get no readiness event of their
      # own — the read that completes request N consumed request N+1's
      # bytes with it — so answering them takes deliberate machinery, on
      # both backends. Every release through v0.12.0 answered only the
      # first request of a burst.
      - name: Smoke test pipelined requests
        run: uv run poe smoke-pipelining

      # The keep-alive request cap must close the connection, not destroy
      # the response it fires on. A stream and a WebSocket upgrade each own
      # their connection and clear `should_close` to say so; the cap check
      # read that state as permission to apply itself, so `_after_send`
      # closed the slot as the head drained -- a 200 with Content-Length and
      # an empty body, a 101 that never framed. Found by the 0.16.0 soak
      # against a real Django application, on every hundredth request.
      - name: Smoke test the keep-alive request cap
        run: uv run poe smoke-keepalive-cap

      # The framework showcase: routing with :id and a real 405, content
      # negotiation, ETag/304, problem+json, CORS, and M0_PORT config.
      - name: Smoke test the notes API
        run: uv run poe smoke-notes
      # The same resource as a server-rendered htmx app, gated on wire output
      # only: one URL answering a fragment under HX-Request and a document
      # without it with Vary on both, a urlencoded form round-tripping a
      # multi-byte title and a repeated checkbox key, a markup title
      # rendered inert, a non-form body refused, and 405 with Allow.
      # Plus N13, the login the notes now sit behind: a server that
      # refuses to start without its key or its password, an
      # unauthenticated page and swap, forged and expired cookies (each
      # signed by scripts/notes_session.py, so the verifier is never
      # checked against itself), the cookie's attributes, a write without
      # the CSRF token and with another session's, and logout.
      - name: Smoke test the fragment notes app
        run: uv run poe smoke-fragment-notes
      # The zero-copy claim, which only a real transfer can make: a 64MB
      # file served three times must arrive byte-exact while RSS stays
      # flat. Both platforms, because sendfile(2)'s signature and its
      # short-write reporting differ between them and a Darwin-only run
      # would exercise half the branch.
      - name: Smoke test zero-copy static file serving
        run: uv run poe smoke-sendfile
      # The documentation site: the tree's own pages rendered by
      # scripts/docsite.py and served the way it deploys -- m0serve with
      # `--static /=<tree>` in front of apps/site. The link check runs on
      # doc-only PRs through check-docs; this proves the SERVED shape:
      # llms.txt at the root as text naming the site's pages by absolute URL,
      # every sitemap URL answering as HTML with a markdown twin, the sitemap
      # as XML, and the slash redirect and HTML 404 from the app behind it.
      - name: Smoke test the documentation site
        run: uv run poe smoke-site
      # Both ends of the wire in Mojo: the client dials, sends, and parses
      # against the notes API, including the error and refusal paths.
      - name: Smoke test the HTTP client
        run: uv run poe smoke-client
      # RFC 6455 spoken raw from python's stdlib: handshake with the accept
      # key verified, masked echo, fragment reassembly, ping/pong both ways,
      # heartbeat cadence bounds, and the close handshake to the TCP FIN.
      - name: Smoke test the WebSocket echo demo
        run: uv run poe smoke-ws
      # The WebSocket sibling of the counter's fan-out proof: sockets spread
      # across two workers (concurrent-burst opens beat the accept-race bias),
      # then one message reaches every socket — the other worker's over the
      # BroadcastBus.
      # SPEC I17: a WebSocket message at or above the 64 KB outbox cap can
      # never be queued, so the server ends the connection rather than
      # dropping a message the peer cannot know it missed. The probe's
      # marker separates that from a silent drop; its under-cap half stops a
      # server that ends every large-message connection from passing.
      - name: Smoke test the outbox cap ending a connection
        run: uv run poe smoke-outbox-cap

      - name: Smoke test the WebSocket chat demo
        run: uv run poe smoke-chat
      # Proves the Datastar path end to end: a POST on one connection reaches a
      # different client's open SSE stream, single-framed and in spec order.
      - name: Smoke test the Datastar counter
        run: uv run poe smoke-counter
      # Periodic work with a real budget does not belong on the event loop,
      # and this is where that stops being an assertion. apps/sim_loop runs
      # the identical step in two places behind one variable: off the loop a
      # trivial request is unaffected, on it the same request waits out the
      # step. The on-loop arm is the load-bearing half -- without it the gate
      # would pass on a server doing no work at all. Also asserts the step
      # ids arrive contiguous (the bus is best-effort; at this cadence it
      # must not drop) and that SIGTERM with a step in flight still drains.
      - name: Smoke test periodic work off the event loop
        run: uv run poe smoke-sim-loop
      # The first application written for the Mojo-native stack: a Views
      # table that also streams, a producer thread publishing full-state
      # frames, the newest state sent at open, clicks crossing to the
      # producer over the shared page. Asserts every frame's shape, the
      # pause with nobody watching, a drain that stops the producer, and
      # the same on two workers, a click crossing from worker 1.
      - name: Smoke test the blobs demo
        run: uv run poe smoke-blobs
      # The Mojo host (m0_host.host.serve) on the smallest app that
      # uses all of it: the bus at one worker, every worker's streams get
      # every beat once, accept sharing, a drain signalled to the supervisor
      # alone, the producer's join bound, and the refusals before binding.
      - name: Smoke test the Mojo host
        run: uv run poe smoke-host
      # N loops on N threads of one process. No interpreter, so nothing here
      # skips on CI's GIL-enabled CPython: the first threaded SERVING gated
      # on every pull request (m0serve's threaded step proves its refusal).
      - name: Smoke test the Mojo host's loops on threads
        run: uv run poe smoke-host-threads
      # The host's command line. Every configuration is run both ways,
      # `--doctor ARGS` and `ARGS`, and the two exit codes must agree --
      # smoke-doctor's shape, for the Mojo host.
      - name: Smoke test the Mojo host's flags and doctor
        run: uv run poe smoke-host-doctor
      # The `m0` wheel, outside the tree: its contents against git's own
      # manifest, then fragment_notes built, tested and doctored by the CLI
      # from an installed wheel, and every refusal's sentence with no
      # network. The Linux leg is the first x86-64 build from all-source.
      - name: Smoke test the m0 wheel
        run: uv run poe smoke-m0-wheel
      # What `m0 new` writes, per template, as a user meets it: written by
      # `uvx --offline` with no toolchain on PATH, built by the literal
      # `uv run m0 build` against the tree's wheel, and asserted on the wire.
      - name: Smoke test the m0 scaffold
        run: uv run poe smoke-scaffold
      # The flagship: a mutation broadcasts the rendered fragment to a live
      # subscriber as one patch-elements frame.
      - name: Smoke test the Datastar todo demo
        run: uv run poe smoke-todo
      # MAX's parallel runtime, linked by an app that uses
      # `max.algorithm.parallelize`: the host serves it from one loop, from
      # loops on threads and from a pool thread, and refuses M0_WORKERS
      # above 1 with 78 before the bind -- a forked worker inherits the
      # runtime's bookkeeping and none of its threads, and a parallelize
      # there never returned (SPEC E32, DECISIONS D48). The `max` dependency
      # group is synced here and nowhere else; the next plain `uv run` puts
      # the venv back. Last among the smokes, with the m0serve step below
      # that shares the sync, so that its churn touches nothing after them.
      - name: Smoke test the Mojo host with MAX's parallel runtime
        run: |
          uv sync --group max
          uv run --group max poe smoke-parallel-runtime
      # The same runtime linked into m0serve by a Mojo mount, whose worker
      # model is prefork: --workers N and --reload are refused with 2 before
      # the bind, by the server and the doctor alike, --spawn-workers serves
      # a parallelize from two exec'd images, and the shipped binary, which
      # links no MAX, passes the check (SPEC E33). Under the `max` group the
      # step above synced.
      - name: Smoke test m0serve with MAX's parallel runtime
        run: uv run --group max poe smoke-serve-parallel-runtime
      # The measurements, rendered into the run's own summary page and kept as
      # an artifact. Until now every one of these numbers went to a job log
      # that expires, so "did it pass" was answerable and "is it drifting
      # toward the limit" was not. `always()`: a measurement from a smoke that
      # later failed is usually the interesting one.
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-${{ matrix.os }}
          path: ci-results.jsonl
          if-no-files-found: ignore

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.os }}
          path: |
            hello.log
            shutdown1.log
            shutdown2.log
            notes.log
            fragment.log
            counter.log
            todo.log
            serve.log
            threads.log
          if-no-files-found: ignore

  smoke-gateway:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # No `needs:`, for the reason spelled out on `smoke` above.
    # The gateway half of the smokes: the WSGI and ASGI bridges, the mounts,
    # the pool and the --realtime rows. `smoke` above carries the server and
    # the Mojo layer and explains why there are two jobs at all.
    timeout-minutes: 30
    env:
      # Where `scripts/emit.py` appends the measurements the smokes already
      # compute (RSS growth, fast-request latency). Unset locally, which makes
      # every call site a no-op there; the script also always exits 0, so a
      # recording failure can never turn a green gate red.
      M0_RESULTS: ${{ github.workspace }}/ci-results.jsonl
      M0_RESULTS_TAG: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        # Normally ~6 s. Observed hanging for 63 min against an unreachable
        # apt mirror, which is what a step-level cap turns into a fast,
        # legible failure — the job cap above is the backstop, this is the
        # one step known to stall.
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - name: Build all packages
        run: uv run poe build-all
      # The serve CLI: one binary for every WSGI row. Built here once; the
      # smoke-wsgi/django/flask tasks below depend on it and reuse it.
      - name: Build the serve CLI
        run: uv run poe build-serve
      # PEP 3333 conformance against a bare WSGI callable -- no framework, so a
      # wrong answer is the server's by construction. Covers surface no
      # framework-based test can reach: the write() callable, a second
      # start_response, multi-chunk iterables, wsgi.input read patterns.
      - name: Conformance test the WSGI bridge
        run: uv run poe smoke-wsgi
      # Streamed WSGI bodies: a generator streams from a pool thread through
      # the loop's chunk channel -- chunked, keep-alive kept, close() called,
      # the thread back when the client leaves -- while lists and sized
      # bodies still buffer. Both runners, because every stream bug in this
      # tree has been invisible on one of them.
      - name: Smoke test streamed WSGI bodies
        run: uv run poe smoke-wsgi-stream
      # Proves the WSGI bridge end to end: a real Django request/response cycle,
      # two Set-Cookie headers surviving a Dict-backed Headers, and a body of all
      # 256 byte values coming back unchanged.
      - name: Smoke test the Django WSGI example
        run: uv run poe smoke-django
      # The second framework row. It asserts nothing of its own -- it runs the
      # same contract script as the Django row against a different framework,
      # which is the only way to tell a framework-agnostic host from one that
      # happens to suit the single framework it was developed against.
      - name: Run the WSGI framework contract against Flask
        run: uv run poe smoke-flask
      # The Flask half of the headline claim: the quickstart's Flask file,
      # extracted from docs/QUICKSTART_NEXT.md itself, holds SSE streams and WebSockets
      # across two workers under the same RFC 6455 probe the Django rows use.
      - name: Smoke test the Flask realtime views
        run: uv run poe smoke-flask-realtime
      # The ASGI row, wsgi_bare's sibling: protocol auto-detection, the
      # buffered bridge's scope/receive/send contract, lifespan startup and
      # state, the streaming watchdog's clean refusal, spec discovery, the
      # zero-config handler pool (and its explicit-topology escape hatch),
      # and the same 10k-request RSS guard the Django row carries.
      - name: Conformance test the ASGI bridge
        run: uv run poe smoke-asgi
      # The flagship ASGI framework row: a FastHTML (Starlette) app served
      # as main:app. Its whole surface -- pages, a live SSE EventStream and
      # an app.ws WebSocket -- runs zero-config through the executor. Skips
      # cleanly where python-fasthtml is absent.
      - name: Serve a FastHTML app through the ASGI bridge
        run: uv run poe smoke-fasthtml
      # The second Starlette-family row, and the one that lets the landing
      # page name FastAPI: same seam, driven through FastAPI's own routing,
      # StreamingResponse and WebSocket API. It asserts the seam and not the
      # framework -- validation and the OpenAPI page are FastAPI's to test --
      # and reads the server LOG, because the shim once marked Starlette's
      # anyio child task and left a traceback per streamed response while
      # every body arrived intact. Skips cleanly where fastapi is absent.
      - name: Serve a FastAPI app through the ASGI bridge
        run: uv run poe smoke-fastapi
      # Two applications, one process: Django and Flask at different
      # prefixes. The load-bearing assertions are the generated URLs --
      # reverse() and url_for() must carry the mount prefix, which is what
      # breaks silently when SCRIPT_NAME and PATH_INFO disagree -- plus the
      # 404 for an unmounted path, answered in Mojo without entering Python.
      - name: Serve two mounted applications from one process
        run: uv run poe smoke-hybrid
      # The mount that hosts no Python. Two routes of ONE server measured
      # under GIL-bound load: the Mojo mount's thread never attaches to the
      # interpreter, so its tail stays flat while the Python route convoys
      # behind the lock. A shared execution mode cannot pass it, and the
      # probe's `--mojo-path` pointed at a Python route is the negative arm.
      - name: Smoke test a Mojo mount beside a Python one
        run: uv run poe smoke-mojo-mount
      # A Mojo view takes an SSE hold on its pool thread with the two headers
      # a Django view uses, and a publish from Django reaches it (SPEC N11).
      - name: Smoke test an SSE hold from a Mojo mount
        run: uv run poe smoke-mojo-mount-hold
      # An application's own Mojo mount, supplied as a module in its own
      # directory and built into m0serve without copying the entry file;
      # the demo's routes must be gone, not merely outnumbered (SPEC N14).
      - name: Smoke test a Mojo mount supplied by module
        run: uv run poe smoke-mount-seam
      # One views module compiled into m0serve as a mount and into a host
      # binary, compared on the wire: byte-identical under the prefix, a
      # rendered link followed on each, and a trivial route kept answered
      # beside slow views on both, with the bare host loop as the negative
      # arm (SPEC N20).
      - name: Smoke test one views module on two hosts
        run: uv run poe smoke-ramp
      # A stream held on a Mojo pool thread against a grant Django signed
      # into the URL: session-bound, expiring, rotatable (SPEC I21).
      - name: Smoke test the grant-verified hold mount
        run: uv run poe smoke-hold-mount
      # Django's own ASGI handler: async views, live StreamingHttpResponse,
      # sessions, and scope["client"] -- Django logs every visitor as
      # address-less when the server sends client: None, silently.
      - name: Serve a Django ASGI project through the executor
        run: uv run poe smoke-django-asgi
      # Cross-worker pub/sub for ASGI apps: state["m0"] over the
      # BroadcastBus -- one publish reaching subscribers on every worker,
      # no Redis. Spread, delivery, distinct shared-atomic ids, SIGTERM
      # with a live stream, and the single-worker degenerate case.
      - name: ASGI cross-worker fan-out over the BroadcastBus
        run: uv run poe smoke-asgi-fanout
      # The CLI as a user meets it: --help/--version, usage (2) and startup
      # (1) exit codes — including a supervisor that gives up — a typed flag
      # beating the environment, a static mount, --max-body, --metrics.
      - name: Smoke test the serve CLI
        run: uv run poe smoke-serve
      # --doctor's whole value is that its exit code equals the one m0serve
      # itself would produce for the same arguments, and the two are kept in
      # step by hand: the doctor mirrors main's check order rather than
      # sharing its control flow. This runs BOTH over every refusal and
      # compares, which is the only way that stays true.
      - name: Smoke test --doctor against the server's own exit codes
        run: uv run poe smoke-doctor
      # The threaded mode's guard: on these GIL-enabled runners M0_THREADS>1
      # must refuse to start with exit 78 and a sentence naming the
      # requirement. The mode itself is proven weekly by py-canary on 3.14t.
      - name: Smoke test the threaded mode's guard
        run: uv run poe smoke-threads
      # The same guard for a MOUNTED server (SPEC M24): a mount set under
      # --threads on these runners is refused with 78, never served. What
      # the task proves on 3.14t -- WSGI mounts per lane, isolation, the
      # pinned ASGI refusal -- is py-canary's weekly phase G (M23).
      - name: Smoke test mounts under the threaded mode's guard
        run: uv run poe smoke-mounts-threads
      # Stage B, the part that does NOT need free-threading: a pool under a
      # GIL-enabled interpreter still isolates a sleeping view, because a view
      # that waits releases the GIL. The measurement -- a fast request answered
      # while two 1.5s views are in flight -- is the whole reason the mode
      # exists, so it is asserted here rather than only in a benchmark.
      - name: Smoke test the blocking-threads pool
        run: uv run poe smoke-blocking-threads
      # E19, the other half of that row's claim. Isolation is what the step
      # above proves; this proves the pool's threads actually overlap, which
      # depends on the view releasing the GIL and is invisible until measured.
      # A ratio comparison between two modes of one route, never a wall-clock
      # threshold, so a loaded shared runner does not decide it.
      - name: Smoke test pool parallelism
        run: uv run poe smoke-pool-parallelism
      # E20, the shapes WITHOUT a pool. The loop calls the application
      # itself there, and it used to wait for I/O holding the GIL, so a
      # thread the app started ran only when a request ran Python (#310).
      # A count of an app thread's ticks over an idle window: 1 before the
      # fix and ~120 after, against a bar of 20.
      - name: Smoke test application threads without a pool
        run: uv run poe smoke-app-threads
      # I23 (#322): a child process a view starts publishes onto the bus.
      # Inheriting the environment used to hand it an address in the
      # parent's memory -- SIGSEGV on Linux, a write into its own memory on
      # macOS -- so every non-handoff child must publish unnumbered and exit
      # 0, and a child given m0pub.child_fds() must number from the shared
      # counter, in three server shapes.
      - name: Smoke test publishing from a child process
        run: uv run poe smoke-child-publish
      # G16: a child process the application starts with close_fds=False
      # (os.system, pty.fork) holds none of the server's descriptors -- no
      # client connection, listener, channel, shutdown pipe or shared page
      # -- in six shapes: the pool, the loop, forked and spawned workers,
      # --realtime and the ASGI executor. A connection the server closed
      # used to stay open in such a child.
      - name: Smoke test what a child process the application starts inherits
        run: uv run poe smoke-exec-inherit
      # The Mojo handler pool, same claim without an interpreter: func on a
      # pool thread (the response names which), every thread dealt work, a
      # streaming response refused with 409, and SIGTERM a clean exit -- the
      # last one is the pill-count rule the sabotage script can only observe
      # on Linux, asserted here behaviourally on both platforms.
      - name: Smoke test the Mojo handler pool
        run: uv run poe smoke-pool
      # The loop inversion (M0_INVERTED=1): the whole ASGI smoke -- streaming,
      # WebSockets, the RSS guard, the recycled-slot probe -- on the path where
      # the event loop runs INSIDE asyncio, on one thread. Both platforms, and
      # ubuntu is the important one: the epoll half of the inversion has no
      # other exerciser, the development box being a Mac.
      - name: Smoke test the ASGI executor under the loop inversion
        run: M0_INVERTED=1 uv run poe smoke-asgi
      # Hot reload: a changed .py must be served by a NEW worker pid, at one
      # worker and at two, without any of it going through the crash-respawn
      # path -- a reload is a graceful shutdown followed by a fork.
      - name: Smoke test hot reload
        run: uv run poe smoke-reload
      # The hybrid row: a sync Django view's M0-Hold response becomes a live
      # SSE subscription, and its publish (pure-Python bus datagrams) reaches
      # subscribers held by both workers -- ASGI's realtime surface without ASGI.
      - name: Smoke test the Django realtime example
        run: uv run poe smoke-django-realtime
      # The other half of the hybrid row. Django cannot emit a 101 -- its
      # response is buffered and re-encoded -- so it approves the upgrade with
      # a header and the Mojo layer performs the handshake; inbound frames come
      # back to it as ordinary POSTs. One publish then reaches SSE streams AND
      # WebSockets on both workers, which is the claim worth a CI step.
      - name: Smoke test the Django realtime example over WebSockets
        run: uv run poe smoke-django-realtime-ws
      # Both rows above take their holds SEQUENTIALLY, so with a pool
      # configured the number in flight is one. This one takes N at once off
      # a barrier, so N pool threads produce hold frames into the single bus
      # channel within the same window. Its own --selftest runs first,
      # because the result it reports is a negative.
      - name: Concurrent --realtime holds from a pool
        run: uv run poe smoke-realtime-holds
      # Inbound WebSocket flow control. A client that stalls used to lose
      # 2932 of 3000 messages silently; the loop now stops READING rather
      # than dropping. The probe sends WITHOUT reading until the socket
      # stops taking, then reads and sends together and requires every
      # message -- a concurrently-reading client loses nothing even on the
      # broken build, so that shape would gate nothing.
      - name: Inbound WebSocket messages survive a stalled client
        run: uv run poe smoke-ws-inbound
      # A11: the expectation-name is case-insensitive, and HTTP/1.0 clients
      # MUST NOT be sent 100 Continue. Both halves gated, because a server
      # that answers it unconditionally passes the first while discarding
      # the point of the mechanism.
      - name: Expect 100-continue, honoured and withheld
        run: uv run poe smoke-expect-continue
      # The measurements, rendered into the run's own summary page and kept as
      # an artifact. Until now every one of these numbers went to a job log
      # that expires, so "did it pass" was answerable and "is it drifting
      # toward the limit" was not. `always()`: a measurement from a smoke that
      # later failed is usually the interesting one.
      - name: Record the measurements
        if: always()
        run: |
          python3 scripts/emit.py --summary "$M0_RESULTS" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/emit.py --summary "$M0_RESULTS" || true
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-${{ matrix.os }}-gateway
          path: ci-results.jsonl
          if-no-files-found: ignore

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.os }}-gateway
          path: |
            django.log
            django2.log
            django3.log
            wsgi.log
            flask.log
            serve.log
            threads.log
            rt.log
            rt2.log
            rt3.log
            ws1.log
            ws2.log
          if-no-files-found: ignore
