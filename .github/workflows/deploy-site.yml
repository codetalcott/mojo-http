# Deploy the documentation site (https://m0serve.dev) to Fly.io.
#
# Runs after a successful `Release` workflow, so the site always serves the
# wheel that release put on PyPI (the image pins that version), and on demand
# with a version to pin. It is deliberately NOT triggered by pushes to main:
# the pages there describe main, but the server behind them is the released
# one, and a deploy per merge would re-pin nothing while re-rendering prose
# about capabilities the deployed server may not have yet.
#
# Needs one secret, FLY_DEPLOY_SITE, in the `fly` environment: a deploy
# token scoped to the app (`fly tokens create deploy -a m0serve-docs`),
# handed to flyctl as FLY_API_TOKEN below. deploy/site/README.md is the
# runbook, including the one-time app and certificate creation.
name: Deploy site

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "m0serve version on PyPI to pin (e.g. 0.17.0)"
        required: true
        type: string

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # A failed release deploys nothing; a release run from a branch push
    # (release/v*) has no tag and deploys nothing either.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fly
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap's lastmod and each page's JSON-LD dates
          # come from git log, and a shallow clone would stamp today on all.
          fetch-depth: 0
      - name: Resolve the version to pin
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${{ github.event.workflow_run.head_branch }}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "pinning m0serve==$v"
      # PyPI can lag the release by a minute; the remote builder's pip
      # install must not be the thing that discovers that.
      - name: Wait for the wheel on PyPI
        run: |
          for i in $(seq 1 30); do
            pip download --no-deps --quiet -d /tmp/w "m0serve==${{ steps.v.outputs.version }}" && exit 0
            sleep 20
          done
          echo "::error::m0serve==${{ steps.v.outputs.version }} never appeared on PyPI"; exit 1
      - uses: astral-sh/setup-uv@v7
      - name: Render the site for m0serve.dev
        # --no-project: the repository's own environment pins a Mojo
        # toolchain this job has no use for.
        run: uv run --no-project --with markdown-it-py python scripts/docsite.py --out dist/site --base-url https://m0serve.dev
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_SITE }}
        run: >-
          flyctl deploy --remote-only --config deploy/site/fly.toml
          --build-arg M0SERVE_VERSION=${{ steps.v.outputs.version }} .
      - name: Verify the live site
        run: |
          set -e
          curl -sSf -o /dev/null https://m0serve.dev/health
          curl -sSf https://m0serve.dev/llms.txt | grep -q '](https://m0serve.dev/docs/spec.md)'
          curl -sSfI https://m0serve.dev/sitemap.xml | grep -qi '^content-type: application/xml'
          echo "m0serve.dev is serving the site pinned to m0serve==${{ steps.v.outputs.version }}"
