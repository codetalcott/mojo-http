# Deploy the documentation site (https://m0serve.dev) to Fly.io.
#
# Runs after a successful `Release` workflow, so the site always serves the
# wheel that release put on PyPI (the image pins that version), and on demand
# with a version to pin. It is deliberately NOT triggered by pushes to main:
# the pages there describe main, but the server behind them is the released
# one, and a deploy per merge would re-pin nothing while re-rendering prose
# about capabilities the deployed server may not have yet.
#
# Needs two secrets in the `fly` environment, each a deploy token scoped to
# ONE app (`fly tokens create deploy -a <app>`) and handed to flyctl as
# FLY_API_TOKEN below: FLY_DEPLOY_SITE for the docs site (m0serve-docs) and
# FLY_DEPLOY_DEMO for the live demo (m0serve-demo), which the second job
# deploys on the same trigger. deploy/site/README.md and deploy/demo/README.md
# are the runbooks, including the one-time app and certificate creation.
name: Deploy site

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "m0serve version on PyPI to pin (e.g. 0.17.0)"
        required: true
        type: string

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # A failed release deploys nothing. A successful one arrives with the
    # ref it ran for as `head_branch`: the tag (`v0.17.0`) for a tag push,
    # or the branch (`release/v0.17.0`) for the branch form, which creates
    # the tag inside the run -- and is the form the runbook recommends for
    # automation. Both carry the version; the first release (0.17.0, via
    # the branch form) was skipped here because only the tag form was
    # accepted, and had to be dispatched by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        startsWith(github.event.workflow_run.head_branch, 'release/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fly
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap's lastmod and each page's JSON-LD dates
          # come from git log, and a shallow clone would stamp today on all.
          fetch-depth: 0
      - name: Resolve the version to pin
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${{ github.event.workflow_run.head_branch }}"; v="${v#release/}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "pinning m0serve==$v"
      # PyPI can lag the release by a minute; the remote builder's pip
      # install must not be the thing that discovers that.
      - name: Wait for the wheel on PyPI
        run: |
          for i in $(seq 1 30); do
            pip download --no-deps --quiet -d /tmp/w "m0serve==${{ steps.v.outputs.version }}" && exit 0
            sleep 20
          done
          echo "::error::m0serve==${{ steps.v.outputs.version }} never appeared on PyPI"; exit 1
      - uses: astral-sh/setup-uv@v7
      - name: Render the site for m0serve.dev
        # --no-project: the repository's own environment pins a Mojo
        # toolchain this job has no use for.
        run: uv run --no-project --with markdown-it-py python scripts/docsite.py --out dist/site --base-url https://m0serve.dev
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_SITE }}
        run: >-
          flyctl deploy --remote-only --config deploy/site/fly.toml
          --build-arg M0SERVE_VERSION=${{ steps.v.outputs.version }} .
      - name: Verify the live site
        run: |
          set -e
          # `flyctl deploy` returns when the machines report healthy, not when
          # the edge is stable: a first deploy creates a second machine and
          # bounces the first, and a connection opened in that window gets a
          # TLS EOF from the proxy (2026-09-03, the demo's first deploy). So
          # wait for the health path to answer three times in a row first.
          for i in $(seq 1 24); do
            ok=0
            for j in 1 2 3; do
              curl -sf -o /dev/null --max-time 5 https://m0serve.dev/health && ok=$((ok+1))
              sleep 1
            done
            [ "$ok" = 3 ] && break
            sleep 5
          done
          [ "$ok" = 3 ] || { echo "::error::m0serve.dev/health never answered steadily"; exit 1; }
          curl -sSf https://m0serve.dev/llms.txt | grep -q '](https://m0serve.dev/docs/spec.md)'
          curl -sSfI https://m0serve.dev/sitemap.xml | grep -qi '^content-type: application/xml'
          echo "m0serve.dev is serving the site pinned to m0serve==${{ steps.v.outputs.version }}"

  # The live demo beside the docs (https://demo.m0serve.dev): its own Fly
  # app, its own token, the same pinned wheel. Independent of the site's job
  # on purpose -- a failure in one must not hold the other back -- so the two
  # small version steps are repeated rather than shared through outputs.
  deploy-demo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        startsWith(github.event.workflow_run.head_branch, 'release/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fly
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the version to pin
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${{ github.event.workflow_run.head_branch }}"; v="${v#release/}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "pinning m0serve==$v"
      - name: Wait for the wheel on PyPI
        run: |
          for i in $(seq 1 30); do
            pip download --no-deps --quiet -d /tmp/w "m0serve==${{ steps.v.outputs.version }}" && exit 0
            sleep 20
          done
          echo "::error::m0serve==${{ steps.v.outputs.version }} never appeared on PyPI"; exit 1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_DEMO }}
        run: >-
          flyctl deploy --remote-only --config deploy/demo/fly.toml
          --build-arg M0SERVE_VERSION=${{ steps.v.outputs.version }} .
      # The same probe `poe smoke-demo` runs against the image on every pull
      # request, minus the container phases: the page and its version line,
      # the cookie, the 403s, a held stream and socket, isolation, the limits.
      # The probe itself stays strict -- in --image mode it is the CI gate --
      # so the tolerance for a transient edge failure lives HERE: up to three
      # runs, 20 s apart. Three in a row is a defect.
      - name: Verify the live demo
        run: |
          set -e
          # `flyctl deploy` returns when the machines report healthy, not when
          # the edge is stable: a first deploy creates a second machine and
          # bounces the first, and a connection opened in that window gets a
          # TLS EOF from the proxy (2026-09-03, the demo's first deploy). So
          # wait for the health path to answer three times in a row first.
          for i in $(seq 1 24); do
            ok=0
            for j in 1 2 3; do
              curl -sf -o /dev/null --max-time 5 https://demo.m0serve.dev/health && ok=$((ok+1))
              sleep 1
            done
            [ "$ok" = 3 ] && break
            sleep 5
          done
          [ "$ok" = 3 ] || { echo "::error::demo.m0serve.dev/health never answered steadily"; exit 1; }
          for attempt in 1 2 3; do
            python3 scripts/demo_probe.py --url https://demo.m0serve.dev && break
            [ "$attempt" = 3 ] && { echo "::error::the live demo failed the probe three times"; exit 1; }
            echo "probe attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          curl -s https://demo.m0serve.dev/about | grep -q "\"m0serve\": \"${{ steps.v.outputs.version }}\""
          echo "demo.m0serve.dev is serving m0serve==${{ steps.v.outputs.version }}"
