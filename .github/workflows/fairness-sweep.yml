# TEMPORARY, removed before its pull request merges: the search for a load
# that makes the keep rule's old shape starve a waiter on GitHub's runner
# (docs/notes/fairness-judged-by-order.md, "GitHub's runner does not
# starve"). The first sweep found the probe's own load starving on all
# three runners it landed on (AMD EPYC 7763), where #397's one keep-arm run
# did not; this runs the TASK itself, keep arm on, three times on each of
# six runners, and names each runner's CPU, to tell a machine difference
# from a difference in how the task drives the arms.
name: Fairness sweep

on:
  push:
    branches: [claude/zen-hypatia-pr633x]
  workflow_dispatch:

jobs:
  task:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c, d, e, f]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - name: Which machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Hypervisor' || true
          uname -r
      - name: The probe as CI runs it, keep arm on, three times
        run: |
          for i in 1 2 3; do
            echo "=== run $i"
            M0_FAIRNESS_EXPECT_STARVATION=1 uv run poe probe-pool-fairness > run.log 2>&1; echo "rc=$?"
            grep -E '^pool_fairness_probe: (turn|keep)|probe-pool-fairness OK|still answered' run.log || tail -20 run.log
          done
