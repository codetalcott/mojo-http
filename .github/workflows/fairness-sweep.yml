# TEMPORARY, removed before its pull request merges: the search for a load
# that makes the keep rule's old shape starve a waiter on GitHub's runner
# (docs/notes/fairness-judged-by-order.md, "GitHub's runner does not
# starve"). The first sweep found the probe's own load starving on all
# three runners it landed on (AMD EPYC 7763), where #397's one keep-arm run
# did not. The second pass ran the TASK on six runners and two of them,
# newer Intel Xeons, failed its keep arm: GitHub's pool mixes CPUs. This
# third pass sweeps shapes around the base load on eight runners, each
# naming its CPU, to find one that starves the Intel runners too.
name: Fairness sweep

on:
  push:
    branches: [claude/zen-hypatia-pr633x]
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c, d, e, f, g, h]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - run: uv run poe build-serve
      - name: Sweep the shapes around the base load, both arms
        run: uv run python scripts/probes/fairness_sweep.py --shapes base,b0.15,b0.2,b0.45,b0.6,t3,t5,t6,t3-b0.2,t5-b0.45,c8,c32 --rounds 1 --seconds 8 --tag ${{ matrix.runner }} | tee sweep.txt
      - name: Summary
        if: always()
        run: sed -n '/^machine:/,$p' sweep.txt >> "$GITHUB_STEP_SUMMARY"
