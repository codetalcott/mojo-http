# TEMPORARY, removed before its pull request merges: the search for a load
# that makes the keep rule's old shape starve a waiter on GitHub's runner
# (docs/notes/fairness-judged-by-order.md, "GitHub's runner does not
# starve"). Three jobs are three runners, because the starvation is the
# machine's as much as the code's; each runs every shape in
# scripts/probes/fairness_sweep.py, both arms, twice.
name: Fairness sweep

on:
  push:
    branches: [claude/zen-hypatia-pr633x]
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - run: uv run poe build-serve
      - name: Sweep every shape, both arms
        run: uv run python scripts/probes/fairness_sweep.py --rounds 2 --seconds 10 --tag ${{ matrix.runner }} | tee sweep.txt
      - name: Summary
        if: always()
        run: sed -n '/^machine:/,$p' sweep.txt >> "$GITHUB_STEP_SUMMARY"
