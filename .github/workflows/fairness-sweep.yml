# TEMPORARY, removed before its pull request merges: the search for a load
# that makes the keep rule's old shape starve a waiter on GitHub's runner
# (docs/notes/fairness-judged-by-order.md, "GitHub's runner does not
# starve"). Three passes so far: the probe's own load starves every AMD
# EPYC 7763 runner and none of the others (Intel Xeon 8370C, 8573C,
# 6973P-C; AMD EPYC 9V45, 9V74), and the shapes around it split the
# machines along one line -- how many jobs a 1 ms slice holds, which a
# 0.3 ms view leaves on the 3/4 boundary. This fourth pass runs views near
# 0.65 ms, two jobs a slice on any of them, with the convoy arm too.
name: Fairness sweep

on:
  push:
    branches: [claude/zen-hypatia-pr633x]
  workflow_dispatch:

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c, d, e, f, g, h, i, j]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - run: uv run poe build-serve
      - name: Sweep two-job slices, every arm
        run: uv run python scripts/probes/fairness_sweep.py --shapes t3-b0.65,t5-b0.65,t3-b0.55,t3-b0.75,b0.65,base --convoy --rounds 2 --seconds 12 --tag ${{ matrix.runner }} | tee sweep.txt
      - name: Summary
        if: always()
        run: sed -n '/^machine:/,$p' sweep.txt >> "$GITHUB_STEP_SUMMARY"
