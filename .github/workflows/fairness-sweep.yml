# TEMPORARY, removed before its pull request merges: the search for a load
# that makes the keep rule's old shape starve a waiter on GitHub's runner
# (docs/notes/fairness-judged-by-order.md). Four passes found it: with the
# keep rule off, who starves is decided by how many jobs a 1 ms slice holds
# against the threads waiting, and a 0.65 ms view against five threads
# starved every runner of five CPU types. This fifth pass runs the TASK as
# CI now does -- that load, all three arms, the keep arm on by default --
# three times on each of ten runners, naming each runner's CPU.
name: Fairness sweep

on:
  push:
    branches: [claude/zen-hypatia-pr633x]
  workflow_dispatch:

jobs:
  task:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c, d, e, f, g, h, i, j]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      - run: uv run poe build-all
      - name: Which machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Hypervisor' || true
          uname -r
      # set +e: the task exits 1 at the first arm that fails, and the arms'
      # figures are the data here, failing or not.
      - name: The probe as CI runs it, three times
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== run $i"
            uv run poe probe-pool-fairness > run.log 2>&1
            echo "rc=$?"
            grep -E '^pool_fairness_probe: (turn|keep)|probe-pool-fairness OK|still answered|FAIL' run.log || tail -20 run.log
          done
          exit 0
