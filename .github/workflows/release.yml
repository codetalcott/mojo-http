# Publishes a GitHub release: builds libm0core on both platforms, proves
# each artifact through the same ctypes smoke CI runs, and attaches them.
#
# Three triggers, one job graph:
#   - tag push (v*): release an existing tag, the ordinary path.
#   - push to a release/v* branch: create the TAG named by the branch
#     (release/v0.1.0 → v0.1.0) at the pushed commit, and the release with
#     it. This is the path for automation whose credentials can push
#     branches but not tags — and whose workflow_dispatch runs get a
#     GITHUB_TOKEN capped to the dispatching integration's permissions,
#     which is exactly how the first v0.1.0 dispatch died with "Resource
#     not accessible by integration" on the releases API. A push-triggered
#     run carries an ordinary token that honours the permissions block.
#   - workflow_dispatch: same tag-and-release-in-one-run behavior, for
#     humans clicking Run workflow (a human dispatch is not capped).
#
# This workflow is additive — the automerge workflows key on the workflow
# named "Tests", which this deliberately is not.
name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.1.0)"
        required: true
        type: string
      sha:
        description: "Commit SHA the tag should point at"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libm0core.so
            asset: libm0core-linux-x86_64.so
          - os: macos-latest
            artifact: libm0core.dylib
            asset: libm0core-macos-arm64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the C-ABI shared library
        run: uv run poe build-ffi
      # The same proof CI runs on every commit: dlopen the artifact through
      # ctypes and assert the public FNV-1a/xxHash32 vectors. A release
      # asset that fails this must not ship.
      - name: Prove the artifact through ctypes
        run: uv run poe smoke-ffi
      # A bare .dylib is not usable on macOS: it resolves the Mojo runtime
      # beside itself, so the runtime has to travel with it. `bundle-ffi`
      # assembles that (discovering the dependency closure rather than naming
      # it) with both licences, and refuses to finish unless the result is
      # self-contained — so a release cannot ship an asset that only loads on
      # the runner. See docs/FFI_DISTRIBUTION.md.
      - name: Assemble the self-contained bundle
        run: uv run poe bundle-ffi
      - name: Stage the bundle under its platform name
        run: |
          dir=$(ls -d dist/libm0core-*)
          tar -czf "${{ matrix.asset }}.tar.gz" -C "$(dirname "$dir")" "$(basename "$dir")"
          # The bare library stays a separate asset: it is what anyone
          # building against a Mojo install already has, and removing it
          # would break existing download URLs.
          cp packages/m0-core/${{ matrix.artifact }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The wheel, and the only proof that matters for it.
  #
  # smoke-wheel runs in the repo, where .venv/.../modular/lib is on disk --
  # the exact directory a stale rpath would name -- so it cannot establish
  # that the wheel works anywhere else. That is the shape of the defect that
  # shipped for seven releases: a test passing on the one machine where it
  # cannot fail. The consume jobs below therefore have NO checkout, NO uv, no
  # toolchain and no DYLD_/LD_ variables, and they assert their own
  # cleanliness before they assert anything about the wheel -- otherwise
  # someone adds `actions/checkout` "to get a test app" and the proof
  # silently reverts with a green tick. scripts/check_docs.py enforces that.
  # ---------------------------------------------------------------------
  build-wheels:
    strategy:
      matrix:
        include:
          - os: macos-14
            plat: macos-arm64
          - os: ubuntu-22.04
            plat: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev patchelf
      # The runner images are PINNED, and the pin IS the floor: a Mojo binary
      # inherits the build host's SDK and glibc, so `macos-latest` would mean
      # the wheel's reach changed whenever GitHub rotated images. Do not
      # "modernize" these to -latest without moving the documented floors.
      - run: uv run poe build-all
      - run: uv run poe smoke-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/wheels/*.whl
          if-no-files-found: error

  # Static: does the wheel describe an artifact that can load elsewhere?
  # The one consume-side job allowed a checkout, because it needs scripts/ --
  # and it never runs the binary.
  wheel-inspect:
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels
      - name: Inspect every wheel without running anything
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for whl in wheels/*.whl; do
            found=$((found+1))
            echo "== $whl"
            case "$whl" in
              *-py3-none-any.whl) echo "::error::$whl is tagged py3-none-any"; exit 1 ;;
              *-py3-none-*) ;;
              *) echo "::error::unexpected tag on $whl"; exit 1 ;;
            esac
            d=$(mktemp -d); unzip -qq "$whl" -d "$d"
            bin=$(find "$d" -path '*/m0serve/_bin/m0serve')
            [ -n "$bin" ] || { echo "::error::no binary in $whl"; exit 1; }
            # Covers both formats and both questions: every search path is
            # self-relative, and every dependency is either shipped alongside
            # or one the platform supplies. On Linux that second half is what
            # turns "the executable links the Mojo runtime" from an
            # assumption into a measurement.
            python3 scripts/ffi_portability_check.py --require-self-contained "$bin"
          done
          [ "$found" -gt 0 ] || { echo "::error::no wheels to inspect"; exit 1; }
          echo "inspected $found wheel(s)"

  # Behavioural, in containers that have never seen this repository.
  wheel-consume-linux:
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Assert this machine did not build the wheel
        run: |
          set -eu
          test ! -d "$GITHUB_WORKSPACE/packages" || { echo "::error::repo present"; exit 1; }
          ! command -v mojo >/dev/null || { echo "::error::mojo on PATH"; exit 1; }
          test -z "${DYLD_LIBRARY_PATH:-}${LD_LIBRARY_PATH:-}${MOJO_PYTHON_LIBRARY:-}" \
            || { echo "::error::loader/interpreter variables are set"; exit 1; }
      # --network none is not decoration: it asserts the wheel needs nothing
      # fetched, which is what makes `pip install m0serve` a one-line story.
      - name: pip install and serve, on four CPython minors
        run: |
          set -euo pipefail
          for img in python:3.10-slim-bookworm python:3.12-slim-bookworm \
                     python:3.13-slim-bookworm python:3.14-slim-bookworm; do
            echo "== $img"
            docker run --rm --network none -v "$PWD/dist:/w:ro" "$img" sh -c '
              set -e
              pip install --quiet --no-index --no-deps /w/*.whl
              m0serve --version
              cd /tmp
              printf "def application(e, s):\n s(\"200 OK\", [(\"Content-Type\", \"text/plain\")])\n return [b\"ok from a clean container\"]\n" > app.py
              m0serve app:application --port 8123 & pid=$!
              for i in $(seq 1 40); do
                if wget -qO- http://127.0.0.1:8123/ 2>/dev/null | grep -q "ok from a clean container"; then
                  echo "  served OK"; kill $pid; exit 0
                fi
                sleep 0.5
              done
              echo "  never became healthy"; kill $pid 2>/dev/null; exit 1
            '
          done
      # A permanent negative control. The floor must be enforced by pip
      # REFUSING the wheel, not by a runtime GLIBC_2.x-not-found crash. This
      # needs no sabotage because it is one.
      - name: An older glibc must be refused, not crashed
        run: |
          set -euo pipefail
          if docker run --rm -v "$PWD/dist:/w:ro" quay.io/pypa/manylinux2014_x86_64 \
               /opt/python/cp312-cp312/bin/pip install --no-index --no-deps /w/*.whl 2>&1 | tee out; then
            echo "::error::a glibc 2.17 host accepted the wheel"; exit 1
          fi
          grep -qi "not a supported wheel\|no matching distribution" out \
            || { echo "::error::refused, but not for the platform-tag reason"; cat out; exit 1; }
          echo "correctly refused on an unsupported glibc"

  # macOS has no containers, so the separation available is a fresh runner in
  # a different job with none of the contamination vectors -- on macos-14,
  # the OLDEST arm64 image, which turns the declared macosx_ floor into a
  # measurement rather than a claim.
  wheel-consume-macos:
    needs: build-wheels
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel-macos-arm64
          path: dist
      - name: Assert this machine did not build the wheel
        run: |
          set -eu
          test ! -d "$GITHUB_WORKSPACE/packages" || { echo "::error::repo present"; exit 1; }
          ! command -v mojo >/dev/null || { echo "::error::mojo on PATH"; exit 1; }
          test -z "${DYLD_LIBRARY_PATH:-}${MOJO_PYTHON_LIBRARY:-}" \
            || { echo "::error::loader variables are set"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip install and serve
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v/bin/m0serve" --version
          printf 'def application(e, s):\n    s("200 OK", [("Content-Type", "text/plain")])\n    return [b"ok on a clean mac"]\n' > app.py
          "$RUNNER_TEMP/v/bin/m0serve" app:application --port 8124 &
          pid=$!
          curl --retry 40 --retry-delay 1 --retry-all-errors -sf http://127.0.0.1:8124/ | tee body
          kill $pid 2>/dev/null || true
          grep -q "ok on a clean mac" body

  publish:
    # The wheel consume jobs gate this, so a release cannot carry a wheel
    # that was never installed anywhere but the machine that built it.
    needs: [build-artifacts, wheel-inspect, wheel-consume-linux, wheel-consume-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      # The wheels ride along as release assets too, so anyone can pin to a
      # specific build without going through PyPI, and the sha256s are
      # recorded with them.
      - name: Record asset checksums
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Release notes come from the tag's CHANGELOG section living in the
      # repo; --generate-notes appends the commit list for completeness.
      # Where the tag does not exist yet (branch-push and dispatch paths),
      # --target makes gh create it at the requested commit.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          INPUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"; TARGET="$INPUT_SHA"
          elif [ "${GITHUB_REF#refs/heads/release/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF_NAME#release/}"; TARGET="$GITHUB_SHA"
          else
            TAG="$GITHUB_REF_NAME"; TARGET="$GITHUB_SHA"
          fi
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for the full release notes." \
            assets/*


  # Uploading to PyPI is deliberately opt-in and deliberately last.
  #
  # A PyPI filename is burned permanently: it cannot be re-uploaded after a
  # delete, and a yank (PEP 592) leaves the file installable by exact pin. So
  # this runs only when the repository variable PUBLISH_TO_PYPI is "true",
  # and only after the GitHub release has succeeded -- that one is fixable,
  # this one is not.
  #
  # ONE-TIME SETUP before flipping the variable:
  #   1. On PyPI, create a *pending* Trusted Publisher for project `m0serve`
  #      -- owner `codetalcott`, repository `mojo-http`, workflow
  #      `release.yml`, environment `pypi`. Pending publishers exist exactly
  #      so a project that does not exist yet can be claimed by a workflow,
  #      so no API token is ever created.
  #   2. Create the `pypi` environment in this repository's settings.
  #   3. Rehearse on TestPyPI with an rc first, then set PUBLISH_TO_PYPI.
  publish-pypi:
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Refuse to publish an incomplete or mismatched set
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 2 ] \
            || { echo "::error::expected 2 wheels, found ${#wheels[@]}"; exit 1; }
          plats=$(for w in "${wheels[@]}"; do basename "$w" | sed 's/.*-py3-none-//'; done | sort -u | wc -l)
          [ "$plats" -eq 2 ] || { echo "::error::wheels do not cover 2 platforms"; exit 1; }
          vers=$(for w in "${wheels[@]}"; do basename "$w" | cut -d- -f2; done | sort -u)
          [ "$(echo "$vers" | wc -l)" -eq 1 ] \
            || { echo "::error::wheels disagree about the version: $vers"; exit 1; }
          tag="${GITHUB_REF_NAME#release/}"
          [ "v$vers" = "$tag" ] \
            || { echo "::error::wheel version $vers does not match tag $tag"; exit 1; }
          echo "publishing $vers: ${wheels[*]}"
      - uses: pypa/gh-action-pypi-publish@release/v1
