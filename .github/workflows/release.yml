# Publishes a GitHub release: builds libm0core on both platforms, proves
# each artifact through the same ctypes smoke CI runs, and attaches them.
#
# Two triggers, one job graph:
#   - tag push (v*): release an existing tag, the ordinary path.
#   - workflow_dispatch: create tag AND release in one run, for callers
#     whose credentials can push branches but not tags (`gh release create`
#     makes the tag at --target when it does not exist). Runs against the
#     given commit, not whatever main has moved to.
#
# This workflow is additive — the automerge workflows key on the workflow
# named "Tests", which this deliberately is not.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.1.0)"
        required: true
        type: string
      sha:
        description: "Commit SHA the tag should point at"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libm0core.so
            asset: libm0core-linux-x86_64.so
          - os: macos-latest
            artifact: libm0core.dylib
            asset: libm0core-macos-arm64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the C-ABI shared library
        run: uv run poe build-ffi
      # The same proof CI runs on every commit: dlopen the artifact through
      # ctypes and assert the public FNV-1a/xxHash32 vectors. A release
      # asset that fails this must not ship.
      - name: Prove the artifact through ctypes
        run: uv run poe smoke-ffi
      - name: Stage the asset under its platform name
        run: cp packages/m0-core/${{ matrix.artifact }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      # Release notes come from the tag's CHANGELOG section living in the
      # repo; --generate-notes appends the commit list for completeness. On
      # dispatch, --target makes gh create the tag at the requested commit.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for the full release notes." \
            assets/*
