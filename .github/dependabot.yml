version: 2

updates:
  # Mojo toolchain + Python deps. Dependabot reads pyproject.toml and updates
  # uv.lock natively. Note it only bumps direct dependencies declared in
  # pyproject.toml — transitive pins in uv.lock ride along with those.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One PR for the whole toolchain rather than one per package: `mojo` pulls
    # mojo-compiler, mojo-lldb-libs and mblack in lockstep, and they must move
    # together anyway.
    groups:
      mojo-toolchain:
        patterns:
          - "mojo"
          - "mojo-*"
          - "mblack"
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "mojo"
          - "mojo-*"
          - "mblack"
    # The `pg` group's pin is chosen for the libpq it bundles, not for
    # freshness (pyproject.toml): a bump to a release bundling the runner's
    # own libpq major turns smoke-pg-notify's fourth arm red.
    ignore:
      - dependency-name: "psycopg"
      - dependency-name: "psycopg-binary"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Keeps the workflow actions current. These had drifted three majors behind
  # and onto the deprecated Node 20 runtime before being bumped by hand.
  # "/" reads .github/workflows only. The composite actions test.yml's jobs
  # share pin actions of their own, so their directories are listed too;
  # check_docs.py's check_dependabot_reads_actions holds this list to them.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
